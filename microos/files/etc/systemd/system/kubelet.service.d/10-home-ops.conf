[Unit]
Wants=containerd.service haproxy.service
After=containerd.service haproxy.service network-online.target

[Service]
EnvironmentFile=
ExecStart=
ExecStart=/usr/bin/kubelet \
  --config=/etc/kubernetes/kubelet.yaml \
  --bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubeconfig \
  --kubeconfig=/var/lib/kubelet/kubeconfig \
  --cert-dir=/var/lib/kubelet/pki \
  --hostname-override=kube-wrk-02 \
  --node-ip=192.168.1.112,fd2e:9a41:6b8c:1::112 \
  --node-labels=home-ops/os=microos
Restart=always
RestartSec=10
