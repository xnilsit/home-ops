# Stands in for Talos KubePrism, which cilium and the kubelet expect on 127.0.0.1:7445
global
  log stdout format raw local0

defaults
  mode tcp
  timeout connect 5s
  timeout client 1h
  timeout server 1h

frontend kubeprism
  bind 127.0.0.1:7445
  default_backend apiserver

backend apiserver
  default-server check inter 5s fall 2 rise 2
  server kube-srv-01 192.168.1.101:6443
  server kube-srv-02 192.168.1.102:6443
  server kube-srv-03 192.168.1.103:6443
