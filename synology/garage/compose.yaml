---
services:
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: garage
    # 3900-3903 are free on DSM, and host networking keeps rpc_public_addr honest
    network_mode: host
    restart: unless-stopped
    # GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN, decrypted by doco-cd
    env_file: secret.sops.env
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /volume1/docker/garage/meta:/var/lib/garage/meta
      - /volume1/garage/data:/var/lib/garage/data
    logging:
      # DSM's default json-file driver is unbounded
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
