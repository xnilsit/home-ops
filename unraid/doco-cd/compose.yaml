---
services:
  # Self-updating: the service and project name must stay doco-cd. No
  # container_name or ports, so an update can start the successor first.
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.130.0@sha256:174e1a8d6c239d67e127e89f9a89842119b7a6c13be8e16bfe468e31b1dd6240
    # Starts with the Docker daemon after an array stop; its first poll restarts the other stacks
    restart: always
    # Unraid's Docker tab: icon, and no template lookup or update check
    labels:
      net.unraid.docker.managed: doco-cd
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/doco-cd.png
    environment:
      TZ: Europe/Berlin
      SELF_UPDATE_ENABLED: "true"
      SELF_UPDATE_STRATEGY: auto
      DEPLOY_CONFIG_BASE_DIR: unraid/
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      POLL_CONFIG: |
        - url: https://github.com/xnilsit/home-ops.git
          reference: main
          interval: 5m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    secrets:
      - sops_age_key
    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  data:

secrets:
  sops_age_key:
    file: /mnt/user/appdata/doco-cd/age.key
