---
services:
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    container_name: garage
    # Host networking keeps rpc_public_addr honest
    network_mode: host
    restart: unless-stopped
    # Unraid's Docker tab: icon, and no template lookup or update check
    labels:
      net.unraid.docker.managed: doco-cd
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/garage.png
    # GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN, decrypted by doco-cd
    env_file: secret.sops.env
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      # The pool path, not /mnt/user: sqlite's WAL on shfs (FUSE) is fragile
      - /mnt/cache/garage-meta:/var/lib/garage/meta
      - /mnt/user/garage:/var/lib/garage/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
