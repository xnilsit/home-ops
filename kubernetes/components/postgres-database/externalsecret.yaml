---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-db
spec:
  # 0 freezes the value: any interval re-runs the generator and rotates the
  # password under a running Postgres. It also makes edits to the template
  # below silently inert - delete the target Secret to reshape it, which mints a
  # new password.
  refreshInterval: "0"
  target:
    name: *secret
    template:
      # basic-auth is required by the DatabaseRole passwordSecret.
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # REQUIRED - CNPG's secret informer is filtered on it. See
          # ../postgres-shared/database/externalsecret.yaml.
          cnpg.io/reload: "true"
      data:
        username: ${APP}
        password: "{{ .password }}"
        # require encrypts without verifying CNPG's self-signed serving cert.
        uri: postgresql://${APP}:{{ .password }}@${PG_CLUSTER}-rw:5432/${APP}?sslmode=require
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
