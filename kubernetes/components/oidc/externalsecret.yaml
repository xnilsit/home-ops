---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-oidc
spec:
  # Pulled rather than reflected: reflector acts on events only and silently
  # gives up on a mirror whose source did not exist yet, which is how the gatus
  # deploy stalled. This re-reads on the interval, so a rotated client_secret
  # lands within the hour without anyone touching the source.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tofu-controller
  target:
    name: *secret
    # Merge, not the default Owner: ./secret.yaml owns the object so the
    # credential is never momentarily absent - see the comment there.
    creationPolicy: Merge
  dataFrom:
    # client-id and client-secret, named by the tofu module because Envoy
    # Gateway reads exactly those two keys.
    - extract:
        key: ${APP}-oidc
