---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: ${APP}-oidc
  annotations:
    # Mirrors the Secret the tofu module writes from authentik's generated
    # client_id/client_secret. The source lists this namespace in its
    # reflection-allowed-namespaces, set from the app's `namespaces` in
    # tofu/authentik/locals.tf.
    reflector.v1.k8s.emberstack.com/reflects: tofu-controller/${APP}-oidc
type: Opaque
