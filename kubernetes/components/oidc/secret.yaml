---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
# Kept as an object even though ./externalsecret.yaml fills it, so the credential
# is never momentarily absent. Envoy Gateway drops a SecurityPolicy whose
# clientSecret it cannot resolve, and these routes are public - a few seconds
# between Flux pruning a Secret and ESO recreating one is a few seconds of an
# admin UI answering without a login. With the object left in place ESO merges
# into it and nothing is ever absent.
apiVersion: v1
kind: Secret
metadata:
  name: ${APP}-oidc
type: Opaque
