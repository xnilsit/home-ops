---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP}-postgres
spec:
  instances: ${PG_INSTANCES:=2}
  # Tag comes from PG_IMAGE_TAG, which the consuming ks.yaml must substitute
  # alongside APP so Renovate can bump it - see
  # kubernetes/apps/database/pg-shared/ks.yaml for the annotated form.
  imageName: ghcr.io/cloudnative-pg/postgresql:${PG_IMAGE_TAG}
  primaryUpdateMethod: switchover

  priorityClassName: cluster-platform

  # Defaults to local-path for the same reason pg-shared does: CNPG replicates
  # at the PostgreSQL layer, so Ceph replicating underneath is redundant. The
  # consequence is that a PVC cannot move - a permanently lost node strands it
  # until it is deleted by hand. Override PG_STORAGE_CLASS to ceph-block for a
  # single-instance cluster, where there is no Postgres-level replica to fall
  # back on.
  storage:
    size: ${PG_STORAGE_SIZE:=8Gi}
    storageClass: ${PG_STORAGE_CLASS:=local-path}

  bootstrap:
    initdb:
      database: ${APP}
      owner: ${APP}

  # Only the knobs every cluster ends up setting. Extensions,
  # shared_preload_libraries and anything else are a patch on this Cluster from
  # the app's own kustomization - see ./kustomization.yaml.
  postgresql:
    parameters:
      shared_buffers: ${PG_SHARED_BUFFERS:=256MB}
      effective_cache_size: ${PG_EFFECTIVE_CACHE_SIZE:=768MB}
      work_mem: ${PG_WORK_MEM:=16MB}
      maintenance_work_mem: ${PG_MAINTENANCE_WORK_MEM:=128MB}
      wal_compression: "on"

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ${APP}-postgres-store
        # Explicit although the bucket holds this cluster alone: barman
        # namespaces backups by serverName underneath destinationPath, and the
        # externalCluster in ../postgres-recovery has to name the same prefix -
        # its own default would be that entry's name, which is not a prefix that
        # exists.
        serverName: ${APP}-postgres

  resources:
    limits:
      memory: ${PG_MEMORY_LIMIT:=1Gi}
    requests:
      cpu: ${PG_CPU_REQUEST:=100m}
      memory: ${PG_MEMORY_REQUEST:=256Mi}
