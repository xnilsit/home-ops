---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: ${APP}-postgres-store
spec:
  # TOP-LEVEL, not under .configuration. Pattern is ^[1-9][0-9]*[dwm]$ - no `y`.
  retentionPolicy: ${PG_RETENTION:=30d}
  configuration:
    # serverName is supplied as a plugin parameter on the Cluster, not here.
    #
    # Garage on the NAS, like every other cluster's archive, and deliberately by
    # IP rather than through s3.${SECRET_DOMAIN}: backups must not depend on the
    # ingress path. Own bucket per app - see ./garagebucket.yaml.
    destinationPath: s3://${APP}-postgres-backup/
    endpointURL: http://192.168.0.200:3900
    # Written by ./garagekey.yaml, straight into this namespace.
    s3Credentials:
      accessKeyId:
        name: ${APP}-postgres-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: ${APP}-postgres-backup
        key: AWS_SECRET_ACCESS_KEY
      # Garage checks the region in the SigV4 credential scope and rejects a
      # mismatch.
      region:
        name: ${APP}-postgres-backup
        key: AWS_REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    # The sidecar ships with NO default limits.
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
