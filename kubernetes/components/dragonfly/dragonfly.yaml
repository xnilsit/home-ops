---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: ${APP}-dragonfly
spec:
  # renovate: datasource=docker depName=ghcr.io/dragonflydb/dragonfly
  image: ghcr.io/dragonflydb/dragonfly:v1.40.2
  replicas: ${DRAGONFLY_REPLICAS:=1}
  networkPolicyEnabled: false
  authentication:
    passwordFromSecret:
      name: ${APP}-dragonfly-auth
      key: password
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: ${APP}-garage-dragonfly-backup
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: ${APP}-garage-dragonfly-backup
          key: AWS_SECRET_ACCESS_KEY
    - name: AWS_REGION
      valueFrom:
        secretKeyRef:
          name: ${APP}-garage-dragonfly-backup
          key: AWS_REGION
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    # Timestamped so a replica's shutdown save cannot clobber the master's.
    - --dbfilename=dump-{timestamp}
    # Bare host:port - a scheme here yields a doubled URL.
    - --s3_endpoint=192.168.0.200:3900
    - --s3_use_https=false
  snapshot:
    # Own prefix in the bucket every Dragonfly shares.
    dir: s3://dragonfly-backup/${APP}/
    cron: 0 * * * *
    # Replicas share the prefix; the operator clears snapshot_cron on non-masters.
    enableOnMasterOnly: true
  resources:
    requests:
      cpu: 25m
    limits:
      memory: 512Mi
  serviceSpec:
    type: ClusterIP
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: ${APP}-dragonfly
