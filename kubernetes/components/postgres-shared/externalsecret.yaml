---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-pg-shared
spec:
  # Pulled rather than reflected. reflector only acts on events, and it drops a
  # mirror whose source did not exist yet - it logs "Source ... could not be
  # found" once and never retries, which is exactly the race this component
  # creates: the app half and the source are applied by two Kustomizations at
  # the same moment. ESO re-reads on this interval, so the same race costs a
  # refresh instead of a stuck deploy.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  target:
    name: *secret
  dataFrom:
    # extract, not data[]: takes every key the source carries - username,
    # password and the ready-made uri - without naming them here.
    - extract:
        key: pg-shared-${APP}
