---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-pg-shared
spec:
  # Pulled out of the database namespace, where the nested Kustomization mints
  # it. The two halves are applied at the same moment, so the app half can be
  # created before the source exists; ESO re-reads on this interval, which turns
  # that ordering into a refresh rather than a stuck deploy.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  target:
    name: *secret
    template:
      # The source `uri` names pg-shared-rw; this one names the pooler. The
      # source ExternalSecret is frozen at refreshInterval 0, where a template
      # edit is silently inert, so the endpoint is rewritten on this side.
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        uri: postgresql://{{ .username }}:{{ .password }}@pg-shared-pooler-rw.database.svc.cluster.local:5432/${APP}?sslmode=require
  dataFrom:
    # extract, not data[]: takes every key the source carries - username,
    # password and the ready-made uri - without naming them here.
    - extract:
        key: pg-shared-${APP}
