---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${APP}-pg-shared
spec:
  # The whole point of this nested Kustomization. A Database and a DatabaseRole
  # name their Cluster by LOCAL name, so both have to live in the database
  # namespace - and so does the password Secret, because reflector does not copy
  # labels and the mirror would arrive without cnpg.io/reload, which CNPG's
  # informer cache filters on. A component alone cannot do that: it is applied
  # under the consuming app's targetNamespace. A Kustomization it creates can
  # carry its own.
  targetNamespace: &namespace database
  path: ./kubernetes/components/postgres-shared/database
  dependsOn:
    # The Cluster the Database and DatabaseRole attach to
    - name: pg-shared
      namespace: flux-system
    # Mints the role password
    - name: external-secrets-generators
      namespace: flux-system
  postBuild:
    substitute:
      # Re-declared rather than inherited: postBuild runs per Kustomization, so
      # the parent's substitutions are already resolved in this file's text and
      # would not reach the manifests this one renders.
      APP: ${APP}
      APP_NAMESPACE: ${APP_NAMESPACE}
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      name: ${APP}
      namespace: *namespace
  healthCheckExprs:
    # An ExternalSecret has no observedGeneration and reports condition type
    # Ready, so kstatus calls it Current the moment it applies - without this a
    # generator that never synced surfaces as a DatabaseRole failure instead.
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    # Explicit: this object is created under the consuming app's namespace, not
    # in flux-system, so the source reference crosses a namespace.
    namespace: flux-system
  wait: false
  interval: 1h
  timeout: 5m
