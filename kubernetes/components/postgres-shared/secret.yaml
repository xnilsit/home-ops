---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: ${APP}-pg-shared
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: database/pg-shared-${APP}
type: Opaque
# App-side glue only, like ../dragonfly-shared. The cluster-side half - the
# Database and DatabaseRole CRs plus the SOPS password secret this mirrors -
# cannot live in a component: both CRs reference their Cluster by local name, so
# they must sit in the `database` namespace, while a component is applied under
# the consuming app's targetNamespace. They live in
# kubernetes/apps/database/pg-shared/app/ instead, one pair of files per
# consumer.
