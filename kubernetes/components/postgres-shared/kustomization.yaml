---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Gives an app a database on the shared pg-shared cluster. Two halves, because
# they land in different namespaces:
#
#   ./externalsecret.yaml
#                   the app-side copy of the credential, pulled out of the
#                   database namespace into the app's own, where the workload
#                   reads its `uri` key
#   ./ks.yaml       a nested Flux Kustomization whose own targetNamespace is
#                   `database`, which is the only way to get the Database,
#                   DatabaseRole and password Secret into the namespace the
#                   Cluster lives in - a component is always applied under the
#                   consuming app's targetNamespace
#
# Required in the app's ks.yaml postBuild.substitute:
#   APP  the app name; also the database, role and secret name
#
# The app Kustomization must dependsOn external-secrets-stores-database, which
# owns the ClusterSecretStore the pull below goes through. Everything on the
# cluster side is covered by the nested Kustomization's own dependsOn.
resources:
  - ./externalsecret.yaml
  - ./ks.yaml
