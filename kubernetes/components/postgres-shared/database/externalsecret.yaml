---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret pg-shared-${APP}
spec:
  # 0 freezes the value: any interval re-runs the generator and rotates the
  # password under a running Postgres. It also makes edits to the template
  # below silently inert - delete the target Secret to reshape it, which mints a
  # new password.
  refreshInterval: "0"
  target:
    name: *secret
    template:
      # basic-auth is required by the DatabaseRole passwordSecret, which needs
      # both username and password. The uri key is the one consumers read.
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # REQUIRED. CNPG's secret informer cache is filtered on this label, so
          # without it the operator's cached Get returns NotFound even though the
          # secret exists in the API - the DatabaseRole then reports
          # "failed to get password secret ... not found" forever, and creating
          # the secret triggers no reconcile because the informer never sees it.
          cnpg.io/reload: "true"
      data:
        username: ${APP}
        password: "{{ .password }}"
        # sslmode is explicit because lib/pq and pgx pick different defaults.
        # require encrypts without verifying, which is what CNPG's self-signed
        # serving certificate needs.
        uri: postgresql://${APP}:{{ .password }}@pg-shared-rw.database.svc.cluster.local:5432/${APP}?sslmode=require
  dataFrom:
    # generatorRef only works under dataFrom - it is unimplemented in data[].
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
