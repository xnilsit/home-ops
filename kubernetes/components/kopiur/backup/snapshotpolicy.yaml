---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  repository: {kind: ClusterRepository, name: nas}
  # Consumer half of the fail-closed projection gate. The mover Job runs in this
  # namespace and reads credentials with envFrom, which cannot cross namespaces.
  credentialProjection: {enabled: true}
  # Explicit, not defaulted: server-side re-defaulting on a chart upgrade would
  # otherwise be free to flip a stored value under GitOps.
  copyMethod: Snapshot
  # Neither Ceph VolumeSnapshotClass is marked default, so this must be named.
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
  compression: {compressor: zstd}
  sources:
    - pvc:
        name: ${APP}
  mover:
    # Same pinned identity as the Restore, rather than pvcConsumer: inherit
    # would hold a backup whenever the workload is scaled to zero, and the
    # Restore has to carry an explicit uid anyway.
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      seccompProfile:
        type: RuntimeDefault
  # Retention is the only pruning mechanism: kopiur pins kopia's own retention
  # to effectively-infinite, and omitting this block never prunes.
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  # Gated by kopiur until the first backup exists, so a fresh app does not fail
  # its first verify against an empty repository.
  verification:
    # Daily blob-level `kopia snapshot verify`: every pack the latest snapshot
    # references is present, plus a full read of a share of its files.
    quick:
      schedule: {cron: "H 5 * * *", jitter: 2h}
    verifyFilesPercent: 5
    # Monthly scratch-restore of the latest snapshot into a throwaway PVC the
    # size of the real one. Jittered over four hours: every app shares the 1st,
    # and each restore reads its whole snapshot off the NAS.
    deep:
      schedule: {cron: "H 6 1 * *", jitter: 4h}
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      storageClassName: ceph-block
    # Catches the silent success of a snapshot that captured nothing. An app
    # whose volume is legitimately empty overrides it.
    successExpr: "${KOPIUR_VERIFY_EXPR:=stats.files > 0 && stats.errors == 0}"
