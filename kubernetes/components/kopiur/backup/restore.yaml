---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  credentialProjection: {enabled: true}
  source:
    fromPolicy:
      name: ${APP}
      offset: 0
  # A passive volume-populator source: it does nothing until a PVC names it in
  # dataSourceRef, and re-applying it against a Bound PVC is a no-op. Restoring
  # again means deleting the PVC, not touching this.
  target:
    populator: {}
  # What makes a first deploy safe - with no snapshot yet, the volume comes up
  # empty instead of failing.
  policy:
    onMissingSnapshot: Continue
  mover:
    # Pinned, not inherited. A populator has no workload pod to read, and
    # inheritSecurityContextFrom.snapshot holds on MissingRecordedIdentity until
    # a backup exists - which on a fresh repository never happens, because
    # nothing starts until this volume binds. An explicit uid is documented as
    # the fallback for that hold; as of 0.10.4 it does not actually release it,
    # so the inherit is left off entirely.
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      seccompProfile:
        type: RuntimeDefault
