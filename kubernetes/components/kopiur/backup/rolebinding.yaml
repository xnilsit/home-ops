---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/rolebinding-rbac-v1.json
# Lets kopiur-ui browse this app's snapshots. Namespaced on purpose: the browse
# session pod carries the repository credentials, and pods/exec cannot be
# narrowed to it, so this grants them in this namespace. home-ops is the
# console's anonymous user (storage/kopiur/app/helmrelease.yaml). Named per app
# because several apps share a namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kopiur-ui-browse-${APP}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kopiur-ui-browse
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: home-ops
