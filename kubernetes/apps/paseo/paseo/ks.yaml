---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paseo
  namespace: flux-system
spec:
  targetNamespace: &namespace paseo
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/paseo/paseo/app
  dependsOn:
    - name: envoy-gateway
      namespace: flux-system
    # The home PVC is provisioned through kopiur's Restore populator
    - name: kopiur-repository
      namespace: flux-system
    # ceph-block for both PVCs
    - name: rook-ceph-cluster
      namespace: flux-system
    # gvisor RuntimeClass for the daemon pod
    - name: runtime-classes
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      # Paseo state, the Claude Code login and the cloned repos; caches live on paseo-cache.
      KOPIUR_CAPACITY: 20Gi
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
