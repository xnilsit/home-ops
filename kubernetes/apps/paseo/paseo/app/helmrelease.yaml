---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paseo
spec:
  chartRef:
    kind: OCIRepository
    name: paseo
  interval: 1h
  values:
    controllers:
      paseo:
        annotations:
          reloader.stakater.com/auto: "true"
        # One daemon owns the RWO home volume and its agent sessions.
        strategy: Recreate
        # Bound to the paseo-read ClusterRole in ./rbac.yaml.
        serviceAccount:
          identifier: paseo
        containers:
          app:
            image:
              repository: registry.nilsit.de/nilsit.de/paseo
              # Rebuilt under the same tag by .github/workflows/paseo-image.yaml, the digest selects the build.
              tag: 0.14.0@sha256:64fcde69b61f1a0772ee2526c452f9b35aace9627707a321d8ad1b3da030379e
            env:
              PASEO_HOSTNAMES: &host "paseo.${SECRET_DOMAIN}"
              # Voice models are re-downloadable, so they stay off the backed-up volume.
              PASEO_LOCAL_MODELS_DIR: /home/paseo/.cache/paseo-models
              MISE_DATA_DIR: /home/paseo/.cache/mise
              # Repos are cloned under /home/paseo/workspace.
              MISE_TRUSTED_CONFIG_PATHS: /home/paseo/workspace
              # The npm install in the image is read-only.
              DISABLE_AUTOUPDATER: "1"
              GIT_AUTHOR_NAME: &gitName xnilsit
              GIT_AUTHOR_EMAIL: &gitEmail me@nilsit.dev
              GIT_COMMITTER_NAME: *gitName
              GIT_COMMITTER_EMAIL: *gitEmail
              # HTTPS pushes authenticate with GH_TOKEN through gh.
              GIT_CONFIG_COUNT: "1"
              GIT_CONFIG_KEY_0: credential.https://github.com.helper
              GIT_CONFIG_VALUE_0: "!gh auth git-credential"
            envFrom:
              # PASEO_PASSWORD, GH_TOKEN, KGUARDIAN_MCP_TOKEN
              - secretRef:
                  name: paseo-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 6767
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 8Gi
    defaultPodOptions:
      runtimeClassName: gvisor
      # The chart defaults to false; kubectl and flux use this token for paseo-read.
      automountServiceAccountToken: true
      # The image is amd64-only.
      nodeSelector:
        kubernetes.io/arch: amd64
      # Resolve external names without the cluster search list.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      securityContext:
        runAsNonRoot: true
        # Matches the image's paseo user and the kopiur mover's default uid.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      home:
        # Provisioned by components/kopiur/backup through its Restore populator.
        existingClaim: paseo
        globalMounts:
          - path: /home/paseo
      cache:
        type: persistentVolumeClaim
        # Without it the PVC takes the bare release name, which the kopiur PVC owns.
        suffix: cache
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: ceph-block
        globalMounts:
          - path: /home/paseo/.cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    serviceAccount:
      paseo: {}
    service:
      app:
        controller: paseo
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /api/health
        hostnames:
          - *host
        # LAN-only; the daemon API and WebSocket require PASEO_PASSWORD.
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
