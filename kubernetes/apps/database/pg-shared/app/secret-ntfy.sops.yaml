---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: pg-shared-ntfy
  labels:
    # REQUIRED. CNPG's secret informer cache is filtered on this label, so
    # without it the operator's cached Get returns NotFound even though the
    # secret exists in the API - the DatabaseRole then reports
    # "failed to get password secret ... not found" forever, and creating the
    # secret triggers no reconcile because the informer never sees it.
    cnpg.io/reload: "true"
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: observability
# basic-auth is required by the DatabaseRole passwordSecret, which needs both
# username and password. The uri key is an extra convenience for consumers that
# want a ready-made DSN - ntfy takes exactly one NTFY_DATABASE_URL.
type: kubernetes.io/basic-auth
