---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg-shared-pooler-rw
spec:
  # Pooler pods also carry cnpg.io/cluster=pg-shared, so this selects on the
  # pooler name to keep the two scrape jobs apart.
  selector:
    matchLabels:
      cnpg.io/poolerName: pg-shared-pooler-rw
  podMetricsEndpoints:
    # Port 9127 on the pgbouncer container, serving the cnpg_pgbouncer_* metrics.
    - port: metrics
      relabelings:
        - sourceLabels:
            - "__meta_kubernetes_namespace"
          targetLabel: namespace
          action: replace
        - sourceLabels:
            - "__meta_kubernetes_pod_name"
          targetLabel: pod
          action: replace
