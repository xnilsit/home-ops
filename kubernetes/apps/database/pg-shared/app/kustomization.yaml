---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Kept after the move to Garage: the claim is reclaimPolicy Retain and the RGW
  # bucket it owns is the cold copy of everything archived before the cutover.
  - ./objectbucketclaim.yaml
  # Must precede the ObjectStore, which reads the mirrored Garage credentials
  # out of it.
  - ./secret-garage.yaml
  - ./objectstore.yaml
  # Must precede the DatabaseRole, which cannot create a role without its
  # password secret.
  - ./secret-ntfy.sops.yaml
  - ./cluster.yaml
  # One pair of files per consumer. A DatabaseRole must exist before the
  # Database that names it as owner.
  - ./databaserole-ntfy.yaml
  - ./database-ntfy.yaml
  - ./scheduledbackup.yaml
  - ./podmonitor.yaml
