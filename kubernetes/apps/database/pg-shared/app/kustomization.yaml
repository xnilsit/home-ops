---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Must precede the ObjectStore, which reads the mirrored Garage credentials
  # out of it.
  - ./secret-garage.yaml
  - ./objectstore.yaml
  # Must precede the DatabaseRole, which cannot create a role without its
  # password secret.
  - ./externalsecret-ntfy.yaml
  - ./cluster.yaml
  # ntfy predates kubernetes/components/postgres-shared, which now carries these
  # three objects for every new consumer. Left in place deliberately: the names
  # are identical, so handing them to the component would make Flux prune and
  # recreate a live database's CRs and mint a new role password on the way.
  - ./databaserole-ntfy.yaml
  - ./database-ntfy.yaml
  - ./scheduledbackup.yaml
  - ./podmonitor.yaml
