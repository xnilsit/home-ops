---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-shared
spec:
  # Six fields - the leading one is SECONDS, not minutes. 04:00 daily, an hour
  # after timescale so the two do not compete for the same rgw bandwidth.
  schedule: "0 0 4 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: pg-shared
  # Must be set explicitly: the enum still defaults to barmanObjectStore, which
  # is the deprecated in-tree path.
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
