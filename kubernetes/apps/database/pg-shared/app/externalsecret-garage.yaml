# Pulled out of another namespace through a ClusterSecretStore. ESO re-reads on
# the interval below, so an ordering surprise costs a refresh rather than a
# stuck deploy.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret garage-cnpg-backup
spec:
  # A barman ObjectStore is namespace-scoped and its s3Credentials are
  # SecretKeySelectors, so the credentials have to exist here.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: garage
  target:
    name: *secret
  dataFrom:
    - extract:
        key: garage-cnpg-backup
