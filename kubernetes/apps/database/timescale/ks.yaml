---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app timescale
  namespace: flux-system
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/database/timescale/app
  dependsOn:
    # The Cluster references the barman plugin, which must be running first
    - name: barman-cloud-plugin
      namespace: flux-system
    # The ObjectBucketClaim needs the ceph-bucket StorageClass, which the
    # cluster chart creates along with the CephObjectStore
    - name: rook-ceph-cluster
      namespace: flux-system
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: *app
      namespace: database
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 1h
  # Three instances bootstrap serially, and the first one has to pull the
  # operand plus the extension image volume
  timeout: 20m
