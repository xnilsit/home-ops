---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: timescale-bootstrap
spec:
  backoffLimit: 6
  # No ttlSecondsAfterFinished: if the Job were garbage-collected, Flux would
  # recreate it on the next reconcile and it would re-run every hour.
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        # 26 is the postgres uid in the CNPG operand images
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          # Same operand image as the cluster, so the client major always
          # matches the server. Ships psql 18.
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          command:
            - psql
          args:
            - -v
            - ON_ERROR_STOP=1
            - -d
            - $(PGURI)
            - -f
            - /sql/bootstrap.sql
          env:
            # CNPG generates this secret from bootstrap.initdb; `uri` is a
            # complete connection string for the blocky database as its owner.
            - name: PGURI
              valueFrom:
                secretKeyRef:
                  name: timescale-app
                  key: uri
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
      volumes:
        - name: sql
          configMap:
            name: timescale-bootstrap-sql
        - name: tmp
          emptyDir: {}
