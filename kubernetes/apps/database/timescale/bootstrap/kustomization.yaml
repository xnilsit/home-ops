---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./job.yaml
# The name-suffix hash is deliberately LEFT ON below: editing bootstrap.sql
# changes the ConfigMap name, which changes the Job's pod spec, which makes Flux
# replace the (immutable) Job and re-run the SQL. That is why the
# timescale-bootstrap Kustomization sets force: true.
configMapGenerator:
  - name: timescale-bootstrap-sql
    files:
      - bootstrap.sql=./bootstrap.sql
    options:
      annotations:
        # The SQL is not a Flux substitution target
        kustomize.toolkit.fluxcd.io/substitute: disabled
