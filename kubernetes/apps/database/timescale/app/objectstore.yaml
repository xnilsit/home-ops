---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: timescale-store
spec:
  # TOP-LEVEL, not under .configuration. The plugin's own concepts.md documents
  # it in the wrong place; the CRD schema and every other page use top-level.
  # Pattern is ^[1-9][0-9]*[dwm]$ - no `y`.
  retentionPolicy: 30d
  configuration:
    # serverName is deliberately unset - it exists only for in-tree API
    # compatibility, and is supplied as a plugin parameter on the Cluster.
    #
    # Bucket name must match the GarageBucket in kubernetes/apps/garage
    destinationPath: s3://timescale-backup/
    # Garage on the NAS, deliberately by IP rather than through
    # s3.${SECRET_DOMAIN}: backups must not depend on the ingress path, and
    # multipart uploads have no reason to cross Envoy.
    endpointURL: http://192.168.0.200:3900
    # Written by the GarageKey in kubernetes/apps/garage and mirrored into this
    # namespace by reflector - see ./secret-garage.yaml
    s3Credentials:
      accessKeyId:
        name: garage-timescale-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: garage-timescale-backup
        key: AWS_SECRET_ACCESS_KEY
      # Garage checks the region in the SigV4 credential scope and rejects a
      # mismatch. RGW ignored the value, so this had no reason to be set before.
      region:
        name: garage-timescale-backup
        key: AWS_REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    # The sidecar ships with NO default limits, and these apply to every Cluster
    # using this ObjectStore.
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
