---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: garage-timescale-backup
  annotations:
    # Mirrors the Secret garage-operator generates for the timescale-backup
    # GarageKey. A barman ObjectStore is namespace-scoped and its s3Credentials
    # are SecretKeySelectors, so the credentials have to exist in this
    # namespace; the GarageKey's secretTemplate puts reflection-allowed on the
    # source, so no hand-authored SOPS copy is needed.
    reflector.v1.k8s.emberstack.com/reflects: garage/garage-timescale-backup
type: Opaque
