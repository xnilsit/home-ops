---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: timescale
spec:
  # Six fields - the leading one is SECONDS, not minutes. 03:30 daily.
  schedule: "0 30 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: timescale
  # Must be set explicitly: the enum still defaults to barmanObjectStore, which
  # is the deprecated in-tree path.
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
