# Pulled rather than reflected: reflector acts on events only and gives up on a
# mirror whose source did not exist yet, logging once and never retrying. ESO
# re-reads on the interval below.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret garage-timescale-backup
spec:
  # A barman ObjectStore is namespace-scoped and its s3Credentials are
  # SecretKeySelectors, so the credentials have to exist here.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: garage
  target:
    name: *secret
  dataFrom:
    - extract:
        key: garage-timescale-backup
