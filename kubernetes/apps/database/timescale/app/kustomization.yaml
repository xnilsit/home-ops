---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Must precede the ObjectStore, which reads the mirrored Garage credentials
  # out of it.
  - ./externalsecret-garage.yaml
  - ./objectstore.yaml
  # Must precede cluster.yaml: managed.roles cannot create blocky_ro
  # without its password secret.
  - ./externalsecret.yaml
  - ./cluster.yaml
  - ./database.yaml
  - ./scheduledbackup.yaml
  - ./podmonitor.yaml
  - ./prometheusrule.yaml
