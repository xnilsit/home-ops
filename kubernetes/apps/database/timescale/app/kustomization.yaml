---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Kept after the move to Garage: the claim is reclaimPolicy Retain and the RGW
  # bucket it owns is the cold copy of everything archived before the cutover.
  - ./objectbucketclaim.yaml
  # Must precede the ObjectStore, which reads the mirrored Garage credentials
  # out of it.
  - ./secret-garage.yaml
  - ./objectstore.yaml
  # Must precede cluster.yaml: managed.roles cannot create blocky_ro
  # without its password secret.
  - ./secret.sops.yaml
  - ./cluster.yaml
  - ./database.yaml
  - ./scheduledbackup.yaml
  - ./podmonitor.yaml
  - ./prometheusrule.yaml
