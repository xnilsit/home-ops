---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dragonfly
  namespace: flux-system
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/database/dragonfly/app
  dependsOn:
    # Owns the ClusterSecretStore the credential is pulled through
    - name: external-secrets-stores-garage
      namespace: flux-system
    - name: dragonfly-operator
      namespace: flux-system
    # Gates on the GarageKey being Ready, ie. the snapshot credentials existing.
    - name: garage
      namespace: flux-system
    # Mints the auth password via ClusterGenerator/password
    - name: external-secrets-generators
      namespace: flux-system
    - name: priority-classes
      namespace: flux-system
  healthChecks:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      name: *app
      namespace: database
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      current: has(status.phase) && status.phase in ['Ready', 'ready']
      inProgress: has(status.phase) && status.phase in ['ResourcesCreated', 'Configuring', 'RollingUpdate']
    # An ExternalSecret has no observedGeneration and reports condition type
    # Ready, so kstatus calls it Current the moment it applies - without this a
    # generator that never synced surfaces as a Dragonfly timeout instead.
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 1h
  timeout: 15m
