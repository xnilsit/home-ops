---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  # renovate: datasource=docker depName=ghcr.io/dragonflydb/dragonfly
  image: ghcr.io/dragonflydb/dragonfly:v1.40.2
  replicas: 3
  # Shared datastore backing blocky's DNS cache.
  priorityClassName: cluster-platform
  networkPolicyEnabled: false
  authentication:
    passwordFromSecret:
      name: dragonfly-auth
      key: password
  podMetadata:
    annotations:
      kubectl.kubernetes.io/default-container: dragonfly
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: garage-dragonfly-backup
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: garage-dragonfly-backup
          key: AWS_SECRET_ACCESS_KEY
    - name: AWS_REGION
      valueFrom:
        secretKeyRef:
          name: garage-dragonfly-backup
          key: AWS_REGION
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    # Timestamped so a replica's shutdown save cannot clobber the master's.
    - --dbfilename=dump-{timestamp}
    # Bare host:port - a scheme here yields a doubled URL.
    - --s3_endpoint=192.168.0.200:3900
    - --s3_use_https=false
  resources:
    requests:
      cpu: 100m
    limits:
      memory: 1Gi
  snapshot:
    dir: s3://dragonfly-backup/${APP}/
    cron: 0 * * * *
    # Replicas share the bucket; the operator clears snapshot_cron on non-masters.
    enableOnMasterOnly: true
  pdb:
    maxUnavailable: 1
  serviceSpec:
    type: ClusterIP
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: dragonfly
