---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: garage-dragonfly-backup
  annotations:
    # Mirrors the Secret garage-operator generates for the dragonfly-backup
    # GarageKey. Dragonfly reads the credentials from its own env, so they have
    # to exist in this namespace.
    reflector.v1.k8s.emberstack.com/reflects: garage/garage-dragonfly-backup
type: Opaque
