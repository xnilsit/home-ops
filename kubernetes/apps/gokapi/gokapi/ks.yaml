---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gokapi
  namespace: flux-system
spec:
  targetNamespace: gokapi
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/gokapi/gokapi/app
  dependsOn:
    # Writes the gokapi-oidc Secret the ExternalSecret reads
    - name: authentik-oidc
      namespace: flux-system
    # The OIDC credential comes through the tofu-controller store
    - name: external-secrets-stores
      namespace: flux-system
    # Owns the store the Dragonfly password is pulled through
    - name: external-secrets-stores-database
      namespace: flux-system
    # Owns the store the snapshot credentials are pulled through
    - name: external-secrets-stores-garage
      namespace: flux-system
    # Gates on the GarageKey being Ready, ie. the snapshot credentials existing.
    - name: garage
      namespace: flux-system
    - name: dragonfly-operator
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
    # CephFS RWX for the staging volume, and the bucket StorageClass the OBC claims through
    - name: rook-ceph-cluster
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      DRAGONFLY_REPLICAS: "2"
  healthChecks:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      name: gokapi-dragonfly
      namespace: gokapi
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: gokapi
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      current: has(status.phase) && status.phase in ['Ready', 'ready']
      inProgress: has(status.phase) && status.phase in ['ResourcesCreated', 'Configuring', 'RollingUpdate']
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
