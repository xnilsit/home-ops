---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gokapi
  namespace: flux-system
spec:
  targetNamespace: gokapi
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/gokapi/gokapi/app
  dependsOn:
    # Writes the gokapi-oidc Secret the ExternalSecret reads
    - name: authentik-oidc
      namespace: flux-system
    # The OIDC credential comes through the tofu-controller store
    - name: external-secrets-stores
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
    # The database PVC is provisioned through kopiur's Restore populator
    - name: kopiur-repository
      namespace: flux-system
    # ceph-block for the PVCs, and the bucket StorageClass the OBC claims through
    - name: rook-ceph-cluster
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      # SQLite and logs only; uploads live in RGW.
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_CRON: "H */6 * * *"
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: gokapi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
