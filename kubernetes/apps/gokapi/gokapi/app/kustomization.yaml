---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # Dedicated Dragonfly (${APP}-dragonfly) holding all metadata, snapshotted to Garage.
  - ../../../../components/dragonfly
resources:
  - ./objectbucketclaim.yaml
  - ./externalsecret-oidc.yaml
  - ./secret.sops.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./backendtrafficpolicy.yaml
patches:
  # Caps the loss on an ungraceful loss of both replicas at 5 minutes; snapshots are a few KB.
  - patch: |-
      apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      metadata:
        name: ${APP}-dragonfly
      spec:
        snapshot:
          cron: "*/5 * * * *"
