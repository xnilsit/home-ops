---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gokapi
spec:
  # Replaces BackendTrafficPolicy/envoy in envoy-gateway/app/envoy.yaml rather than
  # merging with it: merged rate limits stack, so the gateway's 1200/min would still
  # apply. Everything else is copied from there.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gokapi
  compressor:
    - type: Zstd
      zstd: {}
      minContentLength: 1Ki
    - type: Brotli
      brotli: {}
      minContentLength: 1Ki
    - type: Gzip
      gzip: {}
      minContentLength: 1Ki
  # Upload processing status lives in memory and streams over SSE, so a client must
  # stick to one pod. SourceIP rather than a cookie: gokapi-cli keeps none.
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: SourceIP
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 6000
            unit: Minute
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 6000
            unit: Minute
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
