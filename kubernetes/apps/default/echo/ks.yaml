---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app echo
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/default/echo/app
  dependsOn:
    # The HTTPRoute needs the envoy gateway CRDs and envoy-external
    - name: envoy-gateway
      namespace: flux-system
  postBuild:
    # substituteFrom is NOT set here: cluster-apps patches cluster-settings and
    # cluster-secrets onto every child Kustomization, and being a list it is
    # replaced wholesale rather than merged.
    substitute:
      APP: *app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: default
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: false, since wait: true would ignore the healthChecks above.
  wait: false
  interval: 1h
  timeout: 5m
