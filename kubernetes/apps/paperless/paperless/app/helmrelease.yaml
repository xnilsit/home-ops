---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  chartRef:
    kind: OCIRepository
    name: paperless
  interval: 1h
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        # Webserver, Celery worker, beat and consumer in one pod on an RWO volume.
        strategy: Recreate
        initContainers:
          # s6 refuses a /run it does not own; an emptyDir root is root-owned.
          run-dir:
            image: &image
              repository: registry.nilsit.de/ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
            command:
              - "mkdir"
              - "-p"
              - "/vol/run"
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              limits:
                memory: 32Mi
        containers:
          app:
            image: *image
            env:
              PAPERLESS_URL: https://paperless.${SECRET_DOMAIN_ALT}
              PAPERLESS_PORT: &port 8000
              PAPERLESS_TIME_ZONE: Europe/Berlin
              # Lets s6-overlay run with its state on the /run emptyDir.
              S6_READ_ONLY_ROOT: "1"
              # Fontconfig's cache, on the only writable path.
              XDG_CACHE_HOME: /tmp/cache
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST: paperless-postgres-rw
              PAPERLESS_DBUSER:
                valueFrom:
                  secretKeyRef:
                    name: &pgSecret paperless-postgres-app
                    key: username
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: *pgSecret
                    key: password
              PAPERLESS_DBNAME:
                valueFrom:
                  secretKeyRef:
                    name: *pgSecret
                    key: dbname
              DRAGONFLY_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paperless-dragonfly-auth
                    key: password
              PAPERLESS_REDIS:
                value: redis://:$(DRAGONFLY_PASSWORD)@paperless-dragonfly:6379
                dependsOn: DRAGONFLY_PASSWORD
              PAPERLESS_TIKA_ENABLED: "true"
              PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_TASK_WORKERS: "2"
              PAPERLESS_THREADS_PER_WORKER: "2"
              PAPERLESS_OCR_LANGUAGE: deu+eng
              PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD: "5"
              PAPERLESS_FILENAME_FORMAT: "{created}-{correspondent}-{title}"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # CephFS delivers no inotify events for the mover's writes from another node.
              PAPERLESS_CONSUMER_POLLING_INTERVAL: "60"
              PAPERLESS_EMAIL_TASK_CRON: "*/2 * * * *"
              PAPERLESS_EMAIL_HOST: mail.${SECRET_DOMAIN_ALT}
              PAPERLESS_EMAIL_HOST_USER: paperless@${SECRET_DOMAIN_ALT}
              PAPERLESS_APPS: allauth.socialaccount.providers.gitlab
              PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
            envFrom:
              # PAPERLESS_SECRET_KEY, PAPERLESS_EMAIL_HOST_PASSWORD, PAPERLESS_SOCIALACCOUNT_PROVIDERS
              - secretRef:
                  name: paperless-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /accounts/login/
                    port: *port
                    # ALLOWED_HOSTS comes from PAPERLESS_URL; localhost is always allowed.
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              # Covers migrations and the search index check on start.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /accounts/login/
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
      # Moves scans from the NFS inbox into the consume folder. A fresh pod per run
      # remounts NFS, so an Unraid outage or stale handle never reaches paperless.
      mover:
        type: cronjob
        cronjob:
          schedule: "*/2 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          backoffLimit: 0
          # Ends runs stuck mounting an unreachable NFS server.
          activeDeadlineSeconds: 300
        containers:
          app:
            image:
              repository: registry.nilsit.de/docker.io/rclone/rclone
              tag: 1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            args:
              - move
              - /import
              - /consume
              # Skips files a scanner may still be writing.
              - --min-age=1m
              # Paperless ignores hidden files, so they would pile up in the consume folder.
              - --exclude=.*
            env:
              HOME: /tmp
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
      tika:
        replicas: 2
        strategy: RollingUpdate
        podDisruptionBudget:
          maxUnavailable: 1
        pod:
          # Replaces defaultPodOptions.securityContext rather than merging into it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 35002
            runAsGroup: 35002
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: tika
        containers:
          app:
            image:
              repository: registry.nilsit.de/docker.io/apache/tika
              tag: 4.1.0@sha256:06bcdbd09aca073293e5a171ad161418cc93c91d58d9e4e205064eade84889d4
            probes:
              liveness: &tikaProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /tika
                    port: &tikaPort 9998
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *tikaProbes
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
      gotenberg:
        replicas: 2
        strategy: RollingUpdate
        podDisruptionBudget:
          maxUnavailable: 1
        pod:
          # Replaces defaultPodOptions.securityContext rather than merging into it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: gotenberg
        containers:
          app:
            image:
              repository: registry.nilsit.de/docker.io/gotenberg/gotenberg
              tag: 8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
            command:
              - gotenberg
              - --chromium-disable-javascript=true
              - --chromium-allow-list=file:///tmp/.*
            probes:
              liveness: &gotenbergProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &gotenbergPort 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *gotenbergProbes
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # paperless in the image, and what kopiur's mover reads the volume as.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        # Provisioned by components/kopiur/backup through its Restore populator.
        existingClaim: paperless
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/data
                subPath: data
              - path: /usr/src/paperless/media
                subPath: media
      import:
        existingClaim: paperless-import
        advancedMounts:
          mover:
            app:
              - path: /import
                subPath: import
      consume:
        existingClaim: paperless-staging
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/consume
          mover:
            app:
              - path: /consume
      run:
        type: emptyDir
        advancedMounts:
          paperless:
            run-dir:
              - path: /vol
            app:
              - path: /run
                subPath: run
      tmp:
        type: emptyDir
        advancedMounts:
          paperless:
            app:
              - path: /tmp
          tika:
            app:
              - path: /tmp
          gotenberg:
            app:
              - path: /tmp
          mover:
            app:
              - path: /tmp
      gotenberg-home:
        type: emptyDir
        advancedMounts:
          gotenberg:
            app:
              - path: /home/gotenberg
    service:
      app:
        controller: paperless
        ports:
          http:
            port: *port
      tika:
        controller: tika
        ports:
          http:
            port: *tikaPort
      gotenberg:
        controller: gotenberg
        ports:
          http:
            port: *gotenbergPort
    route:
      app:
        annotations:
          # / 302s here for an anonymous client anyway. The DRF API under /api/
          # would 403, so it is not an option.
          gatus.home-operations.com/endpoint: |
            path: /accounts/login/
        hostnames:
          - "paperless.${SECRET_DOMAIN_ALT}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
