---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # Provisions the data/media PVC (named ${APP}) and snapshots it to the NAS.
  - ../../../../components/kopiur/backup
  # Dedicated Dragonfly (${APP}-dragonfly) for the Celery broker and cache.
  - ../../../../components/dragonfly
  # Archived to Garage.
  - ../../../../components/postgres
resources:
  - ./secret.sops.yaml
  - ./consume.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
patches:
  # Celery and channels run Lua scripts that touch keys they do not declare.
  - patch: |-
      - op: add
        path: /spec/args/-
        value: --default_lua_flags=allow-undeclared-keys
    target:
      group: dragonflydb.io
      kind: Dragonfly
