---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app continuwuity
  namespace: flux-system
spec:
  targetNamespace: &namespace matrix
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/matrix/continuwuity/app
  dependsOn:
    # Writes the continuwuity-oidc Secret the ExternalSecret reads
    - name: authentik-oidc
      namespace: flux-system
    # The OIDC credential comes through the tofu-controller store
    - name: external-secrets-stores
      namespace: flux-system
    # The database PVC is provisioned through kopiur's Restore populator
    - name: kopiur-repository
      namespace: flux-system
    # ceph-block for the PVC
    - name: rook-ceph-cluster
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      # RocksDB plus the media store, which is where the growth is - remote
      # media is purged on every start, see admin_execute in the HelmRelease.
      KOPIUR_CAPACITY: 20Gi
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
