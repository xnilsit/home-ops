---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
# Server-name delegation: @user:${SECRET_DOMAIN} lives on matrix.${SECRET_DOMAIN}.
# The apex is beszel's, on envoy-external through the tunnel, so this attaches
# there too and wins on the longer prefix. Two small JSON documents, so the
# tunnel's body cap is irrelevant here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: continuwuity-well-known
  annotations:
    gatus.home-operations.com/endpoint: |
      path: /.well-known/matrix/server
spec:
  hostnames:
    - "${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix/
      backendRefs:
        - name: continuwuity
          port: 8080
