---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # Provisions the RocksDB PVC (named ${APP}) and snapshots it to the NAS.
  - ../../../../components/kopiur/backup
resources:
  # Must precede the HelmRelease, which reads the client credentials from it.
  - ./externalsecret-oidc.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute-well-known.yaml
  - ./backendtrafficpolicy.yaml
