---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret livekit-keys
spec:
  # 0 freezes the secret: any interval would rotate it under running calls.
  # Edits to the template below are inert until the Secret is deleted.
  refreshInterval: "0"
  target:
    name: *secret
    template:
      data:
        # lk-jwt-service signs room tokens with these two...
        LIVEKIT_KEY: matrix
        LIVEKIT_SECRET: "{{ .password }}"
        # ...and livekit-server reads the same pair in its `key: secret` form.
        LIVEKIT_KEYS: "matrix: {{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
