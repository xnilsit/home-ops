---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app livekit
  namespace: flux-system
spec:
  targetNamespace: &namespace matrix
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/matrix/livekit/app
  dependsOn:
    # Mints the API secret
    - name: external-secrets-generators
      namespace: flux-system
    # Issues the TURN certificate
    - name: cert-manager
      namespace: flux-system
    # Owns the TLS passthrough listener the TURNS route attaches to
    - name: envoy-gateway
      namespace: flux-system
    # Owns the LB-IPAM pool the media VIP comes from
    - name: cilium
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
