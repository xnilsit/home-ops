---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret mautrix-whatsapp
spec:
  # 0 freezes the tokens, which the homeserver holds a copy of from the
  # registration below. Template edits are inert until the Secret is deleted -
  # which mints new tokens, so the bridge has to be registered again.
  refreshInterval: "0"
  target:
    name: *secret
    template:
      data:
        AS_TOKEN: "{{ .AS_TOKEN }}"
        HS_TOKEN: "{{ .HS_TOKEN }}"
        PROVISIONING_SHARED_SECRET: "{{ .PROVISIONING_SHARED_SECRET }}"
        PICKLE_KEY: "{{ .PICKLE_KEY }}"
        # continuwuity has no config for appservices: paste this into the
        # admin room once, after `!admin appservices register`.
        registration.yaml: |
          id: whatsapp
          url: http://mautrix-whatsapp.matrix.svc.cluster.local:29318
          as_token: "{{ .AS_TOKEN }}"
          hs_token: "{{ .HS_TOKEN }}"
          sender_localpart: whatsappbot
          rate_limited: false
          namespaces:
            users:
              - regex: '@whatsappbot:${SECRET_DOMAIN_REGEX}'
                exclusive: true
              - regex: '@whatsapp_.*:${SECRET_DOMAIN_REGEX}'
                exclusive: true
            aliases: []
            rooms: []
          de.sorunome.msc2409.push_ephemeral: true
          receive_ephemeral: true
          org.matrix.msc3202: true
          io.element.msc4190: true
  dataFrom:
    - &token
      # One generator call per key, so every token differs.
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
      rewrite:
        - regexp: {source: password, target: AS_TOKEN}
    - <<: *token
      rewrite:
        - regexp: {source: password, target: HS_TOKEN}
    - <<: *token
      rewrite:
        - regexp: {source: password, target: PROVISIONING_SHARED_SECRET}
    - <<: *token
      rewrite:
        - regexp: {source: password, target: PICKLE_KEY}
