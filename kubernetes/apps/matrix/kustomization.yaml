---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./postgres/ks.yaml
  - ./continuwuity/ks.yaml
  - ./livekit/ks.yaml
  - ./mautrix-whatsapp/ks.yaml
  - ./mautrix-discord/ks.yaml
  - ./sable/ks.yaml
components:
  - ../../flux/components/namespace
patches:
  - # Add the name to the namespace
    patch: |
      - op: add
        path: /metadata/name
        value: matrix
    target:
      kind: Namespace
