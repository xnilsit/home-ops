---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mautrix-discord
  namespace: flux-system
spec:
  targetNamespace: &namespace matrix
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/matrix/mautrix-discord/app
  dependsOn:
    # The Cluster its role and database go on
    - name: matrix-postgres
      namespace: flux-system
    # Mints the role password and the appservice tokens
    - name: external-secrets-generators
      namespace: flux-system
    # The homeserver it is registered with
    - name: continuwuity
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      PG_CLUSTER: matrix-postgres
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      name: *app
      namespace: *namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
