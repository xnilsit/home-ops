---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # Also read by recyclarr and cleanrr.
  name: &secret sonarr-secret
spec:
  # 0 freezes the value; any interval would rotate the key under its consumers.
  refreshInterval: "0"
  target:
    name: *secret
    template:
      data:
        SONARR__AUTH__APIKEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
