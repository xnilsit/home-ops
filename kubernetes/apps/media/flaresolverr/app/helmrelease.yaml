---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
spec:
  chartRef:
    kind: OCIRepository
    name: flaresolverr
  interval: 1h
  values:
    controllers:
      flaresolverr:
        # Stateless.
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: registry.nilsit.de/ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
            env:
              PORT: &port 8191
              LOG_LEVEL: info
              TZ: ${TIMEZONE}
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              # Covers the browser self-test on start.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              # Writable: undetected-chromedriver patches its driver into /app on start.
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                # One Chromium per solve.
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # flaresolverr in the image.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    # In-cluster only, for Prowlarr's indexer proxy; no UI.
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      # Chromium's shared memory; the runtime default of 64Mi crashes tabs.
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
