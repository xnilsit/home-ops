---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app slskd
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/slskd/app
  dependsOn:
    # The shared media PVC
    - name: media-storage
      namespace: flux-system
    # The API key and web UI password are minted by the password ClusterGenerator
    - name: external-secrets-generators
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
    # The /config PVC is provisioned through kopiur's Restore populator
    - name: kopiur-repository
      namespace: flux-system
    - name: rook-ceph-cluster
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: media
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
