---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # Provisions the /app PVC (named ${APP}) and snapshots it to the NAS.
  - ../../../../components/kopiur/backup
  # No ../../../../components/oidc-probe: the web UI sends its own JWT as a
  # bearer token, which passThroughAuthHeader would divert into the jwt filter.
  - ../../../../components/oidc
resources:
  # AirVPN WireGuard credentials and forwarded port, and the Soulseek account.
  - ./secret.sops.yaml
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
