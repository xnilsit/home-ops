---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # The API key is also what SoulSync is configured with.
  name: &secret slskd-secret
spec:
  # 0 freezes the values; any interval would rotate the key under SoulSync.
  refreshInterval: "0"
  target:
    name: *secret
  # One generator call per key, so they all differ.
  dataFrom:
    # The primary key, which slskd gives the Administrator role: 0.26.2 only
    # shows its options, and with them the downloads folder, to administrators.
    - sourceRef:
        generatorRef: &generator
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
      rewrite:
        - regexp:
            source: password
            target: SLSKD_API_KEY
    # The web UI login, behind the authentik gate as well.
    - sourceRef:
        generatorRef: *generator
      rewrite:
        - regexp:
            source: password
            target: SLSKD_PASSWORD
    # Fixed, so a restart does not sign the web UI out.
    - sourceRef:
        generatorRef: *generator
      rewrite:
        - regexp:
            source: password
            target: SLSKD_JWT_KEY
