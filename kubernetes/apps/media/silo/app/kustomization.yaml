---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # Dedicated Dragonfly (${APP}-dragonfly) for pub/sub, cache and Watch Party, snapshotted to Garage.
  - ../../../../components/dragonfly
  # Archived to Garage.
  - ../../../../components/postgres
resources:
  - ./database.yaml
  - ./objectbucketclaim.yaml
  - ./externalsecret-oidc.yaml
  - ./secret.sops.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./backendtrafficpolicy.yaml
patches:
  # Silo's Lua scripts touch keys they do not declare.
  - patch: |-
      - op: add
        path: /spec/args/-
        value: --default_lua_flags=allow-undeclared-keys
    target:
      group: dragonflydb.io
      kind: Dragonfly
  - patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: ${APP}-postgres
      spec:
        postgresql:
          extensions:
            # CNPG's own image, so the flat /lib + /share layout its defaults expect.
            - name: pgvector
              image:
                reference: ghcr.io/cloudnative-pg/pgvector:${PGVECTOR_IMAGE_TAG}
