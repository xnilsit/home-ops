---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ${APP}
spec:
  name: ${APP}
  owner: ${APP}
  cluster:
    name: ${APP}-postgres
  # Created by the operator, since the owner role cannot create `vector` itself.
  extensions:
    - name: vector
    - name: citext
    - name: pg_trgm
