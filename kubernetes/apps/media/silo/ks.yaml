---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app silo
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/silo/app
  dependsOn:
    # The shared media PVC
    - name: media-storage
      namespace: flux-system
    # Advertises gpu.intel.com/i915 to the Intel transcode nodes
    - name: intel-device-plugins-gpu
      namespace: flux-system
    # Advertises squat.ai/dri to the AMD transcode nodes
    - name: generic-device-plugin
      namespace: flux-system
    # Writes the silo-oidc Secret the ExternalSecret reads
    - name: authentik-oidc
      namespace: flux-system
    # The OIDC credential comes through the tofu-controller store
    - name: external-secrets-stores
      namespace: flux-system
    # Owns the store the Dragonfly password is pulled through
    - name: external-secrets-stores-database
      namespace: flux-system
    # Owns the store the snapshot credentials are pulled through
    - name: external-secrets-stores-garage
      namespace: flux-system
    # The Cluster references the barman plugin
    - name: barman-cloud-plugin
      namespace: flux-system
    # Backup bucket and key for the Cluster, and the Dragonfly snapshot credentials
    - name: garage
      namespace: flux-system
    - name: dragonfly-operator
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
    # The bucket StorageClass the OBCs claim through
    - name: rook-ceph-cluster
      namespace: flux-system
    # The transcode nodes' prepared downloads
    - name: local-path-provisioner
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      DRAGONFLY_REPLICAS: "2"
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
      PG_IMAGE_TAG: 18.7-minimal-trixie
      # OOM-killed at the 1Gi default under Silo's heavy query load.
      PG_MEMORY_LIMIT: 2Gi
      PG_MEMORY_REQUEST: 512Mi
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/pgvector versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-(?<build>\d+)-18-trixie$
      PGVECTOR_IMAGE_TAG: 0.8.7-202611241518-18-trixie
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: silo-postgres
      namespace: media
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      name: silo-dragonfly
      namespace: media
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: media
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      current: has(status.phase) && status.phase in ['Ready', 'ready']
      inProgress: has(status.phase) && status.phase in ['ResourcesCreated', 'Configuring', 'RollingUpdate']
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 30m
