---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: jellyfin
  interval: 1h
  values:
    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
        # SQLite on an RWO volume.
        strategy: Recreate
        containers:
          app:
            image:
              repository: registry.nilsit.de/ghcr.io/jellyfin/jellyfin
              tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
            env:
              JELLYFIN_PublishedServerUrl: https://jellyfin.${SECRET_DOMAIN}
              # Fontconfig's cache, for subtitle burn-in.
              XDG_CACHE_HOME: /cache
              TZ: ${TIMEZONE}
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              # Covers database migrations after an upgrade.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 90
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 8Gi
                # QSV. Also what places the pod: only the Intel nodes advertise it.
                gpu.intel.com/i915: 1
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # Also what kopiur's mover reads the volume as. The Intel plugin hands
        # the render node to this uid, so no supplementalGroups are needed.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /health
        hostnames:
          - "jellyfin.${SECRET_DOMAIN}"
        # Not behind components/oidc: the TV and mobile clients cannot follow
        # an OIDC redirect. Jellyfin keeps its own login.
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        # Provisioned by components/kopiur/backup through its Restore populator.
        existingClaim: jellyfin
      # Transcodes and image cache; rebuilt on demand.
      cache:
        type: emptyDir
        sizeLimit: 50Gi
      media:
        existingClaim: media
      tmp:
        type: emptyDir
