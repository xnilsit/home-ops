---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyfin
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/jellyfin/app
  dependsOn:
    # The shared media PVC
    - name: media-storage
      namespace: flux-system
    # Advertises gpu.intel.com/i915
    - name: intel-device-plugins-gpu
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
    # The /config PVC is provisioned through kopiur's Restore populator
    - name: kopiur-repository
      namespace: flux-system
    - name: rook-ceph-cluster
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      # Metadata, artwork and trickplay images.
      KOPIUR_CAPACITY: 20Gi
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: media
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
