---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
spec:
  chartRef:
    kind: OCIRepository
    name: navidrome
  interval: 1h
  values:
    controllers:
      navidrome:
        # SQLite on an RWO volume.
        strategy: Recreate
        initContainers:
          # The music folder has to exist before the app's read-only mount scans it.
          library-dir:
            image: &image
              repository: registry.nilsit.de/ghcr.io/navidrome/navidrome
              tag: 0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
            command:
              - "mkdir"
              - "-p"
              - "/media/library/music"
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              limits:
                memory: 32Mi
        containers:
          app:
            image: *image
            env:
              ND_PORT: &port 4533
              ND_DATAFOLDER: /data
              ND_MUSICFOLDER: /media/library/music
              # Transcodes and resized artwork, rebuilt on demand; kept out of the backup.
              ND_CACHEFOLDER: /cache
              ND_LOGLEVEL: info
              ND_ENABLEINSIGHTSCOLLECTOR: "false"
              # SoulSync and slskd write from other pods, which inotify on CephFS
              # never sees. SoulSync asks for a scan after each import; this
              # schedule catches anything else.
              ND_SCANNER_WATCHERWAIT: "0"
              ND_SCANNER_SCHEDULE: "@every 1h"
              TZ: ${TIMEZONE}
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # Also what kopiur's mover reads the volume as.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /ping
        hostnames:
          - "navidrome.${SECRET_DOMAIN}"
        # Not behind components/oidc: Subsonic apps cannot follow a gateway
        # redirect, and Navidrome has no OIDC of its own. It keeps its own login.
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        # Provisioned by components/kopiur/backup through its Restore populator.
        existingClaim: navidrome
        globalMounts:
          - path: /data
      media:
        existingClaim: media
        advancedMounts:
          navidrome:
            library-dir:
              - path: /media
            app:
              - path: /media
                readOnly: true
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
