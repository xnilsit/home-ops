---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: brrpolice
spec:
  chartRef:
    kind: OCIRepository
    name: brrpolice
  interval: 1h
  values:
    image:
      # The chart pins the digest that matches its version.
      repository: registry.nilsit.de/ghcr.io/zariel/brrpolice
    config:
      qbittorrent:
        base_url: http://qbittorrent.media.svc.cluster.local:8080
    extraEnv:
      - name: TZ
        value: ${TIMEZONE}
    podSecurityContext:
      runAsNonRoot: true
      # What kopiur's mover reads the volume as.
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    persistence:
      # Provisioned by components/kopiur/backup through its Restore populator.
      existingClaim: brrpolice
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
