---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./media-storage/ks.yaml
  - ./prowlarr/ks.yaml
  - ./flaresolverr/ks.yaml
  - ./sonarr/ks.yaml
  - ./radarr/ks.yaml
  - ./bazarr/ks.yaml
  - ./qbittorrent/ks.yaml
  - ./sabnzbd/ks.yaml
  - ./recyclarr/ks.yaml
  - ./jellyfin/ks.yaml
  - ./seerr/ks.yaml
  - ./autobrr/ks.yaml
  - ./qui/ks.yaml
  - ./cleanrr/ks.yaml
  - ./brrpolice/ks.yaml
components:
  - ../../flux/components/namespace
patches:
  - # Add the name to the namespace
    patch: |
      - op: add
        path: /metadata/name
        value: media
    target:
      kind: Namespace
