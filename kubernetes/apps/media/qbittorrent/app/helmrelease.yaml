---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          downloads-dir:
            image: &image
              repository: registry.nilsit.de/ghcr.io/home-operations/qbittorrent
              tag: 5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8
            command:
              - "mkdir"
              - "-p"
              - "/media/downloads/torrents"
            securityContext: &securityContext
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              limits:
                memory: 32Mi
          # Native sidecar: every packet of the pod leaves through the AirVPN
          # tunnel, and its firewall drops anything else while the tunnel is down.
          gluetun:
            image:
              repository: registry.nilsit.de/ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            restartPolicy: Always
            env:
              VPN_SERVICE_PROVIDER: airvpn
              VPN_TYPE: wireguard
              # The Talos kernel ships WireGuard, so no /dev/net/tun is needed.
              WIREGUARD_IMPLEMENTATION: kernelspace
              SERVER_COUNTRIES: Germany
              # The web UI, for envoy, the arr apps and the kubelet probes.
              FIREWALL_INPUT_PORTS: &port 8080
              TZ: ${TIMEZONE}
            # WireGuard keys, address, and FIREWALL_VPN_INPUT_PORTS: the port
            # forwarded in the AirVPN client area, opened on the tunnel.
            envFrom:
              - secretRef:
                  name: qbittorrent-vpn
            probes:
              # Holds qBittorrent back until the tunnel is up.
              startup:
                enabled: true
                custom: true
                spec:
                  exec: &healthcheck
                    command:
                      - "/gluetun-entrypoint"
                      - "healthcheck"
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: *healthcheck
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              # Root with NET_ADMIN for the WireGuard link, routes and iptables.
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              capabilities: {add: ["NET_ADMIN"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image: *image
            env:
              QBT_WEBUI_PORT: *port
              # Listens on the forwarded port, so peers can connect in.
              QBT_TORRENTING_PORT:
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-vpn
                    key: FIREWALL_VPN_INPUT_PORTS
              TZ: ${TIMEZONE}
            # TCP: the API answers 403 until the cluster subnets bypass the WebUI login.
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      # Lets in-flight pieces flush before the pod goes.
      terminationGracePeriodSeconds: 300
      # gluetun's resolver, so lookups go through the tunnel too.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      securityContext:
        # Pod-wide non-root is set per container: gluetun runs as root.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            client:
              oauth2:
                token-url: ${AUTHENTIK_URL}/application/o/token/
                client-id: home-ops-gatus-probe
                client-secret: $${GATUS_PROBE_CLIENT_SECRET}
                scopes: ["openid", "profile"]
        hostnames:
          - "qbittorrent.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        # Provisioned by components/kopiur/backup through its Restore populator.
        existingClaim: qbittorrent
        advancedMounts:
          qbittorrent:
            app:
              - path: /config
      media:
        existingClaim: media
        advancedMounts:
          qbittorrent:
            downloads-dir:
              - path: /media
            app:
              - path: /media
      tmp:
        type: emptyDir
        advancedMounts:
          qbittorrent:
            app:
              - path: /tmp
