---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  interval: 1h
  # The incomplete-dir init container can spend a while copying a large
  # backlog off CephFS; the 5m default would mark the upgrade failed.
  timeout: 1h
  values:
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          downloads-dir:
            image: &image
              repository: registry.nilsit.de/ghcr.io/home-operations/sabnzbd
              tag: 5.1.3@sha256:07790a7829201d9ea302e8b862078beac4b1a07003fe8359e3f069b6bcd84a95
            command:
              - "mkdir"
              - "-p"
              - "/media/downloads/usenet/incomplete"
              - "/media/downloads/usenet/complete"
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              limits:
                memory: 32Mi
          # Moves whatever is left in the old CephFS incomplete folder onto the
          # local volume, which the app mounts over that same path. Jobs pickle
          # their absolute paths, so download_dir must not change. Also enables
          # direct unpack, which unpacks while the job is still downloading.
          incomplete-dir:
            image: *image
            dependsOn: downloads-dir
            command:
              - "sh"
              - "-euc"
              - |
                sed -i -e 's|^direct_unpack *=.*$|direct_unpack = 1|' /config/sabnzbd.ini
                old=/media/downloads/usenet/incomplete
                if [ -n "$(ls -A "$old")" ]; then
                  total=$(du -sm "$old" | cut -f1)
                  echo "copying $total MiB from $old"
                  # Per file, skipping ones already copied at the same size, so a
                  # restart resumes. Not "cp -a $old/.": that also sets times on
                  # the root-owned /incomplete and fails after the full copy.
                  (
                    cd "$old"
                    find . -mindepth 1 -type d | while IFS= read -r d; do mkdir -p "/incomplete/$d"; done
                    find . -type f | while IFS= read -r f; do
                      if [ ! -f "/incomplete/$f" ] || [ "$(stat -c %s "$f")" != "$(stat -c %s "/incomplete/$f")" ]; then
                        cp -a "$f" "/incomplete/$f"
                      fi
                    done
                  ) &
                  pid=$!
                  start=$(date +%s); last_t=$start; last_mb=$(du -sm /incomplete | cut -f1)
                  while kill -0 "$pid" 2>/dev/null; do
                    sleep 10
                    now=$(date +%s); mb=$(du -sm /incomplete | cut -f1)
                    rate=$(( (mb - last_mb) / (now - last_t) ))
                    avg=$(( mb / (now - start) ))
                    eta=$(( avg > 0 ? (total - mb) / avg : 0 ))
                    printf '%s / %s MiB (%s%%)  %s MiB/s now, %s MiB/s avg  ETA %dm%02ds\n' \
                      "$mb" "$total" "$(( mb * 100 / (total > 0 ? total : 1) ))" \
                      "$rate" "$avg" "$(( eta / 60 ))" "$(( eta % 60 ))"
                    last_t=$now; last_mb=$mb
                  done
                  wait "$pid"
                  echo "copied in $(( $(date +%s) - start ))s, clearing $old"
                  find "$old" -mindepth 1 -delete
                fi
            securityContext: *securityContext
            resources:
              limits:
                memory: 256Mi
        containers:
          app:
            image: *image
            env:
              SABNZBD__PORT: &port 8080
              # Hostnames other than these are refused.
              SABNZBD__HOST_WHITELIST_ENTRIES: sabnzbd,sabnzbd.media,sabnzbd.media.svc,sabnzbd.media.svc.cluster.local,sabnzbd.${SECRET_DOMAIN}
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: sabnzbd-secret
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      # The incomplete volume is node-local. kube-wrk-01 has the largest
      # local-path disk (RAID1 SATA SSD) and keeps unrar off the Ceph nodes.
      nodeSelector:
        kubernetes.io/hostname: kube-wrk-01
      securityContext:
        runAsNonRoot: true
        # Also what kopiur's mover reads the volume as.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            client:
              oauth2:
                token-url: ${AUTHENTIK_URL}/application/o/token/
                client-id: home-ops-gatus-probe
                client-secret: $${GATUS_PROBE_CLIENT_SECRET}
                scopes: ["openid", "profile"]
        hostnames:
          - "sabnzbd.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        # Provisioned by components/kopiur/backup through its Restore populator.
        existingClaim: sabnzbd
      media:
        existingClaim: media
      incomplete:
        type: persistentVolumeClaim
        # The chart would name a lone PVC "sabnzbd", the config claim's name.
        forceRename: sabnzbd-incomplete
        storageClass: local-path
        accessMode: ReadWriteOnce
        # local-path does not enforce it; the queued post-processing backlog
        # keeps its RARs here, so leave headroom.
        size: 400Gi
        advancedMounts:
          sabnzbd:
            incomplete-dir:
              - path: /incomplete
            app:
              - path: /media/downloads/usenet/incomplete
      tmp:
        type: emptyDir
