---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sabnzbd
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/sabnzbd/app
  dependsOn:
    # The shared media PVC
    - name: media-storage
      namespace: flux-system
    # The API key is minted by the password ClusterGenerator
    - name: external-secrets-generators
      namespace: flux-system
    # Writes the sabnzbd-oidc Secret the oidc component reads
    - name: authentik-oidc
      namespace: flux-system
    # Owns the tofu-controller ClusterSecretStore
    - name: external-secrets-stores
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
    # The /config PVC is provisioned through kopiur's Restore populator
    - name: kopiur-repository
      namespace: flux-system
    - name: rook-ceph-cluster
      namespace: flux-system
    # The node-local incomplete volume
    - name: local-path-provisioner
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      OIDC_HOST: sabnzbd.${SECRET_DOMAIN}
      OIDC_ROUTE: *app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: media
    - apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      name: sabnzbd-oidc
      namespace: media
  healthCheckExprs:
    - apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      failed: status.ancestors.exists(a, a.conditions.exists(c, c.type == 'Accepted' && c.status == 'False'))
      current: status.ancestors.exists(a, a.conditions.exists(c, c.type == 'Accepted' && c.status == 'True'))
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  # wait: false, since wait: true would ignore the healthCheckExprs above.
  wait: false
  interval: 1h
  # Matches the HelmRelease timeout, for the incomplete-dir copy.
  timeout: 1h
