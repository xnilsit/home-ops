---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app media-files
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/media-files/app
  dependsOn:
    # The shared media PVC
    - name: media-storage
      namespace: flux-system
    # Writes the media-files-oidc Secret the ExternalSecret reads
    - name: authentik-oidc
      namespace: flux-system
    # The OIDC credential comes through the tofu-controller store
    - name: external-secrets-stores
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: media
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
