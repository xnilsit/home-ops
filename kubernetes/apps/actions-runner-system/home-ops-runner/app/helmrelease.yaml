---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-ops-runner
spec:
  chartRef:
    kind: OCIRepository
    name: home-ops-runner
  interval: 1h
  values:
    githubConfigUrl: https://github.com/xnilsit/home-ops
    githubConfigSecret: home-ops-runner-github-app
    # The runs-on label.
    runnerScaleSetName: home-ops-runner
    minRunners: 2
    maxRunners: 6
    # Explicit so rendering skips the chart's cluster lookup.
    controllerServiceAccount:
      namespace: actions-runner-system
      name: actions-runner-controller-gha-rs-controller
    containerMode:
      # Hook copies the workspace into job pods, so work can be an emptyDir.
      type: kubernetes-novolume
    template:
      spec:
        runtimeClassName: gvisor
        # Resolve external names without the cluster search list.
        dnsConfig:
          options:
            - name: ndots
              value: "2"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 123
          fsGroup: 123
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.0
            command:
              - "/home/runner/run.sh"
            env:
              # Chart default true would reject every job without a container:.
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
                value: /home/runner/hook-template/job-pod.yaml
              # runs-on/cache backend: the flate-cache bucket on RGW.
              - name: RUNS_ON_S3_BUCKET_CACHE
                value: flate-cache
              - name: RUNS_ON_S3_BUCKET_ENDPOINT
                value: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc
              - name: RUNS_ON_S3_FORCE_PATH_STYLE
                value: "true"
              # Keeps the AWS credentials below instead of discarding them.
              - name: RUNS_ON_RUNNER_NAME
                value: ""
              - name: AWS_REGION
                value: us-east-1
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef: {name: flate-cache, key: AWS_ACCESS_KEY_ID}
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef: {name: flate-cache, key: AWS_SECRET_ACCESS_KEY}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
            resources:
              requests:
                cpu: 250m
              limits:
                memory: 4Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: hook-template
                mountPath: /home/runner/hook-template
                readOnly: true
              - name: buildkit-client
                mountPath: /home/runner/buildkit-certs
                readOnly: true
        volumes:
          - name: work
            emptyDir:
              sizeLimit: 10Gi
          - name: hook-template
            configMap:
              name: home-ops-runner-hook-template
          - name: buildkit-client
            secret:
              secretName: buildkit-client
