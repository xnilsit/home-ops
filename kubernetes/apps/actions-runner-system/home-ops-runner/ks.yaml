---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-ops-runner
  namespace: flux-system
spec:
  targetNamespace: actions-runner-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/actions-runner-system/home-ops-runner/app
  dependsOn:
    - name: actions-runner-controller
      namespace: flux-system
    # ceph-bucket-delete StorageClass for the flate-cache bucket
    - name: rook-ceph-cluster
      namespace: flux-system
    # gvisor RuntimeClass for runner and job pods
    - name: runtime-classes
      namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: actions-runner-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
