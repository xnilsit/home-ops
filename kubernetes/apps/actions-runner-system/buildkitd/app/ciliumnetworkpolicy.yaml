---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buildkitd-from-runners
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
  ingress:
    - fromEndpoints:
        - matchLabels:
            actions.github.com/scale-set-name: home-ops-runner
      toPorts:
        - ports:
            - port: "1234"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runners-to-buildkitd
spec:
  endpointSelector:
    matchLabels:
      actions.github.com/scale-set-name: home-ops-runner
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: buildkitd
      toPorts:
        - ports:
            - port: "1234"
              protocol: TCP
---
# Image pushes to apoci. registry.nilsit.de resolves to envoy-external-direct's
# LAN address, which actions-runner-egress carves out with the private ranges.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buildkitd-to-apoci
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external-direct
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
