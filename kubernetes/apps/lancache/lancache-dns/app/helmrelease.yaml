---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lancache-dns
spec:
  chartRef:
    kind: OCIRepository
    name: lancache-dns
  interval: 1h
  values:
    controllers:
      lancache-dns:
        type: deployment
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        containers:
          app:
            image:
              # lancachenet publish no versioned tags and nothing on GHCR, so
              # the digest is the only pin Renovate can move.
              repository: docker.io/lancachenet/lancache-dns
              tag: latest@sha256:cec61382a3b4b8ef6dfc4ff44eefd4028ea48662ff5930097bb366b69e22296c
            env:
              # Both or neither: dnstool exits fatally if one is set alone.
              USE_GENERIC_CACHE: "true"
              # Space separated, and every address must be RFC1918 or startup
              # is fatal. One A record per IP, served round robin.
              LANCACHE_IP: "192.168.1.61 192.168.1.62 192.168.1.63 192.168.1.64"
              # blocky, for everything this is not authoritative for. Safe from
              # looping only because blocky's mapping lists exactly the zones
              # generated here - see blocky's config-lancache.yaml.
              UPSTREAM_DNS: "192.168.1.53"
              # No git pull at startup: freezes the zone set to the image so it
              # matches the committed blocky mapping, and so both replicas agree.
              NOFETCH: "true"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec: &probeCommand
                    command:
                      - /bin/sh
                      - -c
                      # Proves the generated zone actually loaded; a tcpSocket
                      # probe would pass with an empty RPZ.
                      - dig +time=2 +tries=1 +short @127.0.0.1 steam.cache.lancache.net | grep -q '^192\.168\.1\.6'
                  periodSeconds: 5
                  failureThreshold: 60
              readiness: &probe
                enabled: true
                custom: true
                spec:
                  exec: *probeCommand
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness: *probe
            securityContext:
              # dnstool rewrites /etc/resolv.conf and log.Fatal()s if it cannot,
              # and named regenerates /etc/bind on every start.
              readOnlyRootFilesystem: false
              # named drops to the bind user itself, but only after capset().
              allowPrivilegeEscalation: true
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "CHOWN"
                  - "DAC_OVERRIDE"
                  - "DAC_READ_SEARCH"
                  - "FOWNER"
                  - "NET_BIND_SERVICE"
                  - "SETGID"
                  - "SETUID"
                  - "SYS_CHROOT"
                  - "SYS_RESOURCE"
            resources:
              requests:
                cpu: 100m
                memory: 192Mi
              limits:
                cpu: 1
                memory: 512Mi
    defaultPodOptions:
      # blocky conditional-forwards every cache domain here, so an eviction
      # takes game downloads down LAN-wide.
      priorityClassName: cluster-platform
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: lancache-dns
                  app.kubernetes.io/instance: lancache-dns
                  app.kubernetes.io/controller: lancache-dns
      securityContext:
        # Every process starts as root: named needs it to read /etc/bind and to
        # capset before dropping to bind.
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
    service:
      dns:
        controller: lancache-dns
        primary: true
        type: LoadBalancer
        # Cluster, never Local: Cilium's L2 announcer is not endpoint-aware and
        # would ARP for this IP from nodes with no local pod.
        externalTrafficPolicy: Cluster
        # IPv4 only, unlike blocky: the generated zones hold A records only, so
        # a v6 address here could never point at the cache.
        ipFamilyPolicy: SingleStack
        ipFamilies:
          - "IPv4"
        annotations:
          lbipam.cilium.io/ips: "192.168.1.60"
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
            primary: true
          dns-udp:
            port: 53
            protocol: UDP
    persistence:
      # 17 file channels at versions 3 size 5m; named logs nothing to stdout.
      named-logs:
        type: emptyDir
        sizeLimit: 512Mi
        globalMounts:
          - path: /var/log/named
