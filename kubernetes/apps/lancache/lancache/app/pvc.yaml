---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}
spec:
  # RWO on ceph-block, not CephFS: nginx's keys_zone index is per-process shared
  # memory, so only one pod can ever own this cache, and 300k+ slice files are
  # far cheaper without the MDS in the path. Not backed up - everything here is
  # re-downloadable, and a kopia repo of CDN blobs would be pathological.
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 500Gi
  storageClassName: ceph-block
