---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lancache
spec:
  chartRef:
    kind: OCIRepository
    name: lancache
  interval: 1h
  values:
    controllers:
      lancache:
        type: deployment
        replicas: 1
        # RWO volume, and two nginx instances over one cache directory would
        # evict each other's entries.
        strategy: Recreate
        initContainers:
          init-perms:
            # The image's own 20_perms_check.sh is a no-op: it runs
            # `su - www-data`, whose shell is /usr/sbin/nologin, so the chown
            # branch never executes and nginx cannot write a fresh volume.
            # O(1) - nginx creates everything below these as www-data.
            image:
              repository: &image docker.io/lancachenet/monolithic
              tag: &tag latest@sha256:37f28b362c939a333f3e4f12aa8ca80604cf75050b2f190d0ad972b2fedce00e
            command:
              - /bin/sh
              - -c
              - mkdir -p /data/cache/cache && chown 33:33 /data/cache /data/cache/cache /data/logs
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"], add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              # lancachenet publish no versioned tags and nothing on GHCR, so
              # the digest is the only pin Renovate can move.
              repository: *image
              tag: *tag
            env:
              # The gateway, NOT blocky: blocky conditional-forwards the cache
              # domains to lancache-dns, which answers with .61-.64, so nginx
              # pointed at blocky would proxy to itself. The 443 stream path has
              # no loop detection at all.
              UPSTREAM_DNS: "192.168.0.1"
              # Below the 300Gi claim, with min_free as the statfs-based guard.
              # Neither is in the CONFIGHASH, so both stay retunable.
              CACHE_DISK_SIZE: 260g
              MIN_FREE_DISK: 20g
              CACHE_INDEX_SIZE: 500m
              # In the CONFIGHASH: changing it later hard-fails startup until
              # /data/cache/CONFIGHASH is deleted by hand.
              CACHE_SLICE_SIZE: 1m
              # auto reads the node's core count, not the cgroup quota. Keep in
              # step with limits.cpu.
              NGINX_WORKER_PROCESSES: "4"
              # No git pull at startup; the domain list ships with the image.
              NOFETCH: "true"
              TZ: "${TIMEZONE}"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &probeTarget
                    path: /lancache-heartbeat
                    port: &httpPort 80
                  periodSeconds: 10
                  # 15m: CONFIGHASH check, domain map build and nginx -t.
                  failureThreshold: 90
              readiness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet: *probeTarget
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Deliberately loose: nginx answers while the cache loader is
              # still walking the tree, and that walk is slow on a full volume.
              liveness: *probe
            securityContext:
              # 10_setup.sh rewrites ~10 files under /etc/nginx under `set -e`.
              readOnlyRootFilesystem: false
              # The nginx master forks its workers as www-data.
              allowPrivilegeEscalation: true
              capabilities:
                # NET_BIND_SERVICE is needed even as uid 0: drop ALL removes it
                # from the bounding set and port 80 then fails to bind.
                drop:
                  - "ALL"
                add:
                  - "CHOWN"
                  - "DAC_OVERRIDE"
                  - "FOWNER"
                  - "NET_BIND_SERVICE"
                  - "SETGID"
                  - "SETUID"
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                # CACHE_INDEX_SIZE is charged to the cgroup as it fills; the
                # rest is workers plus reclaimable page cache, which is the
                # whole point of running this.
                cpu: 4
                memory: 8Gi
    defaultPodOptions:
      priorityClassName: cluster-platform
      automountServiceAccountToken: false
      securityContext:
        # nginx must start as root to bind 80/443 and fork www-data workers.
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
    service:
      # Four addresses, one pod: lancache-dns hands out all four per domain, so
      # clients spread over them. Upstream's own answer to scaling a monolithic
      # instance. Cluster, never Local - Cilium's L2 announcer is not
      # endpoint-aware and would ARP from nodes with no local pod.
      cache1:
        controller: lancache
        primary: true
        type: LoadBalancer
        externalTrafficPolicy: &etp Cluster
        ipFamilyPolicy: &ipFamilyPolicy SingleStack
        ipFamilies: &ipFamilies
          - "IPv4"
        annotations:
          lbipam.cilium.io/ips: "192.168.1.61"
        ports: &cachePorts
          http:
            port: *httpPort
            protocol: TCP
            primary: true
          # monolithic's own nginx stream listener, ssl_preread passthrough.
          https:
            port: 443
            protocol: TCP
      cache2:
        controller: lancache
        primary: false
        type: LoadBalancer
        externalTrafficPolicy: *etp
        ipFamilyPolicy: *ipFamilyPolicy
        ipFamilies: *ipFamilies
        annotations:
          lbipam.cilium.io/ips: "192.168.1.62"
        ports: *cachePorts
      cache3:
        controller: lancache
        primary: false
        type: LoadBalancer
        externalTrafficPolicy: *etp
        ipFamilyPolicy: *ipFamilyPolicy
        ipFamilies: *ipFamilies
        annotations:
          lbipam.cilium.io/ips: "192.168.1.63"
        ports: *cachePorts
      cache4:
        controller: lancache
        primary: false
        type: LoadBalancer
        externalTrafficPolicy: *etp
        ipFamilyPolicy: *ipFamilyPolicy
        ipFamilies: *ipFamilies
        annotations:
          lbipam.cilium.io/ips: "192.168.1.64"
        ports: *cachePorts
    persistence:
      cache:
        existingClaim: lancache
        advancedMounts:
          lancache:
            init-perms: &cacheMounts
              - path: /data/cache
                subPath: cache
              - path: /data/logs
                subPath: logs
            app: *cacheMounts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
