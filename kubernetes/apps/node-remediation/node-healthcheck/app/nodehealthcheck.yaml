---
apiVersion: remediation.medik8s.io/v1alpha1
kind: NodeHealthCheck
metadata:
  name: node-healthcheck
spec:
  # Every node, since all three are control-plane and there is no worker pool to
  # scope this to. Spelled out rather than `{}` because the validating webhook
  # rejects a selector with no matchLabels and no matchExpressions.
  selector:
    matchLabels:
      kubernetes.io/os: linux
  # 51% of 3 nodes requires 2 healthy, so one lost node is remediated and two
  # are not - which is the guardrail against fencing on a network partition.
  minHealthy: "51%"
  unhealthyConditions:
    - type: Ready
      status: "False"
      duration: 900s
    - type: Ready
      status: Unknown
      duration: 900s
  remediationTemplate:
    apiVersion: self-node-remediation.medik8s.io/v1alpha1
    kind: SelfNodeRemediationTemplate
    name: self-node-remediation-outofservice-template
    namespace: node-remediation
