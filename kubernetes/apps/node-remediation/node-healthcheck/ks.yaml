---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app node-healthcheck
  namespace: flux-system
spec:
  targetNamespace: node-remediation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/node-remediation/node-healthcheck/app
  dependsOn:
    # The NodeHealthCheck references a SelfNodeRemediationTemplate, so that CRD
    # and the template itself have to exist first
    - name: self-node-remediation
      namespace: flux-system
    - name: cert-manager
      namespace: flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
