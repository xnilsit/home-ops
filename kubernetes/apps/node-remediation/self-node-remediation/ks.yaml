---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app self-node-remediation
  namespace: flux-system
spec:
  targetNamespace: node-remediation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/node-remediation/self-node-remediation/app
  dependsOn:
    # The webhook cert comes from a cert-manager Certificate
    - name: cert-manager
      namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: self-node-remediation-controller-manager
      namespace: node-remediation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 1h
  timeout: 10m
