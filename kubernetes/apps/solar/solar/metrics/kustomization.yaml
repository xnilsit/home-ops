---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/kopiur/backup
resources:
  - ./vmsingle.yaml
  - ./grafana.yaml
configMapGenerator:
  - name: vmsolar-scrape
    files:
      - scrape.yaml=./resources/scrape.yaml
  - name: solar-dashboard
    files:
      - solar-dashboard.json=./resources/solar-dashboard.json
    options:
      annotations:
        # Panel math references $A and $B.
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
