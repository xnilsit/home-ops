---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/kopiur/backup
resources:
  - ./vmsingle.yaml
  - ./grafana.yaml
configMapGenerator:
  - name: vmsolar-scrape
    files:
      - scrape.yaml=./resources/scrape.yaml
    options:
      # Named in VMSingle.spec.configMaps, which kustomize does not rewrite.
      disableNameSuffixHash: true
  - name: solar-dashboard
    files:
      - solar-dashboard.json=./resources/solar-dashboard.json
    options:
      annotations:
        # Panel math references $TOTAL.
        kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  # Propagates the generated name hash into GrafanaDashboard.spec.configMapRef.
  - ./kustomizeconfig.yaml
