---
# Job names and targets match the old compose stack, so its imported series
# continue under the same labels.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
scrape_configs:
  - job_name: mqtt2prometheus
    static_configs:
      - targets:
          - "mqtt2prometheus:9641"
  - job_name: mqtt2prometheus2
    static_configs:
      - targets:
          - "mqtt2prometheus2:9641"
