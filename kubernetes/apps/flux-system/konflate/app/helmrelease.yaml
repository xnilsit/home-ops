---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      repo: github://xnilsit/home-ops
      # Write-back: the "Konflate" commit status plus one sticky summary comment
      statusChecks: true
      prComments: true
      publicUrl: https://konflate.${SECRET_DOMAIN}
      # Read-only /mcp endpoint, so Claude Code can query rendered PR diffs
      mcp: true
      # HEAD every newly referenced image tag, flagging one that does not exist
      verifyImages: true
    secret:
      existingSecret: konflate-secret
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: https
      hostnames:
        - "konflate.${SECRET_DOMAIN}"
    persistence:
      # Keeps the source caches, git mirror and rendered diffs across restarts.
      # The claim itself comes from the kopiur backup component, which populates
      # it from the newest snapshot before this starts.
      enabled: true
      existingClaim: konflate
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        # Drives GOMEMLIMIT (90%); headroom for a bump that re-renders every app
        memory: 2Gi
