---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
spec:
  dependsOn:
    - name: flux-operator
    # Holds the switch from the bootstrap source to registry.${SECRET_DOMAIN} until it serves the newest artifact
    - name: apoci-seed
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux-instance/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  wait: false
