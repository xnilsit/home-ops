---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: artifact-webhook
spec:
  # Called by .github/workflows/publish.yaml once a new artifact is pushed.
  type: generic
  secretRef:
    name: artifact-webhook-token-secret
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      name: flux-system
      namespace: flux-system
