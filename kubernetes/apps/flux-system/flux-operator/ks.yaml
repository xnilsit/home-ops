---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux-operator/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  wait: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator-oidc
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux-operator/oidc
  dependsOn:
    # The HTTPRoute this attaches to
    - name: flux-operator
      namespace: flux-system
    # The SecurityPolicy needs the envoy gateway CRDs
    - name: envoy-gateway
      namespace: flux-system
    # flux-oidc is pulled from the Secret the tofu module writes
    - name: authentik-oidc
      namespace: flux-system
    # Owns the ClusterSecretStore the credential ExternalSecrets read through
    - name: external-secrets-stores
      namespace: flux-system
  postBuild:
    substitute:
      APP: flux
      OIDC_HOST: flux.${SECRET_DOMAIN}
      OIDC_ROUTE: flux-operator
  healthChecks:
    - apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      name: flux-oidc
      namespace: flux-system
  healthCheckExprs:
    # SecurityPolicy reports Gateway API PolicyStatus - status.ancestors[] - not
    # the flat status.conditions kstatus reads. With no ancestors yet neither
    # expr matches, which is the InProgress that lets Flux retry while ESO
    # is still filling in the Secret.
    - apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      failed: status.ancestors.exists(a, a.conditions.exists(c, c.type == 'Accepted' && c.status == 'False'))
      current: status.ancestors.exists(a, a.conditions.exists(c, c.type == 'Accepted' && c.status == 'True'))
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  # wait: false, since wait: true would ignore the healthCheckExprs above.
  wait: false
