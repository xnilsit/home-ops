---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator
  # Probes authenticate rather than follow the SecurityPolicy's 302:
  # gatus follows redirects, so an unauthenticated check would land on
  # authentik's login page and call the app healthy. passThroughAuthHeader
  # in components/oidc lets the resulting JWT past the oauth2 filter. $$
  # keeps Flux's envsubst off the secret - gatus expands it itself.
  annotations:
    gatus.home-operations.com/endpoint: |
      client:
        oauth2:
          token-url: ${AUTHENTIK_URL}/application/o/token/
          client-id: home-ops-gatus-probe
          client-secret: $${GATUS_PROBE_CLIENT_SECRET}
          scopes: ["openid", "profile"]
spec:
  hostnames:
    - "flux.${SECRET_DOMAIN}"
  parentRefs:
    # envoy-internal only, guarded by the SecurityPolicy in ../oidc: read-write
    # over every Flux resource in the cluster.
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        # The operator Service multiplexes metrics (8080) and the UI (9080).
        - name: flux-operator
          port: 9080
      matches:
        - path:
            type: PathPrefix
            value: /
