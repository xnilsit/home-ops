---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator
spec:
  hostnames:
    - "flux.${SECRET_DOMAIN}"
  parentRefs:
    # envoy-internal only, guarded by the SecurityPolicy in ../oidc: read-write
    # over every Flux resource in the cluster.
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        # The operator Service multiplexes metrics (8080) and the UI (9080).
        - name: flux-operator
          port: 9080
      matches:
        - path:
            type: PathPrefix
            value: /
