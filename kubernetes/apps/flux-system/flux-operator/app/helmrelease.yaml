---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    # Owns the FluxInstance, so nothing in the cluster reconciles without it.
    # Built-in class: flux-operator is bootstrapped before Flux itself exists.
    # The controllers it creates already run at this priority, except
    # notification-controller, which is patched in ../../flux-instance.
    priorityClassName: system-cluster-critical
    serviceMonitor:
      create: true
    web:
      # The UI (port 9080) is on by default; the route is a plain manifest in
      # ./httproute.yaml rather than web.httpRoute, because helmfile installs
      # this chart at bootstrap, before the Gateway API CRDs exist.
      config:
        authentication:
          # No login of its own - the SecurityPolicy in ../oidc is the gate.
          # Anonymous is still required over the chart default: unimpersonated,
          # every visitor acts as the operator's ServiceAccount (cluster-admin).
          # Impersonating a fixed user caps the UI at what ./rbac.yaml grants.
          type: Anonymous
          anonymous:
            username: flux-web-anonymous
