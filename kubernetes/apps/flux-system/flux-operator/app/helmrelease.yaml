---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    # Owns the FluxInstance, so nothing in the cluster reconciles without it.
    # Built-in class: flux-operator is bootstrapped before Flux itself exists.
    # The controllers it creates already run at this priority, except
    # notification-controller, which is patched in ../../flux-instance.
    priorityClassName: system-cluster-critical
    serviceMonitor:
      create: true
    web:
      # The UI (port 9080) is on by default; the route is a plain manifest in
      # ./httproute.yaml rather than web.httpRoute, because helmfile installs
      # this chart at bootstrap, before the Gateway API CRDs exist.
      config:
        authentication:
          # Without this the UI is unauthenticated AND unimpersonated, so every
          # visitor acts as the operator's ServiceAccount - cluster-admin, with
          # every GitOps action enabled. Impersonating a fixed user instead
          # means the UI can do exactly what ./rbac.yaml grants it.
          type: Anonymous
          anonymous:
            username: flux-web-anonymous
