---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cnpg-dashboard.yaml
  - ./dotdc-dashboards.yaml
  - ./etcd-dashboard.yaml
patches:
  - patch: |
      - op: add
        path: /spec/instanceSelector
        value:
          matchLabels:
            dashboards: grafana
    target:
      kind: GrafanaDashboard
