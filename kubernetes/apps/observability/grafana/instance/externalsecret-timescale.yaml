# Pulled rather than reflected: reflector acts on events only and gives up on a
# mirror whose source did not exist yet, logging once and never retrying. ESO
# re-reads on the interval below.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret grafana-timescale-ro
spec:
  # The same read-only role blocky-ui uses; the query-log datasource reads its
  # password through grafana-operator's valuesFrom.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  target:
    name: *secret
  dataFrom:
    - extract:
        key: timescale-blocky-ro
