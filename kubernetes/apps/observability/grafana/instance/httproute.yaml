---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  # / is 200 only because anonymous auth is on; revoking that would turn the
  # probe into a login-page check. /api/health needs no session either way.
  annotations:
    gatus.home-operations.com/endpoint: |
      path: /api/health
spec:
  hostnames:
    - "grafana.${CLUSTER_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /
