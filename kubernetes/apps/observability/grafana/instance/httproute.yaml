---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  # /api/health is the only unauthenticated endpoint left now that anonymous
  # auth is off; / redirects to the OIDC login.
  annotations:
    gatus.home-operations.com/endpoint: |
      path: /api/health
spec:
  hostnames:
    - "grafana.${CLUSTER_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    # Basic auth stays on for grafana-operator, which reaches the Service
    # directly; dropping the header here keeps that off the public listener.
    # Browser sessions are cookie-based, so only external API clients lose out.
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - "Authorization"
      backendRefs:
        - name: grafana-service
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /
