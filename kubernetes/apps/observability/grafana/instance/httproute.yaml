---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
spec:
  hostnames:
    - "grafana.${CLUSTER_DOMAIN}"
  parentRefs:
    # LAN only. cloudflare-dns runs with --gateway-name=envoy-external, so
    # moving off that gateway is also what drops the public DNS record - which
    # made the previous external-dns target annotation dead weight. Resolution
    # is now k8s-gateway, which watches HTTPRoutes on either gateway and
    # answers with the parent's address.
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /
