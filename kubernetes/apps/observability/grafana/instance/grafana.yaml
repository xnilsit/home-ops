---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  # Overrides grafana-operator's default image tag.
  # renovate: datasource=docker depName=docker.io/grafana/grafana
  version: docker.io/grafana/grafana:13.2.3
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      # No password form on a publicly reachable host. Basic auth stays on for
      # the API, which is how grafana-operator reconciles dashboards.
      disable_login_form: "true"
      # Real SSO logout; without it signing out leaves the authentik session up.
      signout_redirect_url: ${AUTHENTIK_URL}/application/o/home-ops-grafana/end-session/
    auth.anonymous:
      enabled: "false"
    auth.generic_oauth:
      enabled: "true"
      name: authentik
      # Skips the "Sign in with authentik" click. Safe to pair with
      # signout_redirect_url: authentik ends its own session, so signing out
      # lands on its login page rather than bouncing straight back in.
      auto_login: "true"
      # client_id/client_secret arrive as env, from ./externalsecret-oidc.yaml.
      # Endpoints pinned rather than discovered - the issuer path segment is the
      # authentik application slug, which tofu keeps at home-ops-<app>.
      auth_url: ${AUTHENTIK_URL}/application/o/authorize/
      token_url: ${AUTHENTIK_URL}/application/o/token/
      api_url: ${AUTHENTIK_URL}/application/o/userinfo/
      # offline_access is what makes use_refresh_token below more than a no-op:
      # authentik only issues a refresh token when it is requested.
      scopes: openid email profile offline_access
      use_refresh_token: "true"
      # Only home-ops is bound to the application, so the fallback is unreachable
      # today; it keeps a future group from silently landing as Admin.
      role_attribute_path: contains(groups[*], 'home-ops') && 'Admin' || 'Viewer'
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
      # Keeps the plugin versions bundled in the image.
      preinstall_auto_update: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: https://grafana.${CLUSTER_DOMAIN}
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
                # Env rather than spec.config, which is a plaintext ConfigMap.
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: &oidcSecret grafana-oidc
                      key: client-id
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: *oidcSecret
                      key: client-secret
                # Installs the plugin ./datasource-logs.yaml needs at container
                # start. plugin_admin_enabled stays false.
                - name: GF_INSTALL_PLUGINS
                  value: victoriametrics-logs-datasource
              volumeMounts:
                # Writable scratch for the plugin installer's download, which
                # readOnlyRootFilesystem otherwise refuses.
                - name: tmp
                  mountPath: /tmp
                # Served as /public/geo/cities.json, the geomap city lookup.
                - name: geo
                  mountPath: /usr/share/grafana/public/geo
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                limits:
                  memory: 1Gi
                requests:
                  cpu: 22m
                  memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          initContainers:
            # Builds a geomap gazetteer keyed COUNTRY/City from GeoNames
            # cities5000, the names GeoLite2 uses, plus COUNTRY at its capital.
            # Writes an empty lookup if the download fails, so grafana still
            # starts.
            - name: geonames-gazetteer
              image: mirror.gcr.io/curlimages/curl:8.22.0
              command:
                - "/bin/sh"
                - "-c"
              args:
                - |
                  set -eu
                  out=/geo/cities.json
                  echo '[]' > "$out"
                  cd /tmp
                  if curl -fsSL --max-time 120 -o cities.zip https://download.geonames.org/export/dump/cities5000.zip && unzip -o -q cities.zip; then
                    awk -F '\t' '
                      { k = $9 "/" $2; p = $15 + 0
                        if (!(k in pop) || p > pop[k]) { pop[k] = p; lat[k] = $5; lon[k] = $6 }
                        if ($8 == "PPLC" && (!($9 in pop) || p > pop[$9])) { pop[$9] = p; lat[$9] = $5; lon[$9] = $6 } }
                      END {
                        printf "{\"fields\":[{\"name\":\"key\",\"values\":["
                        n = 0; for (k in pop) { e = k; gsub(/\\/, "\\\\", e); gsub(/"/, "\\\"", e); ks[n++] = k; printf "%s\"%s\"", (n > 1 ? "," : ""), e }
                        printf "]},{\"name\":\"lat\",\"values\":["
                        for (i = 0; i < n; i++) printf "%s%.2f", (i ? "," : ""), lat[ks[i]]
                        printf "]},{\"name\":\"lon\",\"values\":["
                        for (i = 0; i < n; i++) printf "%s%.2f", (i ? "," : ""), lon[ks[i]]
                        printf "]}]}\n"
                      }' cities5000.txt > "$out.tmp" && mv "$out.tmp" "$out"
                  fi
                  rm -f cities.zip cities5000.txt
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: geo
                  mountPath: /geo
                - name: geo-tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
            - name: geo
              emptyDir: {}
            - name: geo-tmp
              emptyDir: {}
            - name: grafana-data
              # Owned by the kopiur backup component, which populates it from
              # the newest snapshot before this starts. spec.persistentVolumeClaim
              # is deliberately absent so the operator provisions nothing.
              persistentVolumeClaim:
                claimName: grafana
  disableDefaultSecurityContext: All
