---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: grafana-timescale-ro
  annotations:
    # Read-only role, which matters here because this Grafana has anonymous auth
    # enabled - a datasource with write credentials would be reachable through
    # Explore.
    reflector.v1.k8s.emberstack.com/reflects: database/timescale-blocky-ro
type: Opaque
