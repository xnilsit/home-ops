---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: smartctl-exporter
spec:
  interval: 15m
  url: oci://ghcr.io/prometheus-community/charts/prometheus-smartctl-exporter
  ref:
    tag: 0.19.2
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name smartctl-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: smartctl-exporter
  values:
    fullnameOverride: *name
    serviceMonitor:
      enabled: true
      relabelings:
        - action: replace
          sourceLabels:
            - "__meta_kubernetes_pod_node_name"
          targetLabel: instance
    prometheusRules:
      enabled: false
    image:
      repository: registry.nilsit.de/ghcr.io/prometheus-community/smartctl-exporter
      tag: v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
  postRenderers:
    # The chart mounts the host /dev at /hostdev, but smartctl scans the
    # container's /dev, a snapshot taken at container start. Disks hotplugged
    # later (the USB HDD docks) were never found until the pod restarted.
    # The chart hardcodes the mount path.
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/volumeMounts/0/mountPath
                value: /dev
