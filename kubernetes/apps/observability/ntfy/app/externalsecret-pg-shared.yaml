# Pulled out of another namespace through a ClusterSecretStore. ESO re-reads on
# the interval below, so an ordering surprise costs a refresh rather than a
# stuck deploy.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ntfy-pg-shared
spec:
  # ntfy's database on the shared cluster. Not the postgres-shared component:
  # ntfy predates it and its Database, DatabaseRole and password Secret are
  # still declared under kubernetes/apps/database/pg-shared/app.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  target:
    name: *secret
  dataFrom:
    - extract:
        key: pg-shared-ntfy
