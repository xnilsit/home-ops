# Pulled rather than reflected: reflector acts on events only and gives up on a
# mirror whose source did not exist yet, logging once and never retrying. ESO
# re-reads on the interval below.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ntfy-pg-shared
spec:
  # ntfy's database on the shared cluster. Not the postgres-shared component:
  # ntfy predates it and its Database, DatabaseRole and password Secret are
  # still declared under kubernetes/apps/database/pg-shared/app.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  target:
    name: *secret
  dataFrom:
    - extract:
        key: pg-shared-ntfy
