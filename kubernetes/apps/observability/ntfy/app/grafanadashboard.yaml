---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ntfy
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  # The tag here is overwritten from the HelmRelease image tag by a kustomize
  # replacement, so it must stay the 6th "/"-separated segment.
  url: https://raw.githubusercontent.com/binwiederhier/ntfy/v2.27.0/examples/grafana-dashboard/ntfy-grafana.json
