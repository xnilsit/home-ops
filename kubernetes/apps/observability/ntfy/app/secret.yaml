---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
# The app-side half of ntfy's shared-cluster database, kept here rather than
# taken from kubernetes/components/postgres-shared: that component now also
# creates the Database, DatabaseRole and password Secret through a nested
# Kustomization, and ntfy's three already exist under
# kubernetes/apps/database/pg-shared/app. Adopting the component would hand the
# same object names to a second Flux Kustomization - a prune-and-recreate of a
# live database's CRs, and a fresh role password with it.
apiVersion: v1
kind: Secret
metadata:
  name: ntfy-pg-shared
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: database/pg-shared-ntfy
type: Opaque
