---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
spec:
  chartRef:
    kind: OCIRepository
    name: ntfy
  interval: 1h
  values:
    # Readable source of truth for ntfy's declarative auth, rendered into the
    # comma-separated NTFY_AUTH_* env vars below (they are urfave/cli
    # StringSliceFlags, so comma is the separator ntfy expects).
    #
    # The $(...) references are kubelet env expansion, not Helm and not
    # envsubst: kubelet resolves them from the secretKeyRef atoms declared
    # earlier in the same env list. That is what keeps the shape of the auth
    # config readable in Git while the hashes and token stay in SOPS.
    #
    # Custom top-level key on purpose - app-template's values.schema.json sets
    # no root additionalProperties, and env string values are passed through
    # `tpl ... $rootContext`, so .Values is reachable from the env below.
    ntfyAuth:
      users:
        - "nilsit:$(ADMIN_PASSWORD_HASH):admin"
        - "alertmanager:$(ALERTMANAGER_PASSWORD_HASH):user"
      access:
        # Only role=user may hold ACL entries - ntfy's parseAccess rejects an
        # admin outright ("only regular users can have ACL entries"), and an
        # admin has implicit full access anyway, so `nils` is absent here.
        # write-only: alertmanager publishes and must not be able to read.
        - "alertmanager:alerts:wo"
      tokens:
        - "alertmanager:$(ALERTMANAGER_TOKEN):alertmanager"

    controllers:
      ntfy:
        # Experimental clustering: every pod is a node sharing the Postgres
        # database, and forwards each publish to its peers so subscribers on
        # any pod see it. A StatefulSet only for the stable pod names, which
        # become experimental-cluster-node-id and must survive restarts. No
        # per-pod volume - all state lives in Postgres.
        type: statefulset
        # One per node; ./prometheusrule.yaml reads the expected peer count
        # from the StatefulSet, so it follows this.
        replicas: 3
        strategy: RollingUpdate
        statefulset:
          # Nodes find each other through the database, so there is no start
          # order to keep. Updates still roll one pod at a time.
          podManagementPolicy: Parallel
          serviceName:
            identifier: cluster
        podDisruptionBudget:
          maxUnavailable: 1
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: ntfy
        annotations:
          # app-template checksums its own ConfigMaps, so server.yml edits roll
          # the pod by themselves. Both of these are external Secrets, so without
          # this a rotated token or DSN would leave the old value in the running
          # env - ntfy-pg-shared now carries an ESO-minted Postgres password.
          secret.reloader.stakater.com/reload: ntfy-auth,ntfy-pg-shared,ntfy-cluster
          # Same reasoning for the message template: it is generated by a
          # kustomize configMapGenerator with a stable name, so edits change it
          # in place and nothing would otherwise restart ntfy to pick them up.
          configmap.reloader.stakater.com/reload: ntfy-templates
        containers:
          app:
            image:
              repository: registry.nilsit.de/docker.io/binwiederhier/ntfy
              tag: v2.37.0@sha256:3176f6f3f0a111c7915a102b94976be92d590b6ff9da198c3d48fa9e50f1b2ef
            # The image is ENTRYPOINT ["ntfy"] with no CMD, so the subcommand
            # has to be supplied here or the container exits printing usage.
            args:
              - "serve"
            env:
              # Atoms from the SOPS secret. Declared as their own vars purely so
              # the composed NTFY_AUTH_* values below can reference them.
              ADMIN_PASSWORD_HASH:
                valueFrom:
                  secretKeyRef:
                    name: ntfy-auth
                    key: ADMIN_PASSWORD_HASH
              ALERTMANAGER_PASSWORD_HASH:
                valueFrom:
                  secretKeyRef:
                    name: ntfy-auth
                    key: ALERTMANAGER_PASSWORD_HASH
              ALERTMANAGER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: ntfy-auth
                    key: ALERTMANAGER_TOKEN
              # Postgres replaces every file-backed store: with database-url set,
              # ntfy REFUSES to start if auth-file, cache-file or web-push-file
              # are also configured. That is why this deployment has no PVC.
              # Reflected in from database/pg-shared-ntfy by the
              # postgres-shared component.
              NTFY_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: ntfy-pg-shared
                    key: uri
              # dependsOn drives app-template's topological sort of the env map.
              # It is load-bearing: kubelet only expands $(VAR) against vars
              # already emitted earlier in the list, so without it the hashes
              # could render as empty and ntfy would reject the auth config.
              NTFY_AUTH_USERS:
                dependsOn:
                  - ADMIN_PASSWORD_HASH
                  - ALERTMANAGER_PASSWORD_HASH
                value: '{{ join "," .Values.ntfyAuth.users }}'
              NTFY_AUTH_TOKENS:
                dependsOn:
                  - ALERTMANAGER_TOKEN
                value: '{{ join "," .Values.ntfyAuth.tokens }}'
              # No dependsOn - contains no $(...) references.
              NTFY_AUTH_ACCESS: '{{ join "," .Values.ntfyAuth.access }}'
              # The per-node half of the cluster config; the shared half is in
              # server.yml. The pod name is the node id, and also the pod's
              # record under the headless `cluster` Service, which is how the
              # other nodes reach this one.
              POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              NTFY_EXPERIMENTAL_CLUSTER_NODE_ID:
                dependsOn:
                  - POD_NAME
                value: "$(POD_NAME)"
              NTFY_EXPERIMENTAL_CLUSTER_ADVERTISE_URL:
                dependsOn:
                  - POD_NAME
                value: "http://$(POD_NAME).ntfy-cluster.{{ .Release.Namespace }}.svc.cluster.local:2587"
              NTFY_EXPERIMENTAL_CLUSTER_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ntfy-cluster
                    key: secret
            probes:
              # All three endpoints are served by handleInternal before any auth
              # gate, so they answer even with auth-default-access: deny-all.
              #
              # Not /v1/health: in cluster mode it fails once the node's database
              # heartbeat is 30s stale, and a restart fixes nothing during a
              # Postgres outage - it only drops every subscriber. /v1/config is
              # static and only proves the HTTP server still answers.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/config
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              # What the docs prescribe for the load balancer: fails while the
              # node drains on shutdown, and for an unhealthy node as long as a
              # healthy peer can take its clients.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/ready
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            # 14 days single-node (2026-11): CPU p95 1.5m, worst 5m average 3m;
            # working set peaked at 34Mi. Cluster mode adds a send queue per
            # peer, hence the headroom.
            resources:
              requests:
                cpu: 10m
                memory: 48Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      # No PriorityClass is globalDefault, so ntfy would otherwise run at 0.
      priorityClassName: cluster-platform
      # On SIGTERM a node with a live active peer drains before it exits:
      # experimental-cluster-drain-delay (15s) withdrawing, then
      # experimental-cluster-drain-duration (1m) closing its subscriber
      # connections gradually. The default 30s would SIGKILL it mid-drain and
      # cause exactly the reconnect storm draining exists to avoid.
      terminationGracePeriodSeconds: 120
      securityContext:
        # Pod level only. readOnlyRootFilesystem and capabilities belong on the
        # container - app-template's pod-level securityContext schema sets
        # additionalProperties: false and rejects them, failing `helm template`.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    configMaps:
      config:
        data:
          # Everything here is non-secret on purpose, so the effective server
          # config stays reviewable in a Git diff. The auth material arrives via
          # the NTFY_AUTH_* env vars above.
          #
          # This block is rendered through `tpl`, so it must not contain Go
          # template syntax. ${SECRET_DOMAIN} is a Flux postBuild substitution
          # and resolves before Helm ever sees it.
          server.yml: |
            base-url: https://ntfy.${SECRET_DOMAIN}
            listen-http: ":8080"

            # Private instance: nothing is readable or publishable without
            # credentials. Users, ACLs and tokens are provisioned declaratively
            # through the environment.
            auth-default-access: deny-all
            enable-login: true
            enable-signup: false

            # ntfy takes the RIGHT-MOST entry of this header. Behind Envoy that
            # would be the cloudflared pod IP, collapsing every internet client
            # into one rate-limit bucket, so read Cloudflare's own header
            # instead. Absent or invalid, ntfy falls back to the socket address -
            # which is what makes Alertmanager's in-cluster POST work.
            behind-proxy: true
            proxy-forwarded-header: "Cf-Connecting-Ip"

            # Separate port so /metrics is not reachable through the HTTPRoute,
            # which publishes the 8080 port only. Setting this implicitly
            # enables metrics, so enable-metrics would be redundant.
            metrics-listen-http: ":9090"

            # Overlay for ntfy's embedded message templates. Deliberately NOT a
            # subdirectory of /etc/ntfy: that path is itself a ConfigMap mount,
            # and nesting a second volume inside one is fragile.
            template-dir: /etc/ntfy-templates

            # Clustering (experimental). Nodes register in the shared database
            # and forward publishes to each other on this listener; the node
            # id, advertise URL and shared secret are per-pod or secret, so
            # they come from the environment. The port is only on the headless
            # `cluster` Service and never routed: the listener accepts any
            # message that carries the secret. Wildcard so it binds both IP
            # families, which is also why ntfy demands an explicit advertise URL.
            experimental-cluster-listen: ":2587"
            experimental-cluster-role: active

            # Deliberately absent: auth-file, cache-file and web-push-file are
            # rejected alongside database-url, and attachment-cache-dir would
            # reintroduce a volume for a feature alerting does not use.
    persistence:
      config:
        type: configMap
        # identifier, NOT name: this refers to the configMaps entry above and
        # lets the chart resolve the generated ConfigMap's real name. A hardcoded
        # name that does not match would mount nothing, and ntfy would silently
        # start on defaults with auth wide open.
        identifier: config
        globalMounts:
          - path: /etc/ntfy
            readOnly: true
      # name, NOT identifier: this ConfigMap comes from the kustomization's
      # configMapGenerator, not from the chart, so the chart cannot resolve it.
      # The generator sets disableNameSuffixHash so the name stays stable.
      templates:
        type: configMap
        name: ntfy-templates
        globalMounts:
          - path: /etc/ntfy-templates
            readOnly: true
      # Required by readOnlyRootFilesystem - Go writes temp files here.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        # Pinned, since a second Service would otherwise suffix it to
        # ntfy-app, and Alertmanager's webhook URL names ntfy.observability.
        forceRename: ntfy
        controller: ntfy
        ports:
          http:
            port: *port
            primary: true
          metrics:
            port: 9090
      # Headless, for node-to-node fan-out only: gives each pod the stable DNS
      # name it advertises, and is the StatefulSet's governing Service.
      cluster:
        controller: ntfy
        clusterIP: None
        # A draining node fails /v1/ready but still serves its remaining
        # subscribers, so peers must keep resolving it until it exits.
        publishNotReadyAddresses: true
        ports:
          cluster:
            port: 2587
    serviceMonitor:
      app:
        service:
          identifier: app
        endpoints:
          - port: metrics
    route:
      app:
        # Same endpoint the probes above use: it is served before the auth
        # gate, so it answers under auth-default-access: deny-all.
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /v1/health
        hostnames:
          - "ntfy.${SECRET_DOMAIN}"
        parentRefs:
          # envoy-external, not -internal: the phone app holds a long-lived
          # connection to the server, so notifications away from the LAN only
          # work if it is reachable from the internet. Safe to publish because
          # auth-default-access is deny-all.
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              # http only - the metrics port stays off the public route
              - identifier: app
                port: *port
