---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./secret.sops.yaml
  # Mirrors database/pg-shared-ntfy in as ntfy-pg-shared, whose `uri` key
  # becomes NTFY_DATABASE_URL
  - ./secret.yaml
configMapGenerator:
  # Generated here rather than as an app-template `configMaps` entry because
  # that path runs the data through Helm's `tpl`, which would evaluate the
  # template's own {{ }} expressions.
  - name: ntfy-templates
    files:
      - alertmanager.yml=./alertmanager-template.yml
    options:
      annotations:
        # The file is Go templating, not Flux substitution. No ${...} today, but
        # Go templates conventionally use $ for variables, so keep envsubst out.
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  # The HelmRelease mounts this ConfigMap by name, so the name has to be stable.
  # Consequence: edits change it in place without rolling the pod, which is what
  # the configmap reloader annotation on the controller is for.
  disableNameSuffixHash: true
replacements:
  # Keeps the upstream dashboard on the tag of the running image. Renovate's
  # grafanaDashboards preset only tracks grafana.com URLs, so a hand-pinned
  # raw.githubusercontent tag would silently drift behind the image.
  - source:
      kind: HelmRelease
      name: ntfy
      fieldPath: spec.values.controllers.ntfy.containers.app.image.tag
    targets:
      - select:
          kind: GrafanaDashboard
          name: ntfy
        fieldPaths:
          - spec.url
        options:
          # The tag is the 6th "/"-separated segment of the URL. Positional, so
          # the placeholder tag in grafanadashboard.yaml must stay in that slot.
          delimiter: /
          index: 5
