---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-cluster-secret
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # experimental-cluster-secret, shared by every ntfy node. Minted once and
  # frozen: a regenerated value would split the running pods until they all
  # restarted, since each node only accepts fan-out carrying its own secret.
  name: &secret ${APP}-cluster
spec:
  refreshInterval: "0"
  target:
    name: *secret
    template:
      data:
        secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-cluster-secret
