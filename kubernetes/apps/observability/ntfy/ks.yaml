---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ntfy
  namespace: flux-system
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/observability/ntfy/app
  dependsOn:
    # Owns the ClusterSecretStore the credential is pulled through
    - name: external-secrets-stores-database
      namespace: flux-system
    # The ntfy database and its owner role live on the shared cluster
    - name: pg-shared
      namespace: flux-system
    # A ServiceMonitor is rendered, and on a from-scratch bootstrap the CRD
    # would not exist yet
    - name: prometheus-operator-crds
      namespace: flux-system
    # priorityClassName: cluster-platform
    - name: priority-classes
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 5m
