---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: vm-k8s-stack
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.91.2
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-k8s-stack
  namespace: monitoring
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: vm-k8s-stack
  maxHistory: 2
  install:
    timeout: 15m
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: vm-operator
      namespace: vm-operator
  valuesFrom:
    - kind: ConfigMap
      name: flux-metrics-configmap
      valuesKey: flux-metrics.yaml
  values:
    global:
      image:
        registry: mirror.gcr.io
      cluster:
        # -- K8s cluster domain suffix, uses for building storage pods' FQDN. Details are [here](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/)
        dnsDomain: cluster.local.
    fullnameOverride: vmetrics

    crds:
      enabled: false

    victoria-metrics-operator:
      enabled: false

    defaultDashboards:
      enabled: true
      grafanaOperator:
        enabled: true

    defaultRules:
      enabled: true
      rules:
        KubeHpaMaxedOut:
          enabled: false

    alertmanager:
      enabled: true
      spec:
        disableNamespaceMatcher: true

    vmalert:
      enabled: true
      spec:
        # Without this, the generatorURL vmalert puts in every alert is its own
        # pod hostname, which is unreachable from a phone.
        extraArgs:
          external.url: "https://vmalert.${CLUSTER_DOMAIN}"
        # 10s, not the 300s DefaultTolerationSeconds injects - that default is
        # the bulk of the ~6min before a lost node's pod is rescheduled.
        tolerations: &fastReschedule
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 10
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 10
      route:
        enabled: true
        # The chart's rule carries no matches, so the derived probe is the bare
        # host - a UI that renders regardless. /health also reports non-OK
        # during the pre-shutdown grace period, which the UI does not.
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /health
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "vmalert.${CLUSTER_DOMAIN}"

    grafana:
      enabled: false

    vmsingle:
      enabled: true
      spec:
        extraArgs:
          maxLabelsPerTimeseries: "40"
          search.maxUniqueTimeseries: "600000"
          search.minStalenessInterval: 5m
        replicaCount: 1
        retentionPeriod: "6w"
        # Speeds up eviction only. The RWO ceph-block PVC still has to detach
        # from the dead node first, and k8s 1.36 has no force-detach timeout -
        # that needs the node.kubernetes.io/out-of-service taint or node delete.
        tolerations: *fastReschedule
        # VMSingle has no existingClaim. storageDataPath disables spec.storage
        # outright and leaves the volume to us - which is what lets the kopiur
        # component own the PVC and populate it on bootstrap.
        storageDataPath: /vm-data
        # null, not absent: the chart injects its own default storage block, and
        # the operator refuses "storage and \"data\" volume are not allowed to
        # be set together".
        storage: null
        # `data` is mandatory, not a choice: the operator reserves that name for
        # whatever is mounted at storageDataPath and rejects any other.
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: vmetrics
        volumeMounts:
          - name: data
            mountPath: /vm-data
        useDefaultResources: false
        useStrictSecurity: true
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 2Gi
      route:
        enabled: true
        # The chart's rule carries no matches, so the derived probe is the bare
        # host - a UI that renders regardless. /health also reports non-OK
        # during the pre-shutdown grace period, which the UI does not.
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /health
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "vmsingle.${CLUSTER_DOMAIN}"

    vmagent:
      enabled: true
      spec:
        resources:
          limits:
            memory: 1Gi
            cpu: 1
          requests:
            cpu: 150m
        selectAllByDefault: true
        scrapeInterval: 20s

    defaultDatasources:
      grafanaOperator:
        # -- Create datasources as CRDs (requires grafana-operator to be installed)
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana
          allowCrossNamespaceImport: true

    prometheus-node-exporter:
      enabled: true

    kube-state-metrics:
      enabled: true

    kubelet:
      enabled: true

    kubeApiServer:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              # kube-srv-02 serves ~18MB of /metrics, over vmagent's 16MB default
              max_scrape_size: 64MB
              # ~2/3 of the payload, and no rule or dashboard reads them
              metricRelabelConfigs:
                - action: drop
                  sourceLabels:
                    - "__name__"
                  regex: (apiserver_request_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_events_sizes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_admission_controller_admission_duration_seconds|etcd_request_duration_seconds)_bucket

    kubeControllerManager:
      enabled: true
      service:
        selector:
          component: kube-apiserver # Selects controller node IPs
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeEtcd:
      enabled: true
      service:
        selector:
          component: kube-apiserver # Selects controller node IPs
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - scheme: http

    kubeScheduler:
      enabled: true
      service:
        selector:
          component: kube-apiserver # Selects controller node IPs
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeProxy:
      enabled: false

    coreDns:
      enabled: true

    extraRules:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: Kubernetes cluster Dockerhub rate limit risk
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
                  # zfs-rules:
                  #   groups:
                  #     - name: zfs
                  #       rules:
                  #         - alert: ZfsUnexpectedPoolState
                  #           annotations:
                  #             summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                  #           expr: node_zfs_zpool_state{state!="online"} > 0
                  #           labels:
                  #             severity: critical
