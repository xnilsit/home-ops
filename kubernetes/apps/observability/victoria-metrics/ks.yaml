---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vm-k8s-stack
  namespace: flux-system
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/observability/victoria-metrics/vm-k8s-stack
  dependsOn:
    - name: vm-operator
      namespace: flux-system
  postBuild:
    substitute:
      # The vmsingle TSDB volume, not the whole stack - fullnameOverride: vmetrics
      APP: vmetrics
      KOPIUR_CAPACITY: 50Gi
      # useStrictSecurity runs vmsingle as nobody
      KOPIUR_PUID: "65534"
      KOPIUR_PGID: "65534"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  timeout: 5m
