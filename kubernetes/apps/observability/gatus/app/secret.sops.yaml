# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
# The credential the endpoint probes authenticate with: base64 of
# "<service-account-username>:<app-password>", the only client_credentials form
# authentik accepts from a client that can send nothing but a client id and a
# secret. gatus reads it as $GATUS_PROBE_CLIENT_SECRET and pastes it into the
# oauth2 block each protected route's annotation carries.
#
# SOPS rather than tofu-controller, deliberately: authentik forces a token
# created through its API onto the CALLING user unless that caller is a
# superuser, and refuses any later change of owner, so terraform cannot mint one
# for the home-ops-gatus-probe service account. It was created once with
# POST /core/users/service_account/ (expiring: false), which writes the token
# straight through the ORM. Rotating it means repeating that call.
