---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gatus
  namespace: flux-system
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/observability/gatus/app
  dependsOn:
    # Two credentials come from there by reflector: gatus-oidc guards the
    # dashboard, gatus-probe is what the endpoint probes authenticate with
    - name: authentik-oidc
      namespace: flux-system
    # The chart renders an HTTPRoute, and the component a SecurityPolicy
    - name: envoy-gateway
      namespace: flux-system
    # A ServiceMonitor is rendered, and on a from-scratch bootstrap the CRD
    # would not exist yet
    - name: prometheus-operator-crds
      namespace: flux-system
    # priorityClassName: cluster-platform
    - name: priority-classes
      namespace: flux-system
  postBuild:
    # substituteFrom is NOT set here: cluster-apps patches cluster-settings and
    # cluster-secrets onto every child Kustomization, and being a list it is
    # replaced wholesale rather than merged.
    substitute:
      APP: *app
      # Required by components/postgres-shared, whose nested Kustomization runs
      # in the database namespace and has no other way to learn where the
      # credential may be mirrored to.
      APP_NAMESPACE: observability
      OIDC_HOST: gatus.${SECRET_DOMAIN}
      # The chart names the route after fullnameOverride, which is set to the
      # release name in values
      OIDC_ROUTE: *app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: observability
    - apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      name: gatus-oidc
      namespace: observability
  healthCheckExprs:
    # SecurityPolicy reports Gateway API PolicyStatus - status.ancestors[], one
    # entry per attached parent - not the flat status.conditions kstatus reads.
    # With no ancestors yet neither expr matches, which is the InProgress that
    # lets Flux retry while reflector is still filling in the Secret.
    - apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      failed: status.ancestors.exists(a, a.conditions.exists(c, c.type == 'Accepted' && c.status == 'False'))
      current: status.ancestors.exists(a, a.conditions.exists(c, c.type == 'Accepted' && c.status == 'True'))
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: false, since wait: true would ignore the healthCheckExprs above.
  wait: false
  interval: 1h
  timeout: 5m
