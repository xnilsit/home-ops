---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dvinyl
  namespace: flux-system
spec:
  targetNamespace: dvinyl
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/dvinyl/dvinyl/app
  dependsOn:
    # Writes the dvinyl-oidc Secret the ExternalSecret reads
    - name: authentik-oidc
      namespace: flux-system
    # The OIDC credential comes through the tofu-controller store
    - name: external-secrets-stores
      namespace: flux-system
    # Data (SQLite) and uploads PVC is provisioned through kopiur's Restore populator
    - name: kopiur-repository
      namespace: flux-system
    # ceph-block for the data PVC
    - name: rook-ceph-cluster
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
      # Hourly: the volume holds the SQLite database, not just uploads.
      KOPIUR_CRON: "H * * * *"
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: dvinyl
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 30m
