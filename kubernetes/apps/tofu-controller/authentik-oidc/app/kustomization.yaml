---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # ServiceAccount and token before the Terraform that runs under them.
  - ./rbac.yaml
  - ./secret.sops.yaml
  # Provider cache the runner mounts; claimed before the Terraform that uses it.
  - ./pvc.yaml
  - ./terraform.yaml
