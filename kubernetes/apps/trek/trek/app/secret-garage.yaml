---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: garage-${APP}
  annotations:
    # The mirror replica's credentials have to exist in this namespace: the
    # storage seed reads them out of env at first boot.
    reflector.v1.k8s.emberstack.com/reflects: garage/garage-${APP}
type: Opaque
