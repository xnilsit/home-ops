---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-oidc
spec:
  # TREK speaks OIDC itself, so this is read into env rather than into a gateway
  # SecurityPolicy - components/oidc would 302 its API calls to a login page.
  secretStoreRef:
    kind: ClusterSecretStore
    name: tofu-controller
  refreshInterval: 1h
  target:
    name: *secret
  data:
    - secretKey: client-id
      remoteRef:
        # Written by the tofu module into tofu-controller.
        key: ${APP}-oidc
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: ${APP}-oidc
        property: client-secret
