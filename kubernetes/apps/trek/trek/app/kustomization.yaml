---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # Provisions the data PVC (named ${APP}) and snapshots it to the NAS.
  - ../../../../components/kopiur/backup
resources:
  # Both credential sources for the storage seed, plus the bucket it claims.
  - ./objectbucketclaim.yaml
  - ./secret-garage.yaml
  - ./secret.sops.yaml
  - ./externalsecret-oidc.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
