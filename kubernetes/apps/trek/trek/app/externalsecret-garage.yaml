# Pulled rather than reflected: reflector acts on events only and gives up on a
# mirror whose source did not exist yet, logging once and never retrying. ESO
# re-reads on the interval below.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret garage-${APP}
spec:
  # The mirror replica's credentials have to exist in this namespace: the
  # storage seed reads them out of env at first boot.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: garage
  target:
    name: *secret
  dataFrom:
    - extract:
        key: garage-${APP}
