---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/objectbucket.io/objectbucketclaim_v1alpha1.json
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: ${APP}
spec:
  # generateBucketName, not bucketName: this claim creates the bucket, and the
  # generated name reaches the app through the ConfigMap Rook writes alongside
  # the credentials Secret - both named after this claim.
  generateBucketName: ${APP}
  # Retain: a deleted claim costs a manual cleanup, not every uploaded file.
  storageClassName: ceph-bucket-retain
