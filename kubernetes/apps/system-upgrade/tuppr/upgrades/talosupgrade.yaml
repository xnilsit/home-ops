---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.3
  policy:
    rebootMode: powercycle
  # MicroOS nodes update themselves and are rebooted by kured
  nodeSelector:
    matchExpressions:
      - key: home-ops/os
        operator: NotIn
        values:
          - "microos"
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health in ['HEALTH_OK']
