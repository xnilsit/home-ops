---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ipv6-prefix-tracker
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/clusterrole-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ipv6-prefix-tracker
rules:
  # Pools are cluster-scoped. resourceNames only binds because there is no
  # list/watch here, so every fetch must be by name.
  - apiGroups:
      - "cilium.io"
    resources:
      - "ciliumloadbalancerippools"
    resourceNames:
      - "envoy-external-direct-gua"
    verbs:
      - "get"
      - "patch"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/clusterrolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ipv6-prefix-tracker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ipv6-prefix-tracker
subjects:
  # Explicit: flux targetNamespace does not reach into subjects.
  - kind: ServiceAccount
    name: ipv6-prefix-tracker
    namespace: network
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/role-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ipv6-prefix-tracker
rules:
  # Read back what cilium actually assigned, never what the loop derived.
  - apiGroups:
      - ""
    resources:
      - "services"
    resourceNames:
      - "envoy-external-direct-gua"
    verbs:
      - "get"
  # No create: both objects are git-owned.
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    resourceNames:
      - "envoy-external-direct-gua"
    verbs:
      - "get"
      - "patch"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ipv6-prefix-tracker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ipv6-prefix-tracker
subjects:
  - kind: ServiceAccount
    name: ipv6-prefix-tracker
    namespace: network
