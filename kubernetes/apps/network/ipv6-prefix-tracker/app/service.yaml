---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/service-v1.json
apiVersion: v1
kind: Service
metadata:
  name: envoy-external-direct-gua
spec:
  type: LoadBalancer
  # The gateway's own service keeps the ULA; one address per family per service.
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - "IPv6"
  # Cilium's L2 leader election ignores endpoints, so Local blackholes any node
  # without an envoy pod.
  externalTrafficPolicy: Cluster
  allocateLoadBalancerNodePorts: false
  # These five labels must never appear in metadata.labels: envoy-gateway runs
  # DeleteAllExcept over every service matching them and keeps only its own.
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gateway-name: envoy-external-direct
    gateway.envoyproxy.io/owning-gateway-namespace: network
  ports:
    # Carries only the https-redirect route, same as the v4 forward.
    - name: http-80
      port: 80
      protocol: TCP
      targetPort: 10080
    - name: https-443
      port: 443
      protocol: TCP
      targetPort: 10443
    # ClientTrafficPolicy enables http3, advertised on the same port.
    - name: https-443-h3
      port: 443
      protocol: UDP
      targetPort: 10443
