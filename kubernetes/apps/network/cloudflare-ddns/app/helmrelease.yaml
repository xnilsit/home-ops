---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-ddns
spec:
  chartRef:
    kind: OCIRepository
    name: cloudflare-ddns
  interval: 1h
  values:
    controllers:
      cloudflare-ddns:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/favonia/cloudflare-ddns
              tag: 1.17.0
            env:
              # The A record every route on envoy-external-direct CNAMEs to.
              DOMAINS: home.${SECRET_DOMAIN}
              # Proxying this would put the Cloudflare edge - and its 100 MB
              # request body cap - back in front of the direct gateway.
              PROXIED: "false"
              # The forward is IPv4 NAT, so a published AAAA would be a black
              # hole for clients that prefer it.
              IP6_PROVIDER: none
              # Short enough that a WAN IP change is picked up within a check
              # interval rather than an hour later.
              TTL: "60"
              CLOUDFLARE_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    # Owned by cloudflare-dns; the token needs the same Zone:DNS
                    # Edit scope, so it is reused rather than duplicated.
                    name: cloudflare-dns-secret
                    key: api-token
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    defaultPodOptions:
      # Public DNS for the direct gateway stops tracking the WAN IP without it.
      priorityClassName: cluster-infra
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
