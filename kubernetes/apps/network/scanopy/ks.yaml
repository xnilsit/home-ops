---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app scanopy
  namespace: flux-system
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/network/scanopy/app
  dependsOn:
    # Owns the NetworkAttachmentDefinition CRD the daemon's LAN attachment is
    - name: multus
      namespace: flux-system
    # Owns the ClusterSecretStore the database credential is pulled through
    - name: external-secrets-stores-database
      namespace: flux-system
    # Owns the ClusterSecretStore the OIDC credential is pulled through
    - name: external-secrets-stores
      namespace: flux-system
    # Writes the scanopy-oidc Secret the ExternalSecret reads
    - name: authentik-oidc
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
    # ceph-block for the daemon config PVC
    - name: rook-ceph-cluster
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: network
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
