---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app scanopy
  namespace: flux-system
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/network/scanopy/app
  dependsOn:
    - name: external-secrets-stores-database
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      # Drops the database; delete this Kustomization once it is gone, which drops the role
      PG_ENSURE: absent
      PG_ROLE_RECLAIM: delete
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
