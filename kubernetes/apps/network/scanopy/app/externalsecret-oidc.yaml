---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-oidc
spec:
  # Scanopy speaks OIDC itself, so this is read into env rather than into a
  # gateway SecurityPolicy.
  secretStoreRef:
    kind: ClusterSecretStore
    name: tofu-controller
  refreshInterval: 1h
  target:
    name: *secret
    template:
      data:
        # SCANOPY_OIDC_PROVIDERS is an inline TOML array, not JSON, and carries
        # the client secret - so it is rendered here rather than in the
        # HelmRelease. `index` because the source keys are hyphenated.
        SCANOPY_OIDC_PROVIDERS: |-
          [{name="authentik",slug="authentik",issuer_url="${AUTHENTIK_URL}/application/o/home-ops-${APP}/",client_id="{{ index . "client-id" }}",client_secret="{{ index . "client-secret" }}"}]
  data:
    - secretKey: client-id
      remoteRef:
        # Written by the tofu module into tofu-controller.
        key: ${APP}-oidc
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: ${APP}-oidc
        property: client-secret
