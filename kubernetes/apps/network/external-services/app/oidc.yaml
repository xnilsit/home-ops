---
# OIDC for the LAN services in ./httproutes.yaml. The components/oidc component
# takes one ${APP} per Kustomization, so these seven are written out instead.
#
# Credentials come from tofu/authentik/locals.tf, pulled out of tofu-controller
# by the ExternalSecrets below; the provider and application are named
# home-ops-<app>. The Secret objects stay declared so the credential is never
# momentarily absent - Envoy Gateway drops a SecurityPolicy whose clientSecret
# it cannot resolve, and these seven are public.
apiVersion: v1
kind: List
items:
  # ── credential objects, filled by the ExternalSecrets below ─────────────────
  - <<: &secret {apiVersion: v1, kind: Secret, type: Opaque}
    metadata: {name: code-oidc}
  - <<: *secret
    metadata: {name: duplicacy-oidc}
  - <<: *secret
    metadata: {name: oni-oidc}
  - <<: *secret
    metadata: {name: openspeedtest-oidc}
  - <<: *secret
    metadata: {name: scrutiny-oidc}
  - <<: *secret
    metadata: {name: unbalanced-oidc}
  - <<: *secret
    metadata: {name: unraid-oidc}

  # ── pulled credentials ──────────────────────────────────────────────────────
  - <<: &es {apiVersion: external-secrets.io/v1, kind: ExternalSecret}
    metadata: {name: code-oidc}
    spec:
      <<: &esspec
        refreshInterval: 1h
        secretStoreRef: {kind: ClusterSecretStore, name: tofu-controller}
      target: {name: code-oidc, creationPolicy: Merge}
      dataFrom:
        - {extract: {key: code-oidc}}
  - <<: *es
    metadata: {name: duplicacy-oidc}
    spec:
      <<: *esspec
      target: {name: duplicacy-oidc, creationPolicy: Merge}
      dataFrom:
        - {extract: {key: duplicacy-oidc}}
  - <<: *es
    metadata: {name: oni-oidc}
    spec:
      <<: *esspec
      target: {name: oni-oidc, creationPolicy: Merge}
      dataFrom:
        - {extract: {key: oni-oidc}}
  - <<: *es
    metadata: {name: openspeedtest-oidc}
    spec:
      <<: *esspec
      target: {name: openspeedtest-oidc, creationPolicy: Merge}
      dataFrom:
        - {extract: {key: openspeedtest-oidc}}
  - <<: *es
    metadata: {name: scrutiny-oidc}
    spec:
      <<: *esspec
      target: {name: scrutiny-oidc, creationPolicy: Merge}
      dataFrom:
        - {extract: {key: scrutiny-oidc}}
  - <<: *es
    metadata: {name: unbalanced-oidc}
    spec:
      <<: *esspec
      target: {name: unbalanced-oidc, creationPolicy: Merge}
      dataFrom:
        - {extract: {key: unbalanced-oidc}}
  - <<: *es
    metadata: {name: unraid-oidc}
    spec:
      <<: *esspec
      target: {name: unraid-oidc, creationPolicy: Merge}
      dataFrom:
        - {extract: {key: unraid-oidc}}

  # ── policies ────────────────────────────────────────────────────────────────
  # cookieDomain stays unset so each cookie is scoped to its own host.
  - <<: &policy {apiVersion: gateway.envoyproxy.io/v1alpha1, kind: SecurityPolicy}
    metadata: {name: code-oidc}
    spec:
      oidc:
        # openid is added by Envoy Gateway; offline_access is what makes
        # refreshToken issue an actually usable refresh token.
        <<: &oidc
          scopes:
            - offline_access
            - email
            - profile
          refreshToken: true
          logoutPath: /oauth2/logout
          # Lets a request carrying `Authorization: Bearer ...` skip the oauth2
          # filter and be checked by the jwt block instead - see
          # kubernetes/components/oidc/securitypolicy.yaml for the full reasoning.
          # Without it an uptime probe follows the 302 and reports authentik's
          # login page as the app being healthy.
          passThroughAuthHeader: true
        clientIDRef: {kind: Secret, name: code-oidc}
        clientSecret: {name: code-oidc}
        redirectURL: https://code.${SECRET_DOMAIN}/oauth2/callback
        provider:
          # Pinned, so the envoy-gateway controller needs no egress to authentik.
          <<: &endpoints
            authorizationEndpoint: ${AUTHENTIK_URL}/application/o/authorize/
            tokenEndpoint: ${AUTHENTIK_URL}/application/o/token/
          issuer: ${AUTHENTIK_URL}/application/o/home-ops-code/
          endSessionEndpoint: ${AUTHENTIK_URL}/application/o/home-ops-code/end-session/
      # Identical on all seven: the trusted issuer is the gatus probe's provider,
      # not each app's own, so one credential covers every protected route.
      jwt: &jwt
        # REQUIRED. The jwt filter runs after oauth2, so a browser that just
        # finished the OIDC flow arrives with no bearer token and would get
        # "401 Jwt is missing". An invalid token still 401s.
        optional: true
        providers:
          - name: gatus-probe
            issuer: ${AUTHENTIK_URL}/application/o/home-ops-gatus-probe/
            audiences:
              - home-ops-gatus-probe
            # Data plane, not controller - envoy already reaches authentik here.
            remoteJWKS: {uri: "${AUTHENTIK_URL}/application/o/home-ops-gatus-probe/jwks/"}
      targetRefs:
        - {<<: &target {group: gateway.networking.k8s.io, kind: HTTPRoute}, name: code}
  - <<: *policy
    metadata: {name: duplicacy-oidc}
    spec:
      oidc:
        <<: *oidc
        clientIDRef: {kind: Secret, name: duplicacy-oidc}
        clientSecret: {name: duplicacy-oidc}
        redirectURL: https://backup.${SECRET_DOMAIN}/oauth2/callback
        provider:
          <<: *endpoints
          issuer: ${AUTHENTIK_URL}/application/o/home-ops-duplicacy/
          endSessionEndpoint: ${AUTHENTIK_URL}/application/o/home-ops-duplicacy/end-session/
      jwt: *jwt
      targetRefs:
        - {<<: *target, name: duplicacy}
  - <<: *policy
    metadata: {name: oni-oidc}
    spec:
      oidc:
        <<: *oidc
        clientIDRef: {kind: Secret, name: oni-oidc}
        clientSecret: {name: oni-oidc}
        redirectURL: https://oni.${SECRET_DOMAIN}/oauth2/callback
        provider:
          <<: *endpoints
          issuer: ${AUTHENTIK_URL}/application/o/home-ops-oni/
          endSessionEndpoint: ${AUTHENTIK_URL}/application/o/home-ops-oni/end-session/
      jwt: *jwt
      targetRefs:
        - {<<: *target, name: oni}
  - <<: *policy
    metadata: {name: openspeedtest-oidc}
    spec:
      oidc:
        <<: *oidc
        clientIDRef: {kind: Secret, name: openspeedtest-oidc}
        clientSecret: {name: openspeedtest-oidc}
        redirectURL: https://ost.${SECRET_DOMAIN}/oauth2/callback
        provider:
          <<: *endpoints
          issuer: ${AUTHENTIK_URL}/application/o/home-ops-openspeedtest/
          endSessionEndpoint: ${AUTHENTIK_URL}/application/o/home-ops-openspeedtest/end-session/
      jwt: *jwt
      targetRefs:
        - {<<: *target, name: openspeedtest}
  - <<: *policy
    metadata: {name: scrutiny-oidc}
    spec:
      oidc:
        <<: *oidc
        clientIDRef: {kind: Secret, name: scrutiny-oidc}
        clientSecret: {name: scrutiny-oidc}
        redirectURL: https://scrutiny.${SECRET_DOMAIN}/oauth2/callback
        provider:
          <<: *endpoints
          issuer: ${AUTHENTIK_URL}/application/o/home-ops-scrutiny/
          endSessionEndpoint: ${AUTHENTIK_URL}/application/o/home-ops-scrutiny/end-session/
      jwt: *jwt
      targetRefs:
        - {<<: *target, name: scrutiny}
  - <<: *policy
    metadata: {name: unbalanced-oidc}
    spec:
      oidc:
        <<: *oidc
        clientIDRef: {kind: Secret, name: unbalanced-oidc}
        clientSecret: {name: unbalanced-oidc}
        redirectURL: https://unbalanced.${SECRET_DOMAIN}/oauth2/callback
        provider:
          <<: *endpoints
          issuer: ${AUTHENTIK_URL}/application/o/home-ops-unbalanced/
          endSessionEndpoint: ${AUTHENTIK_URL}/application/o/home-ops-unbalanced/end-session/
      jwt: *jwt
      targetRefs:
        - {<<: *target, name: unbalanced}
  - <<: *policy
    metadata: {name: unraid-oidc}
    spec:
      oidc:
        <<: *oidc
        clientIDRef: {kind: Secret, name: unraid-oidc}
        clientSecret: {name: unraid-oidc}
        redirectURL: https://unraid.${SECRET_DOMAIN}/oauth2/callback
        provider:
          <<: *endpoints
          issuer: ${AUTHENTIK_URL}/application/o/home-ops-unraid/
          endSessionEndpoint: ${AUTHENTIK_URL}/application/o/home-ops-unraid/end-session/
      jwt: *jwt
      targetRefs:
        - {<<: *target, name: unraid}
