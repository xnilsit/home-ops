---
# Ported from traefik-config/ingress.
apiVersion: v1
kind: List
items:
  # ── envoy-external — these ran without forward-auth under traefik too ───────
  - <<: &route {apiVersion: gateway.networking.k8s.io/v1, kind: HTTPRoute}
    metadata:
      name: beszel
      annotations:
        # PocketBase's public health endpoint; / is the SPA shell.
        gatus.home-operations.com/endpoint: |
          path: /api/health
    spec:
      hostnames:
        - "${SECRET_DOMAIN}"
        - "www.${SECRET_DOMAIN}"
      parentRefs: &external
        - {name: envoy-external, namespace: network, sectionName: https}
      rules:
        - {matches: &root [{path: {type: PathPrefix, value: /}}], backendRefs: [{<<: &ref {group: gateway.envoyproxy.io, kind: Backend}, name: beszel}]}
  - <<: *route
    metadata:
      name: containernursery
      annotations:
        # ContainerNursery stops idle containers and starts them on request, so
        # a probe every minute would pin draw's container awake forever and
        # defeat the entire tool.
        gatus.home-operations.com/enabled: "false"
    spec:
      hostnames:
        - "draw.${SECRET_DOMAIN}"
        - "bin.${SECRET_DOMAIN}"
        - "url.${SECRET_DOMAIN}"
        - "searx.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: containernursery}]}
  - <<: *route
    metadata: {name: guacamole}
    spec:
      hostnames:
        - "remote.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: guacamole}]}
  - <<: *route
    metadata: {name: home-assistant}
    spec:
      hostnames:
        - "ha.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: home-assistant}]}
  - <<: *route
    metadata: {name: pbs}
    spec:
      hostnames:
        - "pbs.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: pbs}]}
  - <<: *route
    metadata: {name: pve}
    spec:
      hostnames:
        - "pve.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: pve}]}
  - <<: *route
    metadata:
      name: paperless
      annotations:
        # / 302s here for an anonymous client anyway. The DRF API under /api/
        # would 403, so it is not an option.
        gatus.home-operations.com/endpoint: |
          path: /accounts/login/
    spec:
      hostnames:
        - "paperless.${SECRET_DOMAIN_ALT}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: paperless}]}
  - <<: *route
    metadata:
      name: solar
      annotations:
        # The derived path would be the Exact / rule below, a 301 pinned to one
        # public-dashboard UID - re-sharing that dashboard would read as an
        # outage. Grafana's own health endpoint needs no auth.
        gatus.home-operations.com/endpoint: |
          path: /api/health
    spec:
      hostnames:
        - "solar.${SECRET_DOMAIN_ALT}"
      parentRefs: *external
      rules:
        # Replaces the solar-to-dashboard redirectRegex middleware. Exact
        # matches outrank prefix ones, so only the bare host is redirected. The
        # query rides along in replaceFullPath — Gateway API has no field for
        # redirect query params and Envoy's path_redirect takes it verbatim.
        - name: dashboard-redirect
          matches:
            - {path: {type: Exact, value: /}}
          filters:
            - type: RequestRedirect
              requestRedirect:
                statusCode: 301
                path: {type: ReplaceFullPath, replaceFullPath: "/stats/public-dashboards/7549ee6cafba41f8930ffa88c541e7cd?orgId=1&refresh=30s"}
        - {name: proxy, matches: *root, backendRefs: [{<<: *ref, name: solar}],}

  # ── envoy-external, behind OIDC — what sat behind traefik-forward-auth ──────
  # Each carries a SecurityPolicy in ./oidc.yaml. These were LAN-only on
  # envoy-internal until an auth provider existed.
  - <<: *route
    metadata:
      name: code
      annotations: &probeAuth
        # Probes authenticate rather than follow the SecurityPolicy's 302: gatus
        # follows redirects, so an unauthenticated check would land on
        # authentik's login page and call the app healthy. It buys a short-lived
        # JWT with the gatus-probe service account, and passThroughAuthHeader in
        # ./oidc.yaml lets that JWT past the oauth2 filter.
        gatus.home-operations.com/endpoint: |
          client:
            oauth2:
              token-url: ${AUTHENTIK_URL}/application/o/token/
              client-id: home-ops-gatus-probe
              # $$ keeps Flux's envsubst off it - gatus does the expansion
              # itself, from its own environment, when it parses the config.
              client-secret: $${GATUS_PROBE_CLIENT_SECRET}
              scopes: ["openid", "profile"]
    spec:
      hostnames:
        - "code.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: code}]}
  - <<: *route
    metadata:
      name: duplicacy
      annotations: *probeAuth
    spec:
      hostnames:
        - "backup.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: duplicacy}]}
  - <<: *route
    metadata:
      name: oni
      annotations: *probeAuth
    spec:
      hostnames:
        - "oni.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: oni}]}
  - <<: *route
    metadata:
      name: openspeedtest
      # traefik ran ost without the circuitbreaker middleware — sustained
      # multi-second transfers trip latency-based ejection. Keep it exempt.
      labels: {external-services.home-ops/no-circuit-breaker: "true"}
      annotations: *probeAuth
    spec:
      hostnames:
        - "ost.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: openspeedtest}]}
  - <<: *route
    metadata:
      name: scrutiny
      annotations:
        # / 302s to an absolute LAN URL, taking the probe off the gateway path.
        gatus.home-operations.com/endpoint: |
          path: /api/health
          client:
            oauth2:
              token-url: ${AUTHENTIK_URL}/application/o/token/
              client-id: home-ops-gatus-probe
              client-secret: $${GATUS_PROBE_CLIENT_SECRET}
              scopes: ["openid", "profile"]
    spec:
      hostnames:
        - "scrutiny.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: scrutiny}]}
  - <<: *route
    metadata:
      name: unbalanced
      annotations: *probeAuth
    spec:
      hostnames:
        - "unbalanced.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: unbalanced}]}
  - <<: *route
    metadata:
      name: unraid
      annotations:
        # / 302s to /Main, which is itself a redirect for an unauthenticated client.
        gatus.home-operations.com/endpoint: |
          path: /login
          client:
            oauth2:
              token-url: ${AUTHENTIK_URL}/application/o/token/
              client-id: home-ops-gatus-probe
              client-secret: $${GATUS_PROBE_CLIENT_SECRET}
              scopes: ["openid", "profile"]
    spec:
      hostnames:
        - "unraid.${SECRET_DOMAIN}"
      parentRefs: *external
      rules:
        - {matches: *root, backendRefs: [{<<: *ref, name: unraid}]}
