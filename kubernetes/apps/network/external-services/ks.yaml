---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-services
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
      namespace: flux-system
    # Creates the authentik objects and the credential Secrets ./app/oidc.yaml
    # reflects; without it every SecurityPolicy here is rejected
    - name: authentik-oidc
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/network/external-services/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: false
