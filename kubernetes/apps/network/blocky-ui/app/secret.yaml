---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: blocky-ui-timescale-ro
  annotations:
    # Read-only role: blocky-ui never writes. drizzle-kit is a devDependency and
    # is absent from the runtime image, there is no migrate() call, and its SQL
    # layer is select-only - the index() declarations in its schema file are
    # query-building metadata that nothing applies.
    reflector.v1.k8s.emberstack.com/reflects: database/timescale-blocky-ro
type: Opaque
