# Pulled out of another namespace through a ClusterSecretStore. ESO re-reads on
# the interval below, so an ordering surprise costs a refresh rather than a
# stuck deploy.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret blocky-timescale-auth
spec:
  # The owner credentials CNPG generates for the timescale cluster. blocky's
  # config is a plain ConfigMap, so these are mounted as a file rather than
  # templated in.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  target:
    name: *secret
  dataFrom:
    - extract:
        key: timescale-app
