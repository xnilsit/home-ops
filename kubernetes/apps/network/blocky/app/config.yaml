---
# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/v0.34.0/docs/config.schema.json
upstreams:
  init:
    strategy: failOnError
  strategy: strict
  timeout: 5s
  groups:
    default:
      - tcp+udp:k8s-gateway.network.svc.cluster.local
bootstrapDns:
  - tcp+udp:10.43.0.10
conditional:
  fallbackUpstream: false
  mapping:
    localdomain: 192.168.0.1
    .: 192.168.0.1
customDNS:
  mapping:
    # Above the conditional mapping in the chain, so this wins. Points the hood's
    # NTP endpoint at the stratum-2 gateway and finally answers the AAAA it asks
    # for 40x/s. Revert this line if its clock stops - BSH serve NTS off a private
    # CA, and no host of ours can present that chain.
    global.time.appliances.home-connect.com: 192.168.0.1,fd2e:9a41:6b8c:1::1
blocking:
  denylists:
    ads:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro.txt
    tif:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.txt
    misc:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/gambling.txt
  clientGroupsBlock:
    default:
      - ads
      - tif
      - misc
  blockType: zeroIp
  blockTTL: 1m
  loading:
    refreshPeriod: 24h
    strategy: fast
    downloads:
      timeout: 60s
      attempts: 5
      cooldown: 10s
caching:
  minTime: 5m
  maxTime: 30m
  prefetching: true
  prefetchExpires: 2h
  prefetchThreshold: 10
  prefetchMaxItemsCount: 0
  cacheTimeNegative: 1m
rateLimit:
  enable: true
  # Per pod, so a client spread over the 3 replicas gets 30/s; the busiest real
  # one peaks at ~8/s over a minute, and the hood pins to a single pod.
  rate: 10
  burst: 300
  # /128, not the default /64, which would bucket the whole LAN prefix as one client
  ipv6Prefix: 128
redis:
  address: dragonfly.database.svc.cluster.local:6379
  password: file:/run/secrets/dragonfly/password
  database: 0
  required: false
  connectionAttempts: 10
  connectionCooldown: 3s
clientLookup:
  upstream: tcp+udp:192.168.0.1
  # clients:
  #   my-device: ["192.168.1.40"]
prometheus:
  enable: true
  path: /metrics
statistics:
  enable: true
queryLog:
  type: timescale
  target: file:/run/secrets/timescale/uri
  # MUST stay > 0: with type timescale there is no guard on 0, and blocky would
  # install add_retention_policy(drop_after => INTERVAL '0 days')
  logRetentionDays: 90
  flushInterval: 30s
  creationAttempts: 5
  creationCooldown: 5s
  fields:
    - clientIP
    - clientName
    - responseReason
    - responseAnswer
    - question
    - duration
  ignore:
    sudn: true
    domains:
      - "*.in-addr.arpa"
      - "*.ip6.arpa"
      # The Neff hood polls this ~40x/s over v4 and v6 and was 98% of the query log
      - global.time.appliances.home-connect.com
ports:
  dns: 53
  tls: 853
  http: 4000
  # tls only: 853 is reachable solely through envoy-internal, which sends the
  # PROXY header. Listing dns here would break every plain resolver on the LAN.
  proxyProtocol:
    - tls
certFile: /run/secrets/tls/tls.crt
keyFile: /run/secrets/tls/tls.key
log:
  level: info
  format: text
