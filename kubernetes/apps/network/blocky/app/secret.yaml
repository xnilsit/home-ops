---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: blocky-timescale-auth
  annotations:
    # Mirrors the secret CNPG generates from bootstrap.initdb, which carries a
    # ready-made `uri` DSN for the blocky database as its owner. The Cluster's
    # inheritedMetadata puts reflection-allowed on it, so no hand-authored SOPS
    # copy of the password is needed anywhere.
    #
    # blocky needs the OWNER role, not blocky_ro - the query log inserts.
    reflector.v1.k8s.emberstack.com/reflects: database/timescale-app
type: Opaque
