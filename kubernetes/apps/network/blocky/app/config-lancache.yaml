# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/v0.34.0/docs/config.schema.json
# Merged into config.yaml by blocky itself: BLOCKY_CONFIG_FILE points at the
# folder both files are mounted in, and blocky deep-merges conditional.mapping.
#
# Exact hostnames from uklans/cache-domains, never rolled up to registrable
# domains - the list holds amupdatedl.microsoft.com and blzddist1-a.akamaihd.net,
# and mapping microsoft.com or akamaihd.net wholesale would divert the internet
# into the cache. Regenerate in the same PR as a lancache-dns digest bump, or
# blocky forwards names lancache-dns is not authoritative for and they loop:
#
#   git clone --depth 1 https://github.com/uklans/cache-domains.git && cd cache-domains
#   cat $(jq -r '.cache_domains[].domain_files[]' cache_domains.json | sort -u) \
#     | sed 's/#.*//' | tr -d ' \r' | grep -v '^$' | sed 's/^\*\.//' | sort -u \
#     | awk '{print "    " $0 ": 192.168.1.60"}'
