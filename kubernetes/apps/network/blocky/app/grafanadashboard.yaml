---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: blocky
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
    - datasourceName: https://blocky.${SECRET_DOMAIN}
      inputName: VAR_BLOCKY_URL
  # Vendored copy of grafana.com dashboard 13768 rev 8, with the job/instance
  # variables pinned to allValue ".*" so pod-IP churn stops truncating history.
  configMapRef:
    name: blocky-dashboard
    key: dashboard.json
