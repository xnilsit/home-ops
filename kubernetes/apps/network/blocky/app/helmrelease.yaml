---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
spec:
  chartRef:
    kind: OCIRepository
    name: blocky
  interval: 1h
  values:
    controllers:
      blocky:
        type: deployment
        replicas: 3
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 0
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/0xerr0r/blocky
              tag: v0.34.0
            probes:
              startup: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "/app/blocky"
                      - "healthcheck"
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 5
              readiness: *probe
              liveness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {add: ["NET_BIND_SERVICE"], drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                cpu: 1
                memory: 1Gi
    defaultPodOptions:
      # Blocky is the LAN's only resolver, so it outranks ordinary workloads
      # for scheduling and is evicted last under node pressure.
      priorityClassName: cluster-infra
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: &podLabels
              app.kubernetes.io/name: blocky
              app.kubernetes.io/instance: blocky
              app.kubernetes.io/controller: blocky
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: *podLabels
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
    service:
      http:
        controller: blocky
        primary: true
        ports:
          http:
            port: &httpPort 4000
            primary: true
          # ClusterIP only: the tls listener requires a PROXY header, so it is
          # usable solely from envoy-internal, never straight off the LAN.
          dns-tls:
            port: &dotPort 853
      dns:
        controller: blocky
        primary: false
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        ipFamilyPolicy: RequireDualStack
        ipFamilies:
          - "IPv4"
          - "IPv6"
        annotations:
          lbipam.cilium.io/ips: "192.168.1.53,fd2e:9a41:6b8c:1::53"
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
            primary: true
          dns-udp:
            port: 53
            protocol: UDP
    serviceMonitor:
      http:
        service:
          identifier: http
        endpoints:
          - port: http
    persistence:
      config:
        type: configMap
        name: blocky-config
        globalMounts:
          - path: /app/config.yml
            subPath: config.yml
            readOnly: true
      dragonfly-auth:
        type: secret
        name: blocky-dragonfly-auth
        globalMounts:
          - path: /run/secrets/dragonfly
            readOnly: true
      # queryLog.target reads the DSN out of this file rather than inlining it,
      # since config.yml is a plain ConfigMap. Mirrored from CNPG's generated
      # timescale-app secret by reflector.
      timescale-auth:
        type: secret
        name: blocky-timescale-auth
        globalMounts:
          - path: /run/secrets/timescale
            readOnly: true
      # Wildcard cert, so it already covers dns.${SECRET_DOMAIN}. reloader
      # restarts the pods when cert-manager renews it.
      tls:
        type: secret
        name: "${SECRET_DOMAIN/./-}-production-tls"
        globalMounts:
          - path: /run/secrets/tls
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - "blocky.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: http
                port: *httpPort
      doh:
        # A bare GET /dns-query is "400 dns param is missing", so the probe
        # carries the RFC 8484 sample query for www.example.com. blocky answers
        # 200 application/dns-message even on NXDOMAIN, so the check stays green
        # on upstream failures and red only when blocky itself stops answering.
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /dns-query?dns=AAABAAABAAAAAAAAA3d3dwdleGFtcGxlA2NvbQAAAQAB
        hostnames:
          - "dns.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          # Exact, never PathPrefix: the same listener serves /api, /metrics and
          # /debug, and none of those are authenticated.
          - matches:
              - path:
                  type: Exact
                  value: /dns-query
            backendRefs:
              - identifier: http
                port: *httpPort
