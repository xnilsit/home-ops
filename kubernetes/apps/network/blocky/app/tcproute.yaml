---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: blocky-dot
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: dot
  rules:
    - backendRefs:
        - name: blocky-http
          port: 853
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: blocky-dot
spec:
  # Without this blocky logs the envoy pod as the client for every DoT query.
  proxyProtocol:
    version: V2
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      name: blocky-dot
