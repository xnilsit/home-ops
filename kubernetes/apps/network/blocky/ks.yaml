---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app blocky
  namespace: flux-system
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/network/blocky/app
  dependsOn:
    - name: dragonfly
      namespace: flux-system
    # queryLog.type: timescale writes to log_entries, which timescale-bootstrap
    # pre-creates with a 1-day chunk interval. That Kustomization is Ready only
    # once its Job has completed, so blocky never reconciles against a missing
    # or wrongly-partitioned table. Blocky's own create_hypertable() then no-ops.
    - name: timescale-bootstrap
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 5m
