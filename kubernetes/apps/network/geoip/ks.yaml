---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app geoip
  namespace: flux-system
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/network/geoip/app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Holds coraza-waf back until the bootstrap Job has filled the volume.
  wait: true
  interval: 1h
  timeout: 15m
