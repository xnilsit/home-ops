---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geoip
spec:
  # Written by the geoipupdate jobs, mounted read-only by the envoy-waf proxies.
  # Not backed up - the databases are re-downloadable.
  accessModes:
    - "ReadWriteMany"
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-filesystem
