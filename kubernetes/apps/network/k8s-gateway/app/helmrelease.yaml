---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN} ${SECRET_DOMAIN_ALT}"
    ttl: 1
    replicaCount: 3
    # CoreDNS forwards the internal domains here, so in-cluster resolution of
    # internal hostnames depends on these pods. Same class as blocky.
    priorityClassName: cluster-infra
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: k8s-gateway
            app.kubernetes.io/instance: k8s-gateway
    service:
      type: ClusterIP
      # Pinned because CoreDNS forwards the internal domains here by address;
      # a recreated Service picking a new IP would silently break pod
      # resolution of internal hostnames. Same value as today, so this is a
      # no-op against the live Service.
      clusterIP: ${K8S_GATEWAY_IP}
      port: 53
      useTcp: true
    fallthrough:
      enabled: true
    watchedResources:
      - "HTTPRoute"
      - "Service"
    extraZonePlugins:
      - name: log
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        parameters: . 192.168.0.1
      - name: loop
      - name: reload
      - name: loadbalance
