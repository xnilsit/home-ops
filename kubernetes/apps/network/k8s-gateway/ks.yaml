---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8s-gateway
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/network/k8s-gateway/app
  dependsOn:
    # priorityClassName references cluster-infra; pods are rejected outright
    # while that PriorityClass is missing.
    - name: priority-classes
      namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: false
