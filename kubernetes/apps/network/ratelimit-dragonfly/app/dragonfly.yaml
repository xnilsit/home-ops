---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: ${APP}
spec:
  # Written out rather than components/dragonfly: that component reflects the
  # SHARED database/dragonfly-auth password and snapshots to Garage. Rate limit
  # counters are per-window and worth nothing after a restart, so neither fits.
  #
  # renovate: datasource=docker depName=ghcr.io/dragonflydb/dragonfly
  image: ghcr.io/dragonflydb/dragonfly:v2.0.0
  replicas: 2
  # Every ingress request is rate limited against this instance.
  priorityClassName: cluster-infra
  networkPolicyEnabled: false
  authentication:
    passwordFromSecret:
      name: ${APP}-auth
      key: password
  podMetadata:
    annotations:
      kubectl.kubernetes.io/default-container: dragonfly
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    # Counters are disposable; evicting the coldest beats refusing a write.
    - --cache_mode=true
  resources:
    requests:
      cpu: 50m
      # Explicit, or it would default to the limit.
      memory: 128Mi
    limits:
      memory: 256Mi
  pdb:
    maxUnavailable: 1
  serviceSpec:
    type: ClusterIP
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: ${APP}
