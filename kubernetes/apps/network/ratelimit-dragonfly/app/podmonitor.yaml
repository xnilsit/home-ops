---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ${APP}
spec:
  selector:
    matchLabels:
      app: ${APP}
  podTargetLabels:
    - app
  podMetricsEndpoints:
    - port: admin
