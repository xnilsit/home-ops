---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: coraza-waf-rules
spec:
  groups:
    - name: coraza-waf-availability
      rules:
        # The module exports waf_tx_total at 0 once its filter is configured.
        - alert: CorazaWafAbsent
          annotations:
            summary: >-
              no coraza filter on {{ $labels.gateway }} - public traffic may be
              reaching the backends unfiltered
          expr: |-
            absent(envoy_dynamicmodulescustom_waf_tx_total{namespace="network", gateway="envoy-external"})
            or
            absent(envoy_dynamicmodulescustom_waf_tx_total{namespace="network", gateway="envoy-external-direct"})
          for: 10m
          labels:
            severity: critical

    - name: coraza-waf-traffic
      rules:
        # A gateway that inspects nothing for an hour has either lost its
        # listener or lost the filter; both look identical from outside.
        - alert: CorazaWafInspectingNothing
          annotations:
            summary: >-
              {{ $labels.gateway }} has inspected no request in an hour
          expr: |-
            sum by (gateway) (
              increase(envoy_dynamicmodulescustom_waf_tx_total{gateway=~"envoy-external|envoy-external-direct"}[1h])
            ) == 0
          for: 30m
          labels:
            severity: warning

        - alert: CorazaWafInterruptionSpike
          annotations:
            summary: >-
              {{ $labels.gateway }} is blocking {{ $value | humanize }} req/s on rule
              {{ $labels.rule_id }}
          expr: |-
            sum by (gateway, rule_id) (
              rate(envoy_dynamicmodulescustom_waf_tx_blocked{gateway=~"envoy-external|envoy-external-direct"}[5m])
            ) > 1
          for: 10m
          labels:
            severity: warning
