---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/envoyextensionpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: coraza-waf
spec:
  # The two public gateways. envoy-internal is not attached.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external-direct
  wasm:
    - name: coraza
      # rootID omitted: the module registers its context with an empty root_id.
      code:
        type: Image
        image:
          # renovate: datasource=docker depName=ghcr.io/corazawaf/coraza-proxy-wasm
          url: ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0
        pullPolicy: IfNotPresent
      # Passes traffic through unfiltered when the module fails to load or parse.
      failOpen: true
      config:
        default_directives: default
        # Emitted as labels on the waf_filter stats.
        metric_labels:
          owner: coraza
          identifier: public
        directives_map:
          default:
            # Coraza's baseline. Everything below overrides it.
            - Include @recommended-conf

            - SecRuleEngine On
            - SecRequestBodyAccess On
            # Bytes of request body inspected, buffered inside the wasm VM.
            - SecRequestBodyLimit 32768
            - SecRequestBodyInMemoryLimit 32768
            # Truncates a larger body instead of rejecting it with a 413.
            - SecRequestBodyLimitAction ProcessPartial
            - SecResponseBodyAccess Off
            # Both 400 on the truncated multipart ProcessPartial leaves behind.
            - SecRuleRemoveById 200002
            - SecRuleRemoveById 200003
            # Matches still reach the proxy's application log.
            - SecAuditEngine Off

            - Include @crs-setup-conf

            # Paranoia levels and anomaly thresholds. IDs 1-99999 are local.
            # detection > blocking runs the PL3 rules in log-only mode.
            - >-
              SecAction "id:10000,phase:1,pass,nolog,t:none,
              setvar:tx.blocking_paranoia_level=2,
              setvar:tx.detection_paranoia_level=3,
              setvar:tx.inbound_anomaly_score_threshold=5,
              setvar:tx.outbound_anomaly_score_threshold=4"

            # Exempts LAN clients. skipAfter covers phase 1, ctl phases 2 and up.
            # REMOTE_ADDR is the real client on both gateways: envoy resolves it
            # from x-forwarded-for against ClientTrafficPolicy/envoy trustedCIDRs.
            - >-
              SecRule REMOTE_ADDR "@ipMatch 192.168.0.0/23,fd2e:9a41:6b8c:1::/64"
              "id:10001,phase:1,pass,nolog,ctl:ruleEngine=Off,skipAfter:END-LAN-EXEMPT"

            # Exempts GitHub's webhook senders on the two receiver hosts only.
            # Both receivers verify an HMAC signature of their own.
            # The list is the `hooks` array of https://api.github.com/meta.
            # ctl goes on the last rule of the chain: coraza runs a starter's
            # non-disruptive actions on the starter's own match.
            # SERVER_NAME is empty in phase 1, hence REQUEST_HEADERS:Host.
            - >-
              SecRule REMOTE_ADDR "@ipMatch 192.30.252.0/22,185.199.108.0/22,140.82.112.0/20,143.55.64.0/20,2a0a:a440::/29,2606:50c0::/32"
              "id:10003,phase:1,pass,nolog,chain,skipAfter:END-LAN-EXEMPT"
            - >-
              SecRule REQUEST_HEADERS:Host "@rx ^(?:konflate|flux-webhook)\.${SECRET_DOMAIN_REGEX}(?::\d+)?$"
              "t:none,ctl:ruleEngine=Off"

            # The Home Assistant app's client_id=https://home-assistant.io/...
            # reads as an off-domain RFI reference to 931130. 931130 declares
            # ARGS, so the exclusion names ARGS:client_id, not ARGS_POST.
            - >-
              SecRule REQUEST_HEADERS:Host "@rx ^ha\.${SECRET_DOMAIN_REGEX}(?::\d+)?$"
              "id:10011,phase:1,pass,nolog,t:none,chain"
            - >-
              SecRule REQUEST_URI "@beginsWith /auth/token"
              "t:none,ctl:ruleRemoveTargetById=931130;ARGS:client_id"

            # The app posts the device's IPv6 addresses, whose colons 942431 reads
            # as SQL special characters.
            - >-
              SecRule REQUEST_HEADERS:Host "@rx ^ha\.${SECRET_DOMAIN_REGEX}(?::\d+)?$"
              "id:10012,phase:1,pass,nolog,t:none,chain"
            - >-
              SecRule REQUEST_URI "@beginsWith /api/webhook/"
              "t:none,ctl:ruleRemoveById=942431"

            - Include @owasp_crs/*.conf

            # Scores any backend 5xx, and one alone exceeds the outbound threshold.
            - SecRuleRemoveById 950100

            # Landing point for the skipAfter above. Markers run in every phase.
            - SecMarker END-LAN-EXEMPT

            # One extra line per flagged request carrying the requested host,
            # which CRS alerts lack: coraza's [hostname] is the envoy pod IP.
            # The score covers the NOTICE-severity rules, which envoy logs below
            # its own level.
            # phase 2, after 949160 has summed the detection score. A request
            # denied by 949110 never reaches it.
            # Shares unique_id with the rule alerts, which joins them in the
            # dashboard.
            - >-
              SecRule TX:DETECTION_INBOUND_ANOMALY_SCORE "@gt 0"
              "id:10020,phase:2,pass,log,msg:'WAF request context',
              logdata:'host=%{SERVER_NAME} score=%{tx.detection_inbound_anomaly_score}'"

            # Carries the same host onto the blocking rules, which interrupt
            # before 10020. A space in the value makes coraza reject the
            # directive.
            - SecRuleUpdateActionById 949110 "logdata:'host=%{SERVER_NAME}'"
            - SecRuleUpdateActionById 949111 "logdata:'host=%{SERVER_NAME}'"
