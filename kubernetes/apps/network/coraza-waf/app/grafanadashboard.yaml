---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: coraza-waf
spec:
  # The Grafana instance lives in observability, this dashboard in network.
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # Replaces the ${DS_*} placeholders in the JSON with the datasource uids.
  datasources:
    - datasourceName: victorialogs
      inputName: DS_VICTORIALOGS
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: coraza-waf-dashboard
    key: dashboard.json
