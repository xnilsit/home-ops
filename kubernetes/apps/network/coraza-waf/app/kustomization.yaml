---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./envoyextensionpolicy.yaml
  - ./grafanadashboard.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: coraza-waf-dashboard
    files:
      - dashboard.json=./dashboard.json
    options:
      annotations:
        # Leaves the ${DS_VICTORIALOGS} and ${DS_PROMETHEUS} grafana-operator
        # inputs in the JSON untouched.
        kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  # Propagates the generated name hash into GrafanaDashboard.spec.configMapRef.
  - ./kustomizeconfig.yaml
