---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${SECRET_DOMAIN/./-}-production"
spec:
  dnsNames:
    - "${SECRET_DOMAIN}"
    - "*.${SECRET_DOMAIN}"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: "${SECRET_DOMAIN/./-}-production-tls"
  usages:
    - digital signature
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${SECRET_DOMAIN_ALT/./-}-production"
spec:
  dnsNames:
    - "${SECRET_DOMAIN_ALT}"
    - "*.${SECRET_DOMAIN_ALT}"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: "${SECRET_DOMAIN_ALT/./-}-production-tls"
  usages:
    - digital signature
---
# <bucket>.s3.${SECRET_DOMAIN} for Garage's virtual-hosted buckets - one level
# below what *.${SECRET_DOMAIN} covers. Separate so adding it does not reissue
# the main certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "s3-${SECRET_DOMAIN/./-}-production"
spec:
  dnsNames:
    - "*.s3.${SECRET_DOMAIN}"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: "s3-${SECRET_DOMAIN/./-}-production-tls"
  usages:
    - digital signature
