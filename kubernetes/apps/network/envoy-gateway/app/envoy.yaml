---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
spec:
  # Envoy binds Gateway listeners on 0.0.0.0 only unless told otherwise, so the
  # IPv6 LoadBalancer VIP would reach the pod and be refused.
  ipFamily: DualStack
  # oauth2 runs first by default, so an unauthenticated request to an OIDC-gated
  # route is answered with a 302 before the limiter ever counts it.
  filterOrder:
    - name: envoy.filters.http.ratelimit
      before: envoy.filters.http.oauth2
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          # Every ingress request into the cluster goes through these pods.
          priorityClassName: cluster-infra
          # matchLabelKeys keeps each Gateway's pods a separate spread domain -
          # all three share this EnvoyProxy, so the labelSelector alone would
          # balance them as one pool.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  app.kubernetes.io/component: proxy
              matchLabelKeys:
                - gateway.envoyproxy.io/owning-gateway-name
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              cpu: 100m
              # Explicit, or it would default to the limit; a proxy here sits at ~70Mi
              memory: 512Mi
            limits:
              memory: 1Gi
      # Without it a drain can take both replicas of a gateway at once.
      envoyPDB:
        minAvailable: 1
      envoyService:
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ipFamilyPolicy: RequireDualStack
              ipFamilies:
                - "IPv4"
                - "IPv6"
  shutdown:
    drainTimeout: 180s
  telemetry:
    metrics:
      prometheus:
        compression:
          type: Zstd
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  # Referenced by the two gateways that run coraza; envoy-internal keeps the
  # class-level EnvoyProxy.
  name: envoy-waf
spec:
  # Merges into the class-level `envoy` instead of replacing it, so ipFamily,
  # the dual-stack Service patch and the drain timeout carry over.
  mergeType: StrategicMerge
  logging:
    # Repeated from the class-level proxy, whose value the merge would otherwise
    # lose to this resource's defaulted `warn`.
    level:
      default: info
  # Allowlists the Built On Envoy composer module for EnvoyExtensionPolicy/coraza-waf.
  dynamicModules:
    - name: composer
      source:
        type: Local
        local:
          path: /etc/envoy/dynamic-modules/libcomposer.so
      # Go modules cannot be unloaded.
      doNotClose: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          volumes:
            - name: dynamic-modules
              image:
                # renovate: datasource=docker depName=ghcr.io/tetratelabs/built-on-envoy/composer
                reference: ghcr.io/tetratelabs/built-on-envoy/composer:0.12.0
                pullPolicy: IfNotPresent
            # GeoLite2 databases, refreshed by the geoip CronJob.
            - name: geoip
              persistentVolumeClaim:
                claimName: geoip
                readOnly: true
        container:
          env:
            # Envoy holds pointers into Go memory.
            - name: GODEBUG
              value: cgocheck=0
          volumeMounts:
            - name: dynamic-modules
              mountPath: /etc/envoy/dynamic-modules
              readOnly: true
            - name: geoip
              mountPath: /etc/envoy/geoip
              readOnly: true
          resources:
            requests:
              # CRS evaluation, measured at ~3ms per request.
              cpu: 200m
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy
    namespace: network
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  annotations:
    external-dns.kubernetes.io/target: external.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  infrastructure:
    # Sizing, worker count and WAF stat tags for a gateway running coraza.
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-waf
    annotations:
      external-dns.kubernetes.io/hostname: external.${SECRET_DOMAIN}
      lbipam.cilium.io/ips: "192.168.1.151,fd2e:9a41:6b8c:1::151"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        # Both certs live on the same listener so Envoy picks one by SNI while
        # HTTPRoutes stay attached to a single `https` section. A dedicated
        # listener would be bypassed by the tunnel, which pins SNI to
        # external.${SECRET_DOMAIN} for every hostname it forwards.
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
          - kind: Secret
            name: "${SECRET_DOMAIN_ALT/./-}-production-tls"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # Public, but not through cloudflared: the tunnel caps request bodies at
  # 100 MB, which Immich's and TREK's uploads exceed. UniFi port-forwards WAN:80
  # and WAN:443 straight here, and cloudflare-dns-direct CNAMEs the routes to
  # home.${SECRET_DOMAIN}, unproxied, so no Cloudflare edge is in the path.
  name: envoy-external-direct
  annotations:
    external-dns.kubernetes.io/target: home.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  infrastructure:
    # Sizing, worker count and WAF stat tags for a gateway running coraza.
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-waf
    annotations:
      # No hostname annotation: this address is RFC-1918 and must never reach
      # public DNS.
      lbipam.cilium.io/ips: "192.168.1.152,fd2e:9a41:6b8c:1::152"
  listeners:
    # Carries the https-redirect route, so UniFi forwards WAN:80 here too.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
          - kind: Secret
            name: "${SECRET_DOMAIN_ALT/./-}-production-tls"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  annotations:
    external-dns.kubernetes.io/target: internal.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: internal.${SECRET_DOMAIN}
      lbipam.cilium.io/ips: "192.168.1.150,fd2e:9a41:6b8c:1::150"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
    # Plain TCP, not TLS: blocky terminates DoT itself, so envoy only proxies
    # bytes and never sees the cert.
    - name: dot
      protocol: TCP
      port: 853
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy
spec:
  compressor:
    - type: Zstd
      zstd: {}
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
  rateLimit:
    type: Global
    global:
      # shared, so a client cannot multiply its budget across HTTPRoutes: a
      # Gateway-targeted rule is otherwise counted per Route.
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 1200
            unit: Minute
          shared: true
        # Belt and braces, not a requirement: envoy's remote_address_match on
        # 0.0.0.0/0 above matches IPv6 clients too, so this rule sees almost no
        # traffic. Kept in case that ever stops being true.
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 1200
            unit: Minute
          shared: true
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy
spec:
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - "10.42.0.0/16"
        - "fd2e:9a41:6b8c:4200::/56"
  # Drops client-supplied geo headers before the geoip filter sets its own.
  headers:
    earlyRequestHeaders:
      remove:
        - x-geo-country
        - x-geo-region
        - x-geo-city
        - x-geo-asn
        - x-geo-asn-org
  http2:
    onInvalidMessage: TerminateStream
  http3: {}
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  tcpKeepalive: {}
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: http
    - name: envoy-external-direct
      namespace: network
      sectionName: http
    - name: envoy-internal
      namespace: network
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
