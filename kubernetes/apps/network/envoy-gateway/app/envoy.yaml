---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
spec:
  # Envoy binds Gateway listeners on 0.0.0.0 only unless told otherwise, so the
  # IPv6 LoadBalancer VIP would reach the pod and be refused.
  ipFamily: DualStack
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          # Every ingress request into the cluster goes through these pods.
          priorityClassName: cluster-infra
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              cpu: 100m
              # Explicit, or it would default to the limit; a proxy here sits at ~70Mi
              memory: 512Mi
            limits:
              memory: 1Gi
      envoyService:
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ipFamilyPolicy: RequireDualStack
              ipFamilies:
                - "IPv4"
                - "IPv6"
  shutdown:
    drainTimeout: 180s
  telemetry:
    metrics:
      prometheus:
        compression:
          type: Zstd
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy
    namespace: network
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  annotations:
    external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: external.${SECRET_DOMAIN}
      lbipam.cilium.io/ips: "192.168.1.151"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        # Both certs live on the same listener so Envoy picks one by SNI while
        # HTTPRoutes stay attached to a single `https` section. A dedicated
        # listener would be bypassed by the tunnel, which pins SNI to
        # external.${SECRET_DOMAIN} for every hostname it forwards.
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
          - kind: Secret
            name: "${SECRET_DOMAIN_ALT/./-}-production-tls"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # Public, but not through cloudflared: the tunnel caps request bodies at
  # 100 MB, which Immich's and TREK's uploads exceed. UniFi port-forwards WAN:80
  # and WAN:443 straight here, and cloudflare-dns-direct CNAMEs the routes to
  # home.${SECRET_DOMAIN}, unproxied, so no Cloudflare edge is in the path.
  name: envoy-external-direct
  annotations:
    external-dns.alpha.kubernetes.io/target: home.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      # No external-dns hostname annotation: this address is RFC-1918 and must
      # never reach public DNS.
      lbipam.cilium.io/ips: "192.168.1.152"
  listeners:
    # Carries the https-redirect route, so UniFi forwards WAN:80 here too.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
          - kind: Secret
            name: "${SECRET_DOMAIN_ALT/./-}-production-tls"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  annotations:
    external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: internal.${SECRET_DOMAIN}
      lbipam.cilium.io/ips: "192.168.1.150,fd2e:9a41:6b8c:1::150"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: "${SECRET_DOMAIN/./-}-production-tls"
    # Plain TCP, not TLS: blocky terminates DoT itself, so envoy only proxies
    # bytes and never sees the cert.
    - name: dot
      protocol: TCP
      port: 853
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy
spec:
  compressor:
    - type: Zstd
      zstd: {}
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy
spec:
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - "10.42.0.0/16"
        - "fd2e:9a41:6b8c:4200::/56"
  http2:
    onInvalidMessage: TerminateStream
  http3: {}
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  tcpKeepalive: {}
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: http
    - name: envoy-external-direct
      namespace: network
      sectionName: http
    - name: envoy-internal
      namespace: network
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
