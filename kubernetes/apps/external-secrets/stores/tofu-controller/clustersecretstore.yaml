---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: tofu-controller
spec:
  provider:
    kubernetes:
      # Required even for the local API server. url carries a CRD default, but
      # defaulting only applies once `server` itself exists - omitting the whole
      # block leaves the URL empty and the store stays InvalidProviderConfig.
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      remoteNamespace: tofu-controller
      auth:
        # ESO mints a token for this ServiceAccount and reads as it, so the
        # Role in rbac.yaml is the whole of this store's access.
        serviceAccount:
          name: eso-reader
          namespace: tofu-controller
