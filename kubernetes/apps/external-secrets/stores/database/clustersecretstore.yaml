---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: database
spec:
  provider:
    kubernetes:
      # Required even for the local API server: url only defaults once `server`
      # exists, so omitting the block leaves the store InvalidProviderConfig.
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      # Reads the per-consumer credentials the pg-shared tenant Kustomizations mint.
      remoteNamespace: database
      auth:
        serviceAccount:
          name: eso-reader
          namespace: database
