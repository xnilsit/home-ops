---
# A GarageCluster with only spec.connectTo set is a MANAGEMENT HANDLE: the
# operator provisions no StatefulSet, PVCs or Services and touches nothing but
# the Admin API of the Garage storage nodes on the NAS and Unraid. Adding
# spec.storage or spec.gateway here would make the operator start deploying
# Garage in-cluster.
#
# connectTo cannot be retargeted in place; moving the buckets and keys to
# another handle means recreating them.
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage
spec:
  connectTo:
    # Either storage node answers for the whole cluster, see ./service.yaml
    adminApiEndpoint: http://garage-storage.garage.svc.cluster.local:3903
    adminTokenSecretRef:
      name: garage-credentials
      key: admin-token
  network:
    # Only needed because the GarageKeys let the operator DERIVE key material;
    # without an RPC identity a handle can only adopt keys via spec.importKey.
    # Must be the same rpc_secret the storage nodes run with.
    rpcSecretRef:
      name: garage-credentials
      key: rpc-secret
