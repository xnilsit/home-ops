---
# The two CNPG backup buckets are named exactly as in Ceph RGW so the copied
# barman catalogs and the ObjectStore destinationPaths carry over unchanged.
#
# Deliberately NO quotas on any of these: barman archives WAL continuously, and
# a bucket that starts rejecting writes leaves the primary's pg_wal growing
# until its local disk fills.
apiVersion: v1
kind: List
items:
  - <<: &bucket {apiVersion: garage.rajsingh.info/v1beta1, kind: GarageBucket}
    metadata: {name: cnpg-backup}
    # Retain, not the Delete default: deleting the CR must not take the Postgres
    # backups with it.
    spec: &spec {clusterRef: {name: nas}, deletionPolicy: Retain}
  - <<: *bucket
    metadata: {name: timescale-backup}
    spec: *spec
  - <<: *bucket
    metadata: {name: immich-backup}
    spec: *spec
  # TREK's mirror target: its primary is the Ceph RGW, and every write is
  # replicated here.
  - <<: *bucket
    metadata: {name: trek}
    spec: *spec
  # One kopia repository shared by every kopiur SnapshotPolicy - kopia dedups
  # across writers and separates them by snapshot identity, not by key prefix.
  - <<: *bucket
    metadata: {name: kopiur}
    spec: *spec
  - <<: *bucket
    metadata: {name: dragonfly-backup}
    spec:
      <<: *spec
      # Dragonfly has no snapshot retention of its own.
      lifecycle:
        rules:
          - id: expire-snapshots
            expirationDays: 3
            abortIncompleteMultipartUploadDays: 1
  # The off-cluster copy of the tofu state that owns the authentik OIDC objects.
  # Written hourly by the CronJob in
  # kubernetes/apps/tofu-controller/authentik-oidc/state/rclone.yaml.
  - <<: *bucket
    metadata: {name: tofu-state}
    spec:
      <<: *spec
      # Expires the superseded copies under history/ only - the live object is
      # overwritten in place each hour, so it never ages out.
      lifecycle:
        rules:
          - id: expire-history
            expirationDays: 30
            abortIncompleteMultipartUploadDays: 1
