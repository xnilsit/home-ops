---
# One key per bucket, each writing a Secret shaped the way a barman-cloud
# ObjectStore expects. The Secrets live here; reflector mirrors them into
# database, where the ObjectStores are - a barman ObjectStore is
# namespace-scoped and its s3Credentials are SecretKeySelectors, so the
# credentials have to exist in the consuming namespace.
apiVersion: v1
kind: List
items:
  - <<: &key {apiVersion: garage.rajsingh.info/v1beta1, kind: GarageKey}
    metadata: {name: cnpg-backup}
    spec:
      clusterRef: {name: nas}
      neverExpires: true
      secretTemplate:
        <<: &template
          accessKeyIdKey: AWS_ACCESS_KEY_ID
          secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
          # Garage checks the region in the SigV4 credential scope and rejects a
          # mismatch, so barman has to be told it. Hardcoded rather than
          # includeRegion: the operator derives that from spec.s3Api.region,
          # which a tier-less management handle does not carry - it would default
          # to "garage" and every request would fail to authenticate.
          includeRegion: false
          # Same reason, and the operator hard-fails the key without it: it
          # cannot infer an S3 endpoint from a handle's adminApiEndpoint. Both
          # ObjectStores carry their own endpointURL anyway.
          includeEndpoint: false
          additionalData: {AWS_REGION: eu-central-1}
          annotations:
            reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
            reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: database
        name: garage-cnpg-backup
      bucketPermissions:
        - {bucketRef: {name: cnpg-backup}, read: true, write: true}
  - <<: *key
    metadata: {name: timescale-backup}
    spec:
      clusterRef: {name: nas}
      neverExpires: true
      secretTemplate:
        <<: *template
        name: garage-timescale-backup
      bucketPermissions:
        - {bucketRef: {name: timescale-backup}, read: true, write: true}
  - <<: *key
    metadata: {name: kopiur}
    spec:
      clusterRef: {name: nas}
      neverExpires: true
      secretTemplate:
        <<: *template
        # annotations, not the anchor's: kopiur's ClusterRepository reads this
        # from storage, and kopiur projects it onward into each mover namespace
        # itself - so only the one hop needs reflecting.
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: storage
        name: garage-kopiur
      bucketPermissions:
        - {bucketRef: {name: kopiur}, read: true, write: true}
  - <<: *key
    metadata: {name: dragonfly-backup}
    spec:
      clusterRef: {name: nas}
      neverExpires: true
      secretTemplate:
        # The anchor's key names are exactly what Dragonfly reads from its env.
        <<: *template
        # No namespace list: every Dragonfly built from the component snapshots
        # into this bucket under its own ${APP} prefix, in its app's namespace.
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        name: garage-dragonfly-backup
      bucketPermissions:
        - {bucketRef: {name: dragonfly-backup}, read: true, write: true}
  - <<: *key
    metadata: {name: tofu-state}
    spec:
      clusterRef: {name: nas}
      neverExpires: true
      secretTemplate:
        <<: *template
        # read as well as write: the restore Job copies Garage -> RGW when a
        # rebootstrap leaves the RGW bucket empty.
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: tofu-controller
        name: garage-tofu-state
      bucketPermissions:
        - {bucketRef: {name: tofu-state}, read: true, write: true}
