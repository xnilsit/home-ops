---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Order matters on first reconcile: the handle needs the credentials, and the
  # buckets and keys only start reconciling once the handle reaches Running.
  - ./secret.sops.yaml
  - ./garagecluster.yaml
  - ./garagebucket.yaml
  - ./garagekey.yaml
  - ./httproute.yaml
  - ./vmscrapeconfig.yaml
  - ./grafanadashboard.yaml
configMapGenerator:
  - name: garage-dashboard
    files:
      - garage.json=./dashboards/garage.json
    options:
      annotations:
        # The JSON is full of $__rate_interval and ${datasource}, which the
        # inherited postBuild.substituteFrom would replace with nothing.
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  # The GrafanaDashboard references this ConfigMap by name.
  disableNameSuffixHash: true
