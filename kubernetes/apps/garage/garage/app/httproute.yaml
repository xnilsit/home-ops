---
# Convenience endpoint for humans and ad-hoc S3 tooling. The barman data path
# deliberately does NOT go through here - the ObjectStores point straight at
# http://192.168.0.200:3900, so multipart backup uploads never cross Envoy.
#
# Backend and HTTPRoute both live in this namespace: an HTTPRoute may only
# reference a Backend in its own namespace, and envoy-internal's https listener
# accepts routes from all namespaces.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: garage-s3
spec:
  endpoints:
    - ip: {address: 192.168.0.200, port: 3900}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-s3
  # Port 3900 has no unauthenticated 200 - a GET / is a ListBuckets without a
  # SigV4 signature and answers 403. The admin API on 3903 does, and it reports
  # cluster quorum rather than just "the listener is up"; it is unrouted, so the
  # probe goes straight to the LAN address the webui and the scrape config use.
  annotations:
    gatus.home-operations.com/endpoint: |
      url: http://192.168.0.200:3903/health
spec:
  hostnames:
    - "s3.${SECRET_DOMAIN}"
  parentRefs:
    - {name: envoy-internal, namespace: network, sectionName: https}
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /}}
      backendRefs:
        - {group: gateway.envoyproxy.io, kind: Backend, name: garage-s3}
