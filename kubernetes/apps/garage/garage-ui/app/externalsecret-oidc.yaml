---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-oidc
spec:
  # garage-ui speaks OIDC itself, so this is read into env by the chart rather
  # than into a gateway SecurityPolicy. Only the secret half: client_id is
  # home-ops-${APP}, which the tofu module derives from the app key.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tofu-controller
  target:
    name: *secret
  data:
    - secretKey: client-secret
      remoteRef:
        key: ${APP}-oidc
        property: client-secret
