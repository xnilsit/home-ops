---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/all.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-ui
  annotations:
    # /health is registered before the auth middleware, so it answers 200
    # without a session. No oauth2 client here: the route carries no
    # SecurityPolicy, garage-ui logs the user in itself.
    gatus.home-operations.com/endpoint: |
      path: /health
spec:
  hostnames:
    - "garage.${SECRET_DOMAIN}"
  # envoy-internal only. garage-ui holds the admin token, so it can read every
  # S3 secret key Garage stores - its own OIDC is the gate, and it is the reason
  # there is no external route.
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: garage-ui
          port: 80
