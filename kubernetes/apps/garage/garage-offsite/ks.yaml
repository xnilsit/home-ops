---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-offsite
  namespace: flux-system
spec:
  targetNamespace: garage
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/garage/garage-offsite/app
  dependsOn:
    # The handle the GarageKey points at
    - name: garage
      namespace: flux-system
  healthChecks:
    - apiVersion: garage.rajsingh.info/v1beta1
      kind: GarageKey
      name: offsite-backup
      namespace: garage
  healthCheckExprs:
    - apiVersion: garage.rajsingh.info/v1beta1
      kind: GarageKey
      failed: status.phase in ['Failed', 'Expired']
      current: status.phase == 'Ready'
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 1h
  timeout: 10m
