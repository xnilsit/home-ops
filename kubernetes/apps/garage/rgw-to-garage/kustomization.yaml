---
# Deliberately NOT referenced from ../kustomization.yaml, so Flux's cluster-apps
# Kustomization never walks into this directory. This file exists so the Jobs can
# be validated with `kustomize build`; the entry point is
# `just kube migrate-cnpg-backups`.
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./job.yaml
