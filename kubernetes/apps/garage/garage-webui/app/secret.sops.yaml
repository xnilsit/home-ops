---
# garage-webui splits AUTH_USER_PASS on ":" and bcrypt-compares the second
# field, so the whole username:hash pair is one value. Without it the webui
# serves its API unauthenticated to anything that can reach the Service.
#
# AUTH_PASSWORD is the plaintext behind that hash, kept here on purpose so the
# login is recoverable from the repo. Nothing consumes it - bcrypt is one-way,
# so a lost password would otherwise mean rotating the hash.
