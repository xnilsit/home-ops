---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-gateway
  namespace: flux-system
spec:
  targetNamespace: garage
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/garage/garage-gateway/app
  # Apart from garage so a gateway that will not come up does not hold back the
  # buckets, keys and everything that dependsOn them.
  dependsOn:
    # The handle the gateways join: credentials and a reachable NAS Admin API
    - name: garage
      namespace: flux-system
    # The metadata PVCs are ceph-block
    - name: rook-ceph-cluster
      namespace: flux-system
    # The HTTPRoute needs envoy-internal
    - name: envoy-gateway
      namespace: flux-system
  healthChecks:
    - <<: &gateway {apiVersion: garage.rajsingh.info/v1beta2, kind: GarageCluster, namespace: garage}
      name: edge-a
    - <<: *gateway
      name: edge-b
  healthCheckExprs:
    # Running once the gateway pod is Ready, which only means S3 is bound - not
    # that it reached the NAS.
    - apiVersion: garage.rajsingh.info/v1beta2
      kind: GarageCluster
      failed: status.phase == 'Failed'
      current: status.phase == 'Running'
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 1h
  timeout: 10m
