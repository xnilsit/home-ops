---
# Convenience endpoint for humans and ad-hoc S3 tooling, path-style on
# s3.${SECRET_DOMAIN} and virtual-hosted on <bucket>.s3.${SECRET_DOMAIN} (the
# gateways' s3Api.rootDomain). In-cluster clients skip Envoy and use the
# garage Service directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-s3
  # Port 3900 has no unauthenticated 200 - a GET / is a ListBuckets without a
  # SigV4 signature and answers 403. The NAS's admin API on 3903 does, and it
  # reports cluster quorum rather than just "the listener is up"; it is
  # unrouted, so the probe goes straight to the LAN address the console and the
  # scrape config use.
  annotations:
    gatus.home-operations.com/endpoint: |
      url: http://192.168.0.200:3903/health
spec:
  hostnames:
    - "s3.${SECRET_DOMAIN}"
    # Served off the *.s3 certificate in network/envoy-gateway; k8s-gateway
    # answers the wildcard on the LAN.
    - "*.s3.${SECRET_DOMAIN}"
  parentRefs:
    - {name: envoy-internal, namespace: network, sectionName: https}
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /}}
      backendRefs:
        - {name: garage, port: 3900}
