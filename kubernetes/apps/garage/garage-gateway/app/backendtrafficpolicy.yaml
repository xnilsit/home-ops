---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: garage-s3
spec:
  # Replaces BackendTrafficPolicy/envoy for this route: its compressor strips
  # Accept-Encoding upstream, which breaks SigV4 signatures that cover it. Also
  # drops its 1200/min rate limit.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: garage-s3
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
