---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-admin-console
spec:
  chartRef:
    kind: OCIRepository
    name: garage-admin-console
  interval: 1h
  values:
    controllers:
      garage-admin-console:
        # RWO /data volume holding the SQLite database: never two pods at once.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # The all-in-one image: admin console plus the S3 object browser
              # served same-origin at /s3-browser, so no second container.
              repository: ghcr.io/eyebrowkang/garage-admin-all
              tag: 2.3.0
            env:
              TZ: ${TIMEZONE}
              LOG_LEVEL: info
              PORT: &port 3001
            envFrom:
              # JWT_SECRET, ENCRYPTION_KEY and ADMIN_PASSWORD - all three are
              # required, the process refuses to start without them.
              - secretRef:
                  name: garage-admin-console
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # The one route mounted before the auth middleware.
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # The image runs as `node`, and fsGroup so it can write the database.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        existingClaim: garage-admin-console
        globalMounts:
          # DATA_DIR in the image: the SQLite database holding the cluster
          # entries and their admin tokens, encrypted with ENCRYPTION_KEY.
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          # Multipart uploads through the S3 browser buffer here.
          - path: /tmp
    service:
      app:
        # Probed here rather than through the route: ./kustomization.yaml takes
        # passThroughAuthHeader off this app's SecurityPolicy, so the route only
        # answers 302 without an authentik cookie. In-cluster the app answers
        # /api/health itself, which is the half worth watching anyway.
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |
            url: http://garage-admin-console.garage.svc.cluster.local:3001/api/health
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          # See the Service above.
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "garage.${SECRET_DOMAIN}"
        # envoy-internal only, behind the OIDC SecurityPolicy: this is full
        # administrative control of Garage, including read access to every S3
        # credential it holds.
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
