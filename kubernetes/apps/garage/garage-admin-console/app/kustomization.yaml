---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # In front of the console's own login, which cannot be disabled - so this is
  # the group gate, not the only auth.
  - ../../../../components/oidc
resources:
  - ./pvc.yaml
  - ./secret.sops.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
patches:
  # The console authenticates its own XHR with `Authorization: Bearer <its own
  # HS256 token>`. passThroughAuthHeader routes exactly those requests past the
  # oauth2 filter and into the jwt one, which only knows the gatus-probe issuer
  # and answers "Jwt issuer is not configured" 401 - so every call after the
  # password prompt fails and the UI falls back to the login screen. Both halves
  # go: Envoy Gateway rejects passThroughAuthHeader without a jwt provider. The
  # probe moves to the Service, see ./helmrelease.yaml.
  - target:
      kind: SecurityPolicy
    patch: |-
      - op: remove
        path: /spec/oidc/passThroughAuthHeader
      - op: remove
        path: /spec/jwt
