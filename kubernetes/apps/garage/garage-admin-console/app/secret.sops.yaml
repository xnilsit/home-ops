---
# The console's own login, which cannot be turned off: every /api route except
# /api/health goes through its JWT middleware and there is no SSO or trusted-
# header mode. Behind the authentik SecurityPolicy this is a second password,
# and it is also what protects the Service from anything else in the cluster.
#
# ENCRYPTION_KEY must be exactly 32 ASCII characters and encrypts the Garage
# admin tokens at rest in /data - rotating it orphans every stored cluster.
# Rotating JWT_SECRET signs everyone out.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
