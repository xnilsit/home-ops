---
# Vendored from deployments/multus-daemonset-thick.yml at the pinned tag. Multus
# publishes no chart and no separate CRD artifact, so the CRD travels with the
# DaemonSet and is bumped alongside it.
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/customresourcedefinition-apiextensions-v1.json
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: network-attachment-definitions.k8s.cni.cncf.io
spec:
  group: k8s.cni.cncf.io
  scope: Namespaced
  names:
    plural: network-attachment-definitions
    singular: network-attachment-definition
    kind: NetworkAttachmentDefinition
    shortNames:
      - net-attach-def
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            NetworkAttachmentDefinition is a CRD schema specified by the Network
            Plumbing Working Group to express the intent for attaching pods to one
            or more logical or physical networks.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                config:
                  description: A JSON-formatted CNI configuration.
                  type: string
