---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/daemonset-apps-v1.json
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: slaac-janitor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: &app slaac-janitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      # Must be the host namespace: these are the node's own SLAAC addresses.
      hostNetwork: true
      # Needs no DNS, and must not wait on CoreDNS to start sweeping.
      dnsPolicy: Default
      # A missed sweep only delays reclaiming an address; it is not node-critical.
      priorityClassName: cluster-infra
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: app
          # busybox `ip` already prints the deprecated flag, so no iproute2 and
          # no package install on a node-level DaemonSet at startup.
          image: mirror.gcr.io/library/alpine:3.22
          command:
            - "/bin/sh"
            - "-c"
          args:
            # No shell variables here on purpose: flux postBuild substitution is
            # strict and would try to resolve any dollar-name as a cluster
            # variable. awk emits finished commands and sh runs them; awk fields
            # are safe because a digit cannot start a substitution identifier.
            #
            # The 30s sleep bounds how long cilium can masquerade to a dead
            # prefix after a rotation.
            - |
              while :; do
                ip -6 addr show | awk '
                  /^[0-9]+: / { dev = $2; sub(/:$/, "", dev) }
                  /^ *inet6 / && /scope global/ && /deprecated/ && /dynamic/ {
                    if ($2 ~ /^[23]/) print "ip -6 addr del " $2 " dev " dev " && echo deleted deprecated " $2 " from " dev
                  }' | sh
                sleep 30
              done
          securityContext:
            # NET_ADMIN is only effective for uid 0; everything else is dropped.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {add: ["NET_ADMIN"], drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 32Mi
