---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  chartRef:
    kind: OCIRepository
    name: reloader
  interval: 1h
  values:
    fullnameOverride: reloader
    reloader:
      readOnlyRootFileSystem: true
      deployment:
        # Drives the reloader.stakater.com/auto restarts that pick up rotated
        # secrets and rendered configs across the cluster.
        priorityClassName: cluster-platform
      podMonitor:
        enabled: true
        namespace: "{{ .Release.Namespace }}"
