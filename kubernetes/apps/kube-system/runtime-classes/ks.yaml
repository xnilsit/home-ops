---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app runtime-classes
  namespace: flux-system
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/kube-system/runtime-classes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Ready only once the RuntimeClasses exist; dependents rely on it.
  wait: true
  interval: 1h
  timeout: 5m
