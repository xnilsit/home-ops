---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: "192.168.0.0/23"
    - cidr: "fd2e:9a41:6b8c:1::/112"
  # One generic request per family is satisfied, so this block must not be
  # eligible for the GUA-only service in network/ipv6-prefix-tracker.
  serviceSelector:
    matchExpressions:
      - key: io.kubernetes.service.name
        operator: NotIn
        values:
          - "envoy-external-direct-gua"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # Only the 10G ports; the 1G onboard NICs carry no f<n> function suffix.
  interfaces:
    - ^enp[0-9]+s[0-9]+f[0-9]+(np[0-9]+)?$
  # Nodes without a matching port still stand for the leader lease, and a VIP
  # whose lease one wins is answered by nobody on the LAN. The label is set per
  # node in talos/patches/node/*/31-node.yaml.
  nodeSelector:
    matchLabels:
      home-ops/nic-10g: "true"
