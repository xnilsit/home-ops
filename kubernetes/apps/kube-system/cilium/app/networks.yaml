---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: "192.168.0.0/23"
    - cidr: "fd2e:9a41:6b8c:1::/112"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # Only the 10G ports; the 1G onboard NICs carry no f<n> function suffix.
  interfaces:
    - ^enp[0-9]+s[0-9]+f[0-9]+(np[0-9]+)?$
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
