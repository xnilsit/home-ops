---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: "192.168.0.0/23"
    - cidr: "fd2e:9a41:6b8c:1::/112"
  # One generic request per family is satisfied, so this block must not be
  # eligible for the GUA-only service in network/ipv6-prefix-tracker.
  serviceSelector:
    matchExpressions:
      - key: io.kubernetes.service.name
        operator: NotIn
        values:
          - "envoy-external-direct-gua"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # Only the 10G ports; the 1G onboard NICs carry no f<n> function suffix.
  interfaces:
    - ^enp[0-9]+s[0-9]+f[0-9]+(np[0-9]+)?$
  # The srv nodes only. kube-wrk-01's sole NIC is a 1G enp2s0 that the regex
  # above rejects, yet without this it still stands for the leader lease - and a
  # VIP whose lease it wins is answered by nobody on the LAN.
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
