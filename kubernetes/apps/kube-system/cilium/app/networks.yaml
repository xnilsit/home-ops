---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: "192.168.0.0/23"
    - cidr: "fd2e:9a41:6b8c:1::/112"
  # LB-IPAM satisfies one generic request per family, so whichever pool wins the
  # IPv6 slot is the only one asked. Without this, the ULA block would satisfy
  # the GUA-only service and network/ipv6-prefix-tracker's pool never gets a
  # look in. Cilium synthesises this label on every service, so NotIn is
  # unambiguous.
  serviceSelector:
    matchExpressions:
      - key: io.kubernetes.service.name
        operator: NotIn
        values:
          - "envoy-external-direct-gua"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # Only the 10G ports; the 1G onboard NICs carry no f<n> function suffix.
  interfaces:
    - ^enp[0-9]+s[0-9]+f[0-9]+(np[0-9]+)?$
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
