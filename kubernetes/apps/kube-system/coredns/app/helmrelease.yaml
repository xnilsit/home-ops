---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: "10.43.0.10"
    replicaCount: 2
    # Deliberately the built-in class rather than cluster-infra (which blocky
    # and k8s-gateway use). The bootstrap helmfile installs coredns from these
    # same values before Flux exists, so cluster-infra would not be created
    # yet - the pods would be rejected and the bootstrap would hang before
    # Flux could ever reconcile the PriorityClass. system-cluster-critical
    # ships with the control plane and outranks cluster-infra anyway, which is
    # the correct ordering for cluster DNS.
    priorityClassName: system-cluster-critical
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          # Split-horizon: without these, pods resolve internal hostnames via
          # /etc/resolv.conf and get the public Cloudflare answer, while the LAN
          # resolves them to envoy-internal. Any app calling another by its
          # public hostname then fails - a route on envoy-internal is not
          # reachable from Cloudflare (523). k8s-gateway answers authoritatively
          # for these domains and falls through for everything else.
          #
          # forward takes a single FROM zone, hence one stanza per domain.
          # k8s-gateway runs 3 replicas spread across nodes, so this is not a
          # single point of failure.
          - name: forward
            parameters: ${SECRET_DOMAIN} ${K8S_GATEWAY_IP}
          - name: forward
            parameters: ${SECRET_DOMAIN_ALT} ${K8S_GATEWAY_IP}
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
