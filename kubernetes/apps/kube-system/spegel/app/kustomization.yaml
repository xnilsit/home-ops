---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: spegel-dashboard
    files:
      - spegel.json=./dashboards/spegel.json
    options:
      annotations:
        # Keeps postBuild.substituteFrom away from $node, ${datasource} and $__range.
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
