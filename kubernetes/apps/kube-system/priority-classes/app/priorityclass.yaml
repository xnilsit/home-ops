---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/scheduling.k8s.io/priorityclass_v1.json
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cluster-infra
# Well above the default 0 that every other workload gets, but below
# system-cluster-critical (2000000000) so control-plane add-ons still win.
# For infrastructure the rest of the cluster (and the LAN) depends on:
# scheduled first, preempts ordinary apps, evicted last under node pressure.
value: 1000000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: >-
  Critical cluster infrastructure such as DNS. Takes precedence over ordinary
  workloads but yields to system-cluster-critical.
