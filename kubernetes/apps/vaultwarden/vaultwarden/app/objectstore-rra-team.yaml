---
# rra-team's vaultwarden-db archive on B2. Read-only from here: no Cluster
# archives to it.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: vaultwarden-db-archive
spec:
  configuration:
    destinationPath: s3://rra-team-cnpg/vaultwarden
    endpointURL: https://s3.eu-central-003.backblazeb2.com
    s3Credentials:
      accessKeyId:
        name: vaultwarden-b2
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: vaultwarden-b2
        key: ACCESS_SECRET_KEY
    wal:
      compression: bzip2
    data:
      compression: bzip2
