---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  chartRef:
    kind: OCIRepository
    name: vaultwarden
  interval: 1h
  values:
    controllers:
      # Scaled up and routed by ../../modes/primary.
      vaultwarden:
        replicas: 0
        strategy: RollingUpdate
        podDisruptionBudget:
          maxUnavailable: 1
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: vaultwarden
        containers:
          app:
            image:
              repository: registry.nilsit.de/ghcr.io/dani-garcia/vaultwarden
              tag: 1.37.4-alpine
            env:
              # config.json from rra-team overrides this with the same value.
              DOMAIN: https://bitwarden.hoeller-en.de
              ROCKET_PORT: &port 8080
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: vaultwarden-postgres-credentials
                    key: uri
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi

      # Mirrors rra-team's /data from its RGW bucket. Suspended in primary mode,
      # where /data is the live copy.
      pull:
        type: cronjob
        cronjob:
          schedule: "*/5 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: registry.nilsit.de/docker.io/rclone/rclone
              tag: 1.75.2
            args:
              - sync
              - ro:vaultwarden-data
              - /data
              - --exclude=icon_cache/**
              - --exclude=tmp/**
              # An emptied bucket must not wipe the standby.
              - --max-delete=50
            env:
              HOME: /tmp
              RCLONE_CONFIG_RO_TYPE: s3
              RCLONE_CONFIG_RO_PROVIDER: Ceph
              RCLONE_CONFIG_RO_ENDPOINT: https://rgw.rra.team
            envFrom:
              # RCLONE_CONFIG_RO_ACCESS_KEY_ID, RCLONE_CONFIG_RO_SECRET_ACCESS_KEY
              - secretRef:
                  name: vaultwarden-rgw
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    persistence:
      data:
        existingClaim: vaultwarden
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    service:
      app:
        controller: vaultwarden
        ports:
          http:
            port: *port

    route:
      app:
        enabled: false
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /alive
        hostnames:
          - bitwarden.hoeller-en.de
          - bw.hoeller-en.de
          - vaultwarden.hoeller-en.de
          - vw.hoeller-en.de
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
