---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vaultwarden
  namespace: flux-system
spec:
  targetNamespace: vaultwarden
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/vaultwarden/vaultwarden/app
  # VAULTWARDEN_MODE in cluster-settings: standby follows rra-team, primary takes over.
  components:
    - ../modes/${VAULTWARDEN_MODE:=standby}
  dependsOn:
    # The Clusters reference the barman plugin
    - name: barman-cloud-plugin
      namespace: flux-system
    # Backup bucket and key for vaultwarden-postgres
    - name: garage
      namespace: flux-system
    # The /data PVC is provisioned through kopiur's Restore populator
    - name: kopiur-repository
      namespace: flux-system
    # CephFS RWX for /data
    - name: rook-ceph-cluster
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      PG_INSTANCES: "2"
      PG_STORAGE_SIZE: 2Gi
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
      PG_IMAGE_TAG: 18.6-minimal-trixie
      KOPIUR_ACCESSMODES: ReadWriteMany
      KOPIUR_STORAGECLASS: ceph-filesystem
      KOPIUR_SNAPSHOTCLASS: csi-ceph-filesystem
      KOPIUR_CAPACITY: 1Gi
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: vaultwarden-postgres
      namespace: vaultwarden
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: vaultwarden
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 30m
