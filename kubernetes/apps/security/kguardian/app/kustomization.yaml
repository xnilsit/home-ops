---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/postgres-shared
  - ../../../../components/oidc
  - ../../../../components/oidc-probe
patches:
  # Scoped here rather than added to ../oidc: only this app proxies a request
  # onward to authentik, which needs the token the filter otherwise keeps.
  - target:
      kind: SecurityPolicy
    patch: |-
      - op: add
        path: /spec/oidc/forwardAccessToken
        value: true
      # forwardAccessToken puts an Authorization header on every request, which
      # ../oidc-probe's passThroughAuthHeader then routes into the jwt filter -
      # so this app's own issuer has to be one the filter knows.
      - op: add
        path: /spec/jwt/providers/-
        value:
          name: kguardian
          issuer: ${AUTHENTIK_URL}/application/o/home-ops-kguardian/
          remoteJWKS:
            uri: ${AUTHENTIK_URL}/application/o/home-ops-kguardian/jwks/
resources:
  - ./secret.sops.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./backend.yaml
  - ./httproute.yaml
