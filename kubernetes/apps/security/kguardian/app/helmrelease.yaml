---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 1h
  values:
    # Daily version check-in to the project's endpoint. Nothing here needs it.
    telemetry:
      enabled: false

    database:
      # The bundled postgres Deployment has no backup and no HA; pg-shared has both.
      enabled: false
      user: &db kguardian
      databaseName: *db
      # Minted by components/postgres-shared, which also creates the role and database.
      existingSecret: kguardian-pg-shared
      passwordSecretKey: password
      external:
        host: pg-shared-pooler-rw.database.svc.cluster.local
        # CNPG serves a self-signed certificate, so encrypt without verifying.
        sslMode: require

    ai:
      # Schedules the llm-bridge, which is what serves /mcp. No provider is set,
      # so the assistant stays dark and nothing calls out to a vendor.
      enabled: true
      mcp:
        enabled: true
        auth:
          existingSecret: kguardian-mcp-token

    llmBridge:
      # The /mcp rate limit counts per replica, and one is plenty for a single client.
      replicaCount: 1

    broker:
      metrics:
        serviceMonitor:
          # The only component that actually serves /metrics today.
          enabled: true
      # Every CronJob run is a new pod and a new Job "workload", and both
      # windows default to 30 days. The runtime-coverage pass scans a
      # namespace's pod_details rows once per container row, so that history
      # ended up dominating pg-shared's load.
      podInventory:
        retention:
          # Dead pods only back listings; traffic rows keep their resolved peer.
          deadPodDays: 3
      imageInventory:
        retention:
          # Also the "ran recently" history behind CVE exposure, so not shorter.
          days: 7

    # Audit-only: reports flows an AuditNetworkPolicy would have denied, never blocks.
    evaluator:
      enabled: true

  postRenderers:
    # The chart's ServiceMonitor selects app.kubernetes.io/name, which its own
    # Service does not carry, so the scrape pool discovers nothing.
    - kustomize:
        patches:
          - target:
              kind: Service
              name: kguardian-broker
            patch: |-
              - op: add
                path: /metadata/labels/app.kubernetes.io~1name
                value: kguardian-broker
          # The profile snapshotter keeps taking batches for the whole 300 s
          # interval while candidates remain, and finished Jobs never stop being
          # candidates (workload_syscalls has no retention). One batch of 200
          # per tick still covers every live workload, which sort first. The
          # chart has no value for it.
          - target:
              kind: Deployment
              name: kguardian-broker
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: PROFILE_SNAPSHOT_TICK_BUDGET_SECS
                  value: "0"
