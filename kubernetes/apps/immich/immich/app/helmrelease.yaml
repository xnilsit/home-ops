---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      # Three controllers off one image, split by IMMICH_WORKERS_*: the `api`
      # worker serves HTTP, and two `microservices` workers share every job
      # queue. Immich has no per-queue routing, so both pick up any job.
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: &serverTag v3.1.0
            env:
              DB_HOSTNAME: &dbHost immich-rw
              DB_PORT: &dbPort 5432
              DB_USERNAME: &dbuser immich
              DB_DATABASE_NAME: *dbuser
              DB_PASSWORD: &dbPassword
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: password
              REDIS_HOSTNAME: &redisHost immich-dragonfly
              REDIS_PORT: &redisPort 6379
              REDIS_PASSWORD: &redisPassword
                valueFrom:
                  secretKeyRef:
                    name: immich-dragonfly-auth
                    key: password
              # Everything the admin UI would otherwise own lives in this file,
              # which is what makes those pages read-only.
              IMMICH_CONFIG_FILE: &configFile /config/immich-config.yaml
              IMMICH_PORT: &serverPort 2283
              # HTTP only. Without this the pod would also run the job workers
              # and compete with the two below.
              IMMICH_WORKERS_INCLUDE: api
            probes:
              liveness: &serverProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *serverPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *serverProbes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *serverPort
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              # No GPU: the api worker never transcodes, so claiming an i915
              # slot would only keep it off the AMD node for nothing.
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi
      microservices:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: *serverTag
            env:
              DB_HOSTNAME: *dbHost
              DB_PORT: *dbPort
              DB_USERNAME: *dbuser
              DB_DATABASE_NAME: *dbuser
              DB_PASSWORD: *dbPassword
              REDIS_HOSTNAME: *redisHost
              REDIS_PORT: *redisPort
              REDIS_PASSWORD: *redisPassword
              IMMICH_CONFIG_FILE: *configFile
              IMMICH_WORKERS_EXCLUDE: &noApi api
            probes: &noProbes
              # A microservices worker serves no HTTP, so the chart's default
              # TCP probes would never pass.
              liveness: {enabled: false}
              readiness: {enabled: false}
              startup: {enabled: false}
            securityContext: *securityContext
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 8Gi
                # QSV, and also what places this pod: the plugin advertises the
                # resource only where an Intel GPU exists. A hostPath /dev/dri
                # does NOT work - the node is visible but the container's device
                # cgroup denies open() with EPERM, silently.
                gpu.intel.com/i915: 1
      microservices-cpu:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  # kube-srv-02, the 16-thread Ryzen. Keyed off the amdgpu
                  # extension because it is the only stable label unique to that
                  # node - the GPU itself is deliberately NOT claimed, since
                  # measured on this hardware libx264 ultrafast beats VAAPI on
                  # wall time and this pod exists to spend CPU.
                  - matchExpressions:
                      - key: extensions.talos.dev/amdgpu
                        operator: Exists
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: *serverTag
            env:
              DB_HOSTNAME: *dbHost
              DB_PORT: *dbPort
              DB_USERNAME: *dbuser
              DB_DATABASE_NAME: *dbuser
              DB_PASSWORD: *dbPassword
              REDIS_HOSTNAME: *redisHost
              REDIS_PORT: *redisPort
              REDIS_PASSWORD: *redisPassword
              IMMICH_CONFIG_FILE: *configFile
              IMMICH_WORKERS_EXCLUDE: *noApi
            probes: *noProbes
            securityContext: *securityContext
            resources:
              requests:
                cpu: 1
                memory: 1Gi
              limits:
                # A CPU limit, against the repo's usual habit, and deliberate:
                # ffmpeg and libvips will each take every thread they are
                # offered, and this node also hosts a Postgres instance and a
                # Dragonfly replica.
                cpu: 6
                memory: 8Gi
      machine-learning:
        # One per Intel node when there is work. Each replica claims its own
        # iGPU, and the model cache is RWX so the second starts against models
        # already on disk. Replica count is the HPA's, not this chart's - see
        # ./hpa.yaml; a helm upgrade resets it to 1 and the HPA scales it back.
        pod:
          topologySpreadConstraints:
            # DoNotSchedule, not ScheduleAnyway: with exactly two eligible
            # nodes the whole point is one replica each, and stacking both on
            # one node leaves the other iGPU idle - which is the state this
            # replaces.
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: immich
                  app.kubernetes.io/controller: machine-learning
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              # Moves in lockstep with the server tag above.
              tag: v3.1.0-openvino
            env:
              MACHINE_LEARNING_CACHE_FOLDER: &cache /cache
              HF_HOME: *cache
              MPLCONFIGDIR: /cache/matplotlib
              # OpenVINO compiles the graph on first use, and on a 32 EU iGPU
              # that outruns the default worker timeout.
              MACHINE_LEARNING_WORKER_TIMEOUT: 600
              MACHINE_LEARNING_PORT: &mlPort 3003
            probes:
              liveness: &mlProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *mlPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *mlProbes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *mlPort
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext: *securityContext
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 10Gi
                # Without it OpenVINO enumerates ['CPU'] and Immich falls back
                # to CPU inference, logging the choice only at debug level.
                gpu.intel.com/i915: 1
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # 1000, not root: kopiur's mover is runAsNonRoot and has to be able to
        # read the library it snapshots.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      library:
        # Provisioned by components/kopiur/backup through its Restore
        # populator, so a rebuilt cluster refills it from the newest snapshot.
        existingClaim: immich
        advancedMounts:
          # The api worker serves originals from here; both microservices
          # workers write thumbnails and transcodes into it.
          server: &libraryMount
            app:
              - path: /usr/src/app/upload
          microservices: *libraryMount
          microservices-cpu: *libraryMount
      cache:
        existingClaim: immich-ml-cache
        advancedMounts:
          machine-learning:
            app:
              - path: *cache
      config:
        type: secret
        name: immich-config
        advancedMounts:
          server: &configMount
            app:
              - path: /config
                readOnly: true
          microservices: *configMount
          microservices-cpu: *configMount
    service:
      app:
        controller: server
        ports:
          http:
            port: *serverPort
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: *mlPort
    route:
      app:
        hostnames:
          - "immich.${SECRET_DOMAIN}"
        # envoy-external-direct, not envoy-external: the Cloudflare tunnel caps
        # request bodies at 100 MB, which Immich's unchunked video uploads trip.
        # The direct gateway is public through a UniFi port-forward instead, and
        # k8s-gateway still answers this hostname with its LAN address.
        parentRefs:
          - name: envoy-external-direct
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *serverPort
