---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        pod: &gpuPod
          # Exists, NOT the label's value: it is
          # extensions.talos.dev/i915=<date>-<talos version> and changes on
          # every Talos upgrade. Required rather than preferred, because a
          # hostPath /dev/dri mount succeeds on the AMD node too and would
          # hand the container a render node QSV and OpenVINO cannot use.
          #
          # Break-glass to CPU-only: drop this pod block and the -openvino
          # image suffix below.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: extensions.talos.dev/i915
                        operator: Exists
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0
            env:
              DB_HOSTNAME: immich-rw
              DB_PORT: 5432
              DB_USERNAME: &dbuser immich
              DB_DATABASE_NAME: *dbuser
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: password
              REDIS_HOSTNAME: immich-dragonfly
              REDIS_PORT: 6379
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-dragonfly-auth
                    key: password
              # Everything the admin UI would otherwise own lives in this file,
              # which is what makes those pages read-only.
              IMMICH_CONFIG_FILE: /config/immich-config.yaml
              IMMICH_PORT: &serverPort 2283
            probes:
              liveness: &serverProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *serverPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *serverProbes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *serverPort
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 8Gi
      machine-learning:
        pod: *gpuPod
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              # Moves in lockstep with the server tag above.
              tag: v3.1.0-openvino
            env:
              MACHINE_LEARNING_CACHE_FOLDER: &cache /cache
              HF_HOME: *cache
              MPLCONFIGDIR: /cache/matplotlib
              # OpenVINO compiles the graph on first use, and on a 32 EU iGPU
              # that outruns the default worker timeout.
              MACHINE_LEARNING_WORKER_TIMEOUT: 600
              MACHINE_LEARNING_PORT: &mlPort 3003
            probes:
              liveness: &mlProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *mlPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *mlProbes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *mlPort
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext: *securityContext
            resources:
              requests:
                cpu: 500m
                memory: 3Gi
              limits:
                memory: 10Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # 1000, not root: kopiur's mover is runAsNonRoot and has to be able to
        # read the library it snapshots.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      library:
        # Provisioned by components/kopiur/backup through its Restore
        # populator, so a rebuilt cluster refills it from the newest snapshot.
        existingClaim: immich
        advancedMounts:
          server:
            app:
              - path: /usr/src/app/upload
      cache:
        existingClaim: immich-ml-cache
        advancedMounts:
          machine-learning:
            app:
              - path: *cache
      config:
        type: secret
        name: immich-config
        advancedMounts:
          server:
            app:
              - path: /config
                readOnly: true
      dri:
        type: hostPath
        hostPath: /dev/dri
        hostPathType: Directory
        advancedMounts:
          server:
            app:
              - path: /dev/dri
          machine-learning:
            app:
              - path: /dev/dri
    service:
      app:
        controller: server
        ports:
          http:
            port: *serverPort
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: *mlPort
    route:
      app:
        hostnames:
          - "immich.${SECRET_DOMAIN}"
        # envoy-internal only: the Cloudflare tunnel wildcards
        # *.${SECRET_DOMAIN} onto envoy-external and caps request bodies at
        # 100 MB, which Immich's unchunked video uploads would trip.
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *serverPort
