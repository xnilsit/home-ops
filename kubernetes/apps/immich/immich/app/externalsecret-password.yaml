---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-password
spec:
  length: 40
  digits: 8
  # No symbols: the value also travels as a Postgres URI component.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-postgres
spec:
  # 0 disables refresh. Anything else re-runs the generator and rotates the
  # password under a running Postgres on every interval.
  refreshInterval: "0"
  target:
    name: *secret
    template:
      # CNPG's role reconciler expects basic-auth, and its informer is label
      # filtered - without cnpg.io/reload it never sees this Secret and the
      # DatabaseRole hangs on "password secret not found".
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: ${APP}
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # Name fixed by components/dragonfly, which reads key `password` from it.
  name: &secret ${APP}-dragonfly-auth
spec:
  refreshInterval: "0"
  target:
    name: *secret
    template:
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-password
