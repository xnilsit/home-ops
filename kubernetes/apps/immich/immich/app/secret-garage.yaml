---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: garage-${APP}-backup
  annotations:
    # A barman ObjectStore is namespace-scoped and its s3Credentials are
    # SecretKeySelectors, so the credentials have to exist here.
    reflector.v1.k8s.emberstack.com/reflects: garage/garage-${APP}-backup
type: Opaque
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  # Name fixed by components/dragonfly, which env-injects it for snapshots.
  name: ${APP}-garage-dragonfly-backup
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: garage/garage-dragonfly-backup
type: Opaque
