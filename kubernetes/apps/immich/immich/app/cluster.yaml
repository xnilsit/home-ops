---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP}
  annotations:
    # Required by the recovery bootstrap below: CNPG otherwise refuses to start
    # archiving when the destination prefix already holds WALs.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:${PG_IMAGE_TAG}
  primaryUpdateMethod: switchover

  # local-path is node-local and WaitForFirstConsumer. CNPG replicates at the
  # PostgreSQL layer, so 3 instances give 3 independent copies via streaming
  # replication. A PVC cannot move: a permanently lost node strands its PVC,
  # which must be deleted by hand before CNPG re-provisions elsewhere.
  storage:
    size: 20Gi
    storageClass: local-path

  postgresql:
    # shared_preload_libraries is a CNPG-blocked GUC, hence the dedicated field.
    # A bad path here means the postmaster never starts, not a missing feature.
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      # CNPG's own image, so the flat /lib + /share layout its defaults expect.
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:${PGVECTOR_IMAGE_TAG}
      # Upstream's image is FHS-shaped, so both paths have to be named. Layout
      # and overrides match immich-charts/local/cloudnative-pg.yaml.
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:${VCHORD_IMAGE_TAG}
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
    parameters:
      shared_buffers: 1GB
      effective_cache_size: 3GB
      work_mem: 32MB
      # vchordrq index builds are the only heavy maintenance this cluster does.
      maintenance_work_mem: 512MB
      max_parallel_maintenance_workers: "2"
      wal_compression: "on"

  # Auto-restore, not initdb: recreating this Cluster after total loss (all
  # three node-local PVCs gone) restores from Garage instead of coming up
  # empty. The section is only read at creation, so it is inert while the
  # cluster lives - switching it does NOT restore the running cluster.
  bootstrap:
    recovery:
      source: &archive ${APP}-archive
      database: ${APP}
      owner: ${APP}

  # Read side of the same ObjectStore. serverName is EXPLICIT: for an
  # externalCluster the plugin defaults it to this entry's name, which would
  # point at a prefix that does not exist. It must match the archiver below.
  externalClusters:
    - name: *archive
      plugin:
        enabled: true
        isWALArchiver: false
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: ${APP}-store
          serverName: ${APP}

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ${APP}-store
        # Was implicit - the plugin defaults it to the Cluster name, which is
        # the s3://immich-backup/immich/ prefix the catalog already lives under.
        # Spelled out so the externalCluster above has something to match.
        serverName: ${APP}

  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
