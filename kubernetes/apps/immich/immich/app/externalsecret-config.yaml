---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-config
spec:
  # Immich's whole admin configuration, not just the OAuth half: setting
  # IMMICH_CONFIG_FILE makes every other settings page in the web UI read-only,
  # so anything not declared here reverts to Immich's own default.
  secretStoreRef:
    kind: ClusterSecretStore
    name: tofu-controller
  refreshInterval: 1h
  target:
    name: *secret
    template:
      data:
        immich-config.yaml: |
          backup:
            database:
              # barman archives this cluster to Garage already.
              enabled: false
          ffmpeg:
            accel: qsv
            accelDecode: true
            preferredHwDevice: /dev/dri/renderD128
          job:
            # Doubled from Immich's defaults to match the two ML replicas -
            # at the stock faceDetection 2 / smartSearch 2 / ocr 1 the second
            # iGPU would sit half idle.
            faceDetection:
              concurrency: 4
            smartSearch:
              concurrency: 4
            ocr:
              concurrency: 2
          machineLearning:
            enabled: true
            # One Service in front of both replicas; kube-proxy replacement
            # spreads the calls, so no per-pod URL list.
            urls:
              - http://${APP}-machine-learning:3003
          newVersionCheck:
            enabled: false
          oauth:
            enabled: true
            autoRegister: true
            autoLaunch: false
            buttonText: Login with authentik
            clientId: "{{ .clientId }}"
            clientSecret: "{{ .clientSecret }}"
            issuerUrl: ${AUTHENTIK_URL}/application/o/home-ops-${APP}/
            # offline_access is load-bearing: authentik only issues a refresh
            # token when it is requested, and mobile sessions die at the
            # access-token TTL without one. immich_quota comes from the mapping
            # in tofu/authentik/property-mappings.tf.
            scope: openid email profile offline_access immich_quota
            storageQuotaClaim: immich_quota
            # Only reached when a user is in no group carrying immich_quota.
            defaultStorageQuota: 50
            storageLabelClaim: preferred_username
          passwordLogin:
            # Break-glass for the admin account, which OAuth cannot bootstrap.
            enabled: true
          server:
            externalDomain: https://${APP}.${SECRET_DOMAIN}
  data:
    - secretKey: clientId
      remoteRef:
        # Written by the tofu module into tofu-controller.
        key: ${APP}-oidc
        property: client-id
    - secretKey: clientSecret
      remoteRef:
        key: ${APP}-oidc
        property: client-secret
