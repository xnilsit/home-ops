---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-config
spec:
  # Immich's whole admin configuration, not just the OAuth half: setting
  # IMMICH_CONFIG_FILE makes every other settings page in the web UI read-only,
  # so anything not declared here reverts to Immich's own default.
  secretStoreRef:
    kind: ClusterSecretStore
    name: tofu-controller
  refreshInterval: 1h
  target:
    name: *secret
    template:
      data:
        immich-config.yaml: |
          backup:
            database:
              # barman archives this cluster to Garage already.
              enabled: false
          ffmpeg:
            accel: qsv
            accelDecode: true
            preferredHwDevice: /dev/dri/renderD128
          machineLearning:
            enabled: true
            urls:
              - http://${APP}-machine-learning:3003
          newVersionCheck:
            enabled: false
          oauth:
            enabled: true
            autoRegister: true
            autoLaunch: false
            buttonText: Login with authentik
            clientId: "{{ .clientId }}"
            clientSecret: "{{ .clientSecret }}"
            issuerUrl: ${AUTHENTIK_URL}/application/o/home-ops-${APP}/
            # offline_access is load-bearing: authentik only issues a refresh
            # token when it is requested, and mobile sessions die at the
            # access-token TTL without one. immich_quota is deliberately NOT
            # here - authentik rejects an authorize request for a scope with no
            # mapping behind it, and that mapping cannot be created by the tofu
            # token (see tofu/authentik/property-mappings.tf). Add it in the
            # same change that flips immich_quota_scope.
            scope: openid email profile offline_access
            storageQuotaClaim: immich_quota
            # The 50 GiB every OAuth-created user gets while the claim is
            # absent. Same number as the immich group's attribute.
            defaultStorageQuota: 50
            storageLabelClaim: preferred_username
          passwordLogin:
            # Break-glass for the admin account, which OAuth cannot bootstrap.
            enabled: true
          server:
            externalDomain: https://${APP}.${SECRET_DOMAIN}
  data:
    - secretKey: clientId
      remoteRef:
        # Written by the tofu module into tofu-controller.
        key: ${APP}-oidc
        property: client-id
    - secretKey: clientSecret
      remoteRef:
        key: ${APP}-oidc
        property: client-secret
