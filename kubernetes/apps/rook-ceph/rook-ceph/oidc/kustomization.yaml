---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # Split out of ../cluster so the authentik chain does not end up gating
  # storage: rook-ceph-cluster is wait: true and half the cluster dependsOn it.
  - ../../../../components/oidc
patches:
  # Targeted by kind rather than name: postBuild substitution has not run yet at
  # build time, so the SecurityPolicy is still literally named ${APP}-oidc. This
  # overlay renders exactly one.
  - target:
      kind: SecurityPolicy
    patch: |-
      # The ceph dashboard is the only app here that logs the user in itself
      # rather than just sitting behind the gate, so it needs the IdP's token -
      # and specifically the ACCESS token. Envoy re-issues that one on every
      # refresh; the id token it keeps as first issued, and the dashboard
      # rejects an expired token on every secured endpoint while still
      # accepting it at /auth/oauth2/login, which turns into a login loop.
      #
      # Handed over as the cookie named `token`, the first place the dashboard
      # looks. There is no way to put the access token in a header of our
      # choosing: forwardAccessToken only ever writes Authorization, which the
      # dashboard does not read in this mode.
      - op: add
        path: /spec/oidc/cookieNames
        value:
          accessToken: token
      # Envoy encrypts cookie values by default, and the dashboard has to be
      # able to decode the JWT. The cookie stays HttpOnly, Secure and scoped to
      # this host, which is what the dashboard's own session cookie would be.
      - op: add
        path: /spec/oidc/disableTokenEncryption
        value: true
      # The dashboard's own logout button 302s to /oauth2/sign_out, so that is
      # the path the filter has to own here.
      - op: replace
        path: /spec/oidc/logoutPath
        value: /oauth2/sign_out
