---
# DO NOT EDIT BY HAND. Rendered from the ceph-csi-drivers Helm chart.
#
# Rook v1.20 stopped deploying the CSI drivers itself; they now come from the
# ceph-csi-drivers chart, which upstream publishes only to an HTTP Helm repo
# (https://ceph.github.io/ceph-csi-operator) with no OCI mirror. Rather than add
# a HelmRepository source, the chart output is vendored here.
#
# Chart version: ceph-csi-drivers 1.0.4 (bundled with rook-ceph v1.20.3)
# Values:        ./values.yaml
#
# Re-render when bumping rook-ceph:
#   helm repo add ceph-csi-operator https://ceph.github.io/ceph-csi-operator
#   helm template ceph-csi-drivers ceph-csi-operator/ceph-csi-drivers \
#     --version <version> -n rook-ceph -f values.yaml
# then split the output into ./rbac.yaml and ./driver.yaml.
---
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.cephfs.csi.ceph.com
  namespace: rook-ceph
spec:
  log:
    verbosity: 0
  clusterName: rook-ceph
  enableFencing: false
  grpcTimeout: 30
  snapshotPolicy: volumeSnapshot
  generateOMapInfo: false
  fsGroupPolicy: File
  attachRequired: true
  deployCsiAddons: false
  cephFsClientType: kernel
  kernelMountOptions:
    ms_mode: secure
  fuseMountOptions: {}
  nodePlugin:
    serviceAccountName: rook-ceph-cephfs-csi-ceph-com-nodeplugin-sa
    resources:
      registrar:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 5m
          memory: 64Mi
      liveness: {}
      addons: {}
      logRotator: {}
      plugin:
        limits:
          cpu: 200m
          memory: 192Mi
        requests:
          cpu: 10m
          memory: 64Mi
    tolerations: []
    volumes: []
  controllerPlugin:
    serviceAccountName: rook-ceph-cephfs-csi-ceph-com-ctrlplugin-sa
    hostNetwork: false
    replicas: 2
    resources:
      attacher:
        limits:
          cpu: 100m
          memory: 64Mi
        requests:
          cpu: 5m
          memory: 32Mi
      snapshotter:
        limits:
          cpu: 100m
          memory: 32Mi
        requests:
          cpu: 5m
          memory: 16Mi
      resizer:
        limits:
          cpu: 100m
          memory: 96Mi
        requests:
          cpu: 5m
          memory: 48Mi
      provisioner:
        limits:
          cpu: 100m
          memory: 32Mi
        requests:
          cpu: 5m
          memory: 16Mi
      omapGenerator: {}
      liveness: {}
      addons: {}
      logRotator: {}
      plugin:
        limits:
          cpu: 200m
          memory: 96Mi
        requests:
          cpu: 15m
          memory: 48Mi
    privileged: false
    tolerations: []
    volumes: []

