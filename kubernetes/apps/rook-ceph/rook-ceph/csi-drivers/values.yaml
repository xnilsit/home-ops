---
# Input values for rendering ./rbac.yaml and ./driver.yaml. Not applied by Flux;
# kept in git so the render is reproducible. See the header in ./driver.yaml.
#
# Migrated from the rook-ceph operator chart's `csi:` values, which Rook v1.20
# removed. Several settings deliberately override chart defaults to preserve the
# behaviour Rook v1.19 had configured:
#   - snapshotPolicy: the chart defaults RBD to "none", which would drop the
#     csi-snapshotter sidecar and break VolumeSnapshots.
#   - log.rotation.enabled=false: the chart would otherwise add a log-rotator
#     sidecar that Rook never ran here.
#   - controllerPlugin hostNetwork/replicas/deploymentStrategy: matched to the
#     values Rook wrote, so Flux co-owns the fields instead of conflicting.
#   - nodePlugin.imagePullPolicy="": omits the field, leaving Rook's value.
# `nodePlugin.resources` is undocumented in the chart's values table but is
# rendered by templates/driver.yaml.
operatorConfig:
  namespace: rook-ceph
  driverSpecDefaults:
    imageSet:
      name: rook-csi-operator-image-set-configmap
    snapshotPolicy: volumeSnapshot
    log:
      rotation:
        enabled: false
    nodePlugin:
      priorityClassName: system-node-critical
    controllerPlugin:
      priorityClassName: system-cluster-critical
      hostNetwork: true
      replicas: 2
      deploymentStrategy:
        type: Recreate
drivers:
  rbd:
    enabled: true
    name: rook-ceph.rbd.csi.ceph.com
    clusterName: rook-ceph
    snapshotPolicy: volumeSnapshot
    log:
      rotation:
        enabled: false
    controllerPlugin:
      replicas: 2
      resources:
        provisioner: {requests: {memory: 16Mi, cpu: 5m}, limits: {memory: 32Mi, cpu: 100m}}
        resizer: {requests: {memory: 48Mi, cpu: 5m}, limits: {memory: 96Mi, cpu: 100m}}
        attacher: {requests: {memory: 32Mi, cpu: 5m}, limits: {memory: 64Mi, cpu: 100m}}
        snapshotter: {requests: {memory: 16Mi, cpu: 5m}, limits: {memory: 32Mi, cpu: 100m}}
        plugin: {requests: {memory: 48Mi, cpu: 15m}, limits: {memory: 96Mi, cpu: 200m}}
    nodePlugin:
      imagePullPolicy: ""
      resources:
        registrar: {requests: {memory: 64Mi, cpu: 5m}, limits: {memory: 128Mi, cpu: 100m}}
        plugin: {requests: {memory: 64Mi, cpu: 10m}, limits: {memory: 192Mi, cpu: 200m}}
  cephfs:
    enabled: true
    name: rook-ceph.cephfs.csi.ceph.com
    clusterName: rook-ceph
    snapshotPolicy: volumeSnapshot
    log:
      rotation:
        enabled: false
    controllerPlugin:
      replicas: 2
      resources:
        provisioner: {requests: {memory: 16Mi, cpu: 5m}, limits: {memory: 32Mi, cpu: 100m}}
        resizer: {requests: {memory: 48Mi, cpu: 5m}, limits: {memory: 96Mi, cpu: 100m}}
        attacher: {requests: {memory: 32Mi, cpu: 5m}, limits: {memory: 64Mi, cpu: 100m}}
        snapshotter: {requests: {memory: 16Mi, cpu: 5m}, limits: {memory: 32Mi, cpu: 100m}}
        plugin: {requests: {memory: 48Mi, cpu: 15m}, limits: {memory: 96Mi, cpu: 200m}}
    nodePlugin:
      imagePullPolicy: ""
      resources:
        registrar: {requests: {memory: 64Mi, cpu: 5m}, limits: {memory: 128Mi, cpu: 100m}}
        plugin: {requests: {memory: 64Mi, cpu: 10m}, limits: {memory: 192Mi, cpu: 200m}}
  nfs:
    enabled: false
    name: rook-ceph.nfs.csi.ceph.com
  nvmeof:
    enabled: false
    name: rook-ceph.nvmeof.csi.ceph.com
