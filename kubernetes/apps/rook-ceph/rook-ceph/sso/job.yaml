---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: rook-ceph-sso
  annotations:
    # The script is not a Flux substitution target, and exempting it means a
    # later edit cannot lose a shell $VAR to envsubst.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  backoffLimit: 6
  # No ttlSecondsAfterFinished: if the Job were garbage-collected, Flux would
  # recreate it on the next reconcile and it would re-run every hour.
  template:
    spec:
      restartPolicy: OnFailure
      # The same account the toolbox runs under; nothing here touches the API.
      serviceAccountName: rook-ceph-default
      securityContext:
        runAsNonRoot: true
        # 167 is the ceph uid in quay.io/ceph/ceph
        runAsUser: 167
        runAsGroup: 167
        fsGroup: 167
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ceph
          # Client major must match the mons. Kept in step with the cephImage in
          # ../cluster/helmrelease.yaml - it is the same package, so Renovate
          # bumps both in one PR.
          image: quay.io/ceph/ceph:v21.1.0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # Same two inputs the toolbox assembles a client config from: the
              # mon endpoints ConfigMap, whose value is `<name>=<ip:port>` pairs
              # that ceph wants without the names, and the admin key. Both are
              # written under /tmp and passed explicitly, so the root filesystem
              # can stay read-only.
              #
              # Read into variables first, on their own lines: a $(...) that
              # fails inside a heredoc does not trip errexit, so an unreadable
              # secret would otherwise write a malformed keyring and surface as
              # a confusing parse error further down. Shell variables are safe
              # here because the substitute annotation keeps envsubst off this
              # script.
              CEPH_USER="$(cat /var/lib/rook-ceph-mon/username)"
              CEPH_KEY="$(cat /var/lib/rook-ceph-mon/secret.keyring)"
              MON_HOST="$(sed 's/[a-z0-9_-]\+=//g' /etc/rook/mon-endpoints)"

              cat >/tmp/ceph.conf <<EOF
              [global]
              mon_host = $MON_HOST
              EOF

              cat >/tmp/keyring <<EOF
              [$CEPH_USER]
              key = $CEPH_KEY
              EOF

              ceph() {
                command ceph -c /tmp/ceph.conf -n "$CEPH_USER" \
                  -k /tmp/keyring "$@"
              }

              # roles_path is a jmespath expression the dashboard runs over the
              # token to decide the user's roles. A constant list rather than a
              # lookup into the token: authentik's policy binding already decides
              # who arrives, and reading a group claim would answer 403 whenever
              # that claim went missing. The inner quotes are jmespath's
              # raw-string literal.
              ROLES_PATH="['administrator']"

              # Sets protocol plus the mgr/dashboard/sso_oauth2 module option,
              # and applies ROLES_PATH to the running mgr.
              ceph dashboard sso enable oauth2 "$ROLES_PATH"

              # ...but does not persist it. SsoDB.save() serialises
              # self.config, which `sso enable oauth2` leaves as the Saml2
              # instance loaded at startup, and Saml2.to_dict() returns only
              # onelogin_settings - so roles_path lives in memory and dies with
              # the mgr, after which every request is a 403. Write the record
              # the shape SsoDB.load() expects instead.
              python3 - "$ROLES_PATH" >/tmp/ssodb.json <<'PY'
              import json, sys
              json.dump({
                  "protocol": "oauth2",
                  "saml2": {"onelogin_settings": {}},
                  "oauth2": {"roles_path": sys.argv[1]},
                  "version": 1,
              }, sys.stdout)
              PY
              ceph config-key set mgr/dashboard/ssodb_v1 -i /tmp/ssodb.json

              ceph dashboard sso status
          env:
            # The image's home for uid 167 is /var/lib/ceph, which is not
            # writable here. Nothing should want a home, but readOnlyRootFilesystem
            # turns "should not" into a crash.
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: mon-endpoint-volume
              mountPath: /etc/rook
              readOnly: true
            - name: ceph-admin-secret
              mountPath: /var/lib/rook-ceph-mon
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
      volumes:
        - name: mon-endpoint-volume
          configMap:
            name: rook-ceph-mon-endpoints
            items:
              - key: data
                path: mon-endpoints
        - name: ceph-admin-secret
          secret:
            secretName: rook-ceph-mon
            items:
              - key: ceph-username
                path: username
              - key: ceph-secret
                path: secret.keyring
        - name: tmp
          emptyDir: {}
