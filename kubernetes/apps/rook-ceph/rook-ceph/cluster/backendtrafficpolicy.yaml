---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: ceph-rgw
spec:
  # Inherits the rest of BackendTrafficPolicy/envoy in envoy-gateway/app/envoy.yaml.
  # JSONMerge, not StrategicMerge: the latter appends rate limit rules to the
  # gateway's, so its 1200/min would still apply; JSONMerge replaces the list.
  # Gokapi's uploads alone send ~13 S3 parts/s.
  mergeType: JSONMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ceph-rgw
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 6000
            unit: Minute
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 6000
            unit: Minute
