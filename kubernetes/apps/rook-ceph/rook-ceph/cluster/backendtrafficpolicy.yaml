---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: ceph-rgw
spec:
  # Replaces BackendTrafficPolicy/envoy in envoy-gateway/app/envoy.yaml rather than
  # merging with it: merged rate limits stack, so the gateway's 1200/min would still
  # apply. Gokapi's uploads alone send ~13 S3 parts/s. No compressor: objects are
  # served as stored.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ceph-rgw
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 6000
            unit: Minute
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 6000
            unit: Minute
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
