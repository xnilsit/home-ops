---
# Two bucket StorageClasses for the one CephObjectStore, differing only in
# reclaimPolicy. The rook-ceph-cluster chart renders at most one StorageClass
# per entry in cephObjectStores, so these are written by hand and
# storageClass.enabled is false in helmrelease.yaml.
#
# reclaimPolicy is baked into the ObjectBucket at provision time, so an existing
# bucket keeps the policy it was created with - moving an OBC to the other class
# after it is Bound does nothing. Pick the class when the claim is created.
#
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-definitions.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-bucket-retain
# Deleting the OBC leaves the bucket and its objects in RGW. The default choice
# for anything holding data worth keeping: a deleted claim - by a bad
# `flux prune`, a renamed app, a fat-fingered `kubectl delete` - costs a manual
# cleanup instead of the data.
reclaimPolicy: Retain
provisioner: rook-ceph.ceph.rook.io/bucket
volumeBindingMode: Immediate
parameters:
  objectStoreName: ceph-objectstore
  objectStoreNamespace: rook-ceph
  region: us-east-1
---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-definitions.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-bucket-delete
# Deleting the OBC purges the bucket and every object in it. Only for buckets
# whose contents are reproducible - scratch space, benchmark data, caches.
reclaimPolicy: Delete
provisioner: rook-ceph.ceph.rook.io/bucket
volumeBindingMode: Immediate
parameters:
  objectStoreName: ceph-objectstore
  objectStoreNamespace: rook-ceph
  region: us-east-1
---
# RBD on HDD. Image metadata (header, id, object map, omap) lives in the flash
# ceph-blockpool and only the data objects go to ceph-blockpool-hdd, so opens,
# snapshots and the object map stay fast. Hand-written because the chart
# hardcodes pool to the entry's own name and can't set both. Parameters
# mirror the chart-rendered ceph-block class.
#
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-definitions.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-block-hdd
provisioner: rook-ceph.rbd.csi.ceph.com
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - discard
parameters:
  clusterID: rook-ceph
  pool: ceph-blockpool
  dataPool: ceph-blockpool-hdd
  imageFormat: "2"
  imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
---
# CephFS on HDD: subvolumes get a file layout on the hdd0 data pool. The MDS
# metadata pool and the default data0 pool (which holds every file's
# backtrace) stay on flash. Hand-written because the chart renders one class
# per filesystem.
#
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-definitions.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-filesystem-hdd
provisioner: rook-ceph.cephfs.csi.ceph.com
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  clusterID: rook-ceph
  fsName: ceph-filesystem
  pool: ceph-filesystem-hdd0
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
