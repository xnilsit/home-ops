---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.20.6
  url: oci://ghcr.io/rook/rook-ceph-cluster
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: volsync
      namespace: storage
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
      prometheusRuleOverrides:
        CephNodeDiskspaceWarning: # So many false positives
          disabled: true
        CephPoolGrowthWarning: # Causing errors in VMAlert
          disabled: true
        CephNodeNetworkPacketDrops:
          disabled: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: "rook.${CLUSTER_DOMAIN}"
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network

    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.4

    cephClusterSpec:
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-vmetrics.observability.svc.cluster.local:8428
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          # PG budget on 3 OSDs. Every pool is bounded - the RGW pools pinned at
          # both ends, the CephFS pools capped by pg_num_max - so the autoscaler
          # has little left to move and the target below is largely advisory.
          # That matters: leaving the RGW data pool unbounded with bulk set took
          # it to 512 PGs and tripped "too many PGs per OSD".
          #
          # Steady state: 32x7 rgw metadata + 256 rgw data + 32 blockpool
          # + 16 cephfs metadata + 32 cephfs data + 1 mgr, at size 3 across
          # 3 OSDs = ~561 PGs/OSD, up from a measured 217. Both defaults
          # (250 guard, 100 target) would block this outright.
          #
          # The target sits above the landing point on purpose so the autoscaler
          # is not permanently trying to shrink, and the guard above that with
          # room for the transient 625 to merge back down without tripping a
          # warning. A high target was only dangerous while the bulk data pool
          # was unbounded; pg_num_max now bounds it.
          # Each PG costs OSD memory - watch osd_memory_target under pressure.
          mon_max_pg_per_osd: "800" # quote
          mon_target_pg_per_osd: "600" # quote
          # Cant enable due to `Module 'diskprediction_local' has failed: No module named 'sklearn.svm.classes'`
          # device_failure_prediction_mode: local # requires mgr module
        mgr:
          log_max_recent: "100"
        client:
          rgw_realm: ceph-objectstore
          rgw_zonegroup: ceph-objectstore
          rgw_zone: ceph-objectstore
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
        # confirmation: "yes-really-destroy-data"
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      healthCheck:
        muteHealthWarning: # Tentacle cephx warnings; daemon keys not pinned to aes
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      mgr:
        modules:
          # Cant enable due to `Module 'diskprediction_local' has failed: No module named 'sklearn.svm.classes'`
          - name: diskprediction_local
            enabled: false
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: false
          - name: stats
            enabled: true
      network:
        provider: host
        connections:
          requireMsgr2: true
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration # bump keyGeneration to rotate
            keyGeneration: 2
          csi:
            keyRotationPolicy: KeyGeneration
            keepPriorKeyCountMax: 1
            keyGeneration: 2
            keyType: aes
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
      storage:
        useAllNodes: false
        useAllDevices: false
        # devicePathFilter: "/dev/disk/by-id/(ata-SAMSUNG_MZ7KM|ata-SSDSC2KG480G8R_PHY|ata-SAMSUNG_MZ7LH)*" # List these with: `talosctl get disks` then get name of disk and do `talosctl get disk diskname -o yaml` and check spec.symlinks
        nodes:
          - name: "kube-srv-01"
            devices:
              - name: "/dev/disk/by-partlabel/r-osd-01" # Samsung PM963 1.92TB SATA
          - name: "kube-srv-02"
            devices:
              - name: "/dev/disk/by-partlabel/r-osd-01" # Samsung PM983 1.92TB NVME
          - name: "kube-srv-03"
            devices:
              - name: "/dev/disk/by-partlabel/r-osd-01" # Samsung PM963 1.92TB SATA
        config:
          osdsPerDevice: "1"
      resources:
        mgr:
          limits:
            memory: 1Gi
          requests:
            memory: 700Mi
            cpu: 100m
        mon:
          limits:
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 768Mi
        osd:
          limits:
            memory: 6Gi
          requests:
            cpu: 150m
            memory: 6Gi
        prepareosd:
          limits:
            memory: 3000Mi
          requests:
            cpu: 50m
            memory: 200Mi
        mgr-sidecar:
          limits:
            memory: 100Mi
          requests:
            cpu: 50m
            memory: 40Mi
        crashcollector:
          limits:
            memory: 64M
          requests:
            cpu: 15m
            memory: 32M
        logcollector:
          limits:
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 16Mi
        cleanup:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 100Mi
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - "discard"
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4

    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      mountOptions:
        - "discard"

    cephFileSystems:
      - name: ceph-filesystem
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
            parameters:
              # Metadata is small but latency-sensitive; 16 PGs keeps the MDS
              # omap work spread without adding much to the PG budget above.
              pg_num_min: "16"
          dataPools:
            - name: data0
              failureDomain: host
              replicated:
                size: 3
              parameters:
                # Not bulk: unlike the RGW data pool this one starts empty and
                # grows slowly, so the autoscaler ramping is fine. pg_num_max
                # keeps it from repeating the 512-PG overshoot the object store
                # data pool hit.
                pg_num_max: "128"
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 2Gi
        storageClass:
          enabled: true
          name: ceph-filesystem
          isDefault: false
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4

    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete

    cephObjectStores:
      - name: ceph-objectstore
        spec:
          # Replicated 3, not the chart default EC 2+1: with failureDomain host
          # and only 3 hosts, EC 2+1 has as many chunks as failure domains, so a
          # host loss leaves the pool degraded with nowhere to backfill.
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
            parameters:
              # Applies to all six metadata pools (rgw.control, rgw.meta,
              # rgw.log, rgw.buckets.index, rgw.buckets.non-ec, rgw.otp) plus
              # .rgw.root - CephObjectStore has no per-pool override.
              #
              # pg_num_min does NOT work here. Rook re-asserts pg_num_min: 8 on
              # these pools immediately after applying our parameters, on every
              # reconcile (it has rgwRadosPoolPgNum = "8" baked in), which then
              # let the autoscaler merge pg_num 32 straight back down to 8.
              # Turning the autoscaler off is what makes 32 stick: pg_num_min
              # only guides the autoscaler, so Rook clobbering it stops
              # mattering. Trade-off is that these pools no longer autoscale, so
              # future growth needs an explicit pg_num change here.
              pg_num: "32"
              pg_autoscale_mode: "off"
          dataPool:
            failureDomain: host
            replicated:
              size: 3
            parameters:
              # bulk tells the autoscaler to assume this pool will grow large, so
              # it jumps straight to the full target instead of ramping. Combined
              # with mon_target_pg_per_osd it took this pool to 512 PGs (1536
              # PG-replicas) for a few MB of backups and tripped
              # "too many PGs per OSD". pg_num_max bounds it; pg_num brings it
              # back down, since pg_num_max alone only caps future growth.
              bulk: "true"
              pg_num: "256"
              pg_num_max: "256"
          preservePoolsOnDelete: true
          gateway:
            port: 80
            instances: 2
            priorityClassName: system-cluster-critical
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 1Gi
        # Disabled: the chart renders at most one StorageClass per object store,
        # and this store needs two (ceph-bucket-retain / ceph-bucket-delete).
        # Both live in ./storageclass.yaml so the reclaimPolicy difference - the
        # only thing separating them - is visible side by side.
        storageClass:
          enabled: false
