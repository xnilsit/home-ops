---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.20.3
  url: oci://ghcr.io/rook/rook-ceph-cluster
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: volsync
      namespace: storage
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
      prometheusRuleOverrides:
        CephNodeDiskspaceWarning: # So many false positives
          disabled: true
        CephPoolGrowthWarning: # Causing errors in VMAlert
          disabled: true
        CephNodeNetworkPacketDrops:
          disabled: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: "rook.${CLUSTER_DOMAIN}"
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network

    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.3

    cephClusterSpec:
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-vmetrics.observability.svc.cluster.local:8428
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          # PG budget on 3 OSDs. Every pool is pinned at both ends - metadata
          # via pg_num_min, the RGW data pool via pg_num_max - so the autoscaler
          # has nothing left to move and the target below is effectively
          # advisory. That matters: leaving the data pool unbounded with bulk
          # set took it to 512 PGs and tripped "too many PGs per OSD".
          #
          # Steady state: 32x7 metadata + 256 data + 32 blockpool + 1 mgr,
          # at size 3 across 3 OSDs = ~513 PGs/OSD, up from a measured 217.
          # The guard sits above that with room for transient splits; both
          # defaults (250 guard, 100 target) would block this outright.
          # Each PG costs OSD memory - watch osd_memory_target under pressure.
          mon_max_pg_per_osd: "700" # quote
          mon_target_pg_per_osd: "400" # quote
          # Cant enable due to `Module 'diskprediction_local' has failed: No module named 'sklearn.svm.classes'`
          # device_failure_prediction_mode: local # requires mgr module
        mgr:
          log_max_recent: "100"
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
        # confirmation: "yes-really-destroy-data"
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      mgr:
        modules:
          # Cant enable due to `Module 'diskprediction_local' has failed: No module named 'sklearn.svm.classes'`
          - name: diskprediction_local
            enabled: false
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: false
          - name: stats
            enabled: true
      network:
        provider: host
        connections:
          requireMsgr2: true
      storage:
        useAllNodes: false
        useAllDevices: false
        # devicePathFilter: "/dev/disk/by-id/(ata-SAMSUNG_MZ7KM|ata-SSDSC2KG480G8R_PHY|ata-SAMSUNG_MZ7LH)*" # List these with: `talosctl get disks` then get name of disk and do `talosctl get disk diskname -o yaml` and check spec.symlinks
        nodes:
          - name: "kube-srv-01"
            devices:
              - name: "/dev/disk/by-partlabel/r-osd-01" # Samsung PM963 1.92TB SATA
          - name: "kube-srv-02"
            devices:
              - name: "/dev/disk/by-partlabel/r-osd-01" # Samsung PM983 1.92TB NVME
          - name: "kube-srv-03"
            devices:
              - name: "/dev/disk/by-partlabel/r-osd-01" # Samsung PM963 1.92TB SATA
        config:
          osdsPerDevice: "1"
      resources:
        mgr:
          limits:
            memory: 1Gi
          requests:
            memory: 700Mi
            cpu: 100m
        mon:
          limits:
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 768Mi
        osd:
          limits:
            memory: 6Gi
          requests:
            cpu: 150m
            memory: 6Gi
        prepareosd:
          limits:
            memory: 3000Mi
          requests:
            cpu: 50m
            memory: 200Mi
        mgr-sidecar:
          limits:
            memory: 100Mi
          requests:
            cpu: 50m
            memory: 40Mi
        crashcollector:
          limits:
            memory: 64M
          requests:
            cpu: 15m
            memory: 32M
        logcollector:
          limits:
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 16Mi
        cleanup:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 100Mi
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - "discard"
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4

    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      mountOptions:
        - "discard"

    cephFileSystems: []

    cephObjectStores:
      - name: ceph-objectstore
        spec:
          # Replicated 3, not the chart default EC 2+1: with failureDomain host
          # and only 3 hosts, EC 2+1 has as many chunks as failure domains, so a
          # host loss leaves the pool degraded with nowhere to backfill.
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
            parameters:
              # Rook creates the RGW metadata pools at pg_num 8 and there is no
              # per-pool override - this applies to all six (rgw.control,
              # rgw.meta, rgw.log, rgw.buckets.index, rgw.buckets.non-ec,
              # rgw.otp). pg_num_min pins the floor so the autoscaler cannot
              # shrink near-empty metadata pools back down and undo this.
              pg_num: "32"
              pg_num_min: "32"
          dataPool:
            failureDomain: host
            replicated:
              size: 3
            parameters:
              # bulk tells the autoscaler to assume this pool will grow large, so
              # it jumps straight to the full target instead of ramping. Combined
              # with mon_target_pg_per_osd it took this pool to 512 PGs (1536
              # PG-replicas) for a few MB of backups and tripped
              # "too many PGs per OSD". pg_num_max bounds it; pg_num brings it
              # back down, since pg_num_max alone only caps future growth.
              bulk: "true"
              pg_num: "256"
              pg_num_max: "256"
          preservePoolsOnDelete: true
          gateway:
            port: 80
            instances: 2
            priorityClassName: system-cluster-critical
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 1Gi
        storageClass:
          enabled: true
          name: ceph-bucket
          # Retain: with Delete, removing an OBC destroys the bucket contents
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          parameters:
            region: us-east-1
