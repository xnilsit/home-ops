---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./storageclass.yaml
  - ./grafanadashboard.yaml
replacements:
  # Keeps the ceph-mixin dashboards on the tag of the running Ceph. Renovate's
  # grafanaDashboards preset only tracks grafana.com URLs, so a hand-pinned
  # raw.githubusercontent tag would silently drift behind the image.
  - source:
      kind: HelmRelease
      name: rook-ceph-cluster
      fieldPath: spec.values.cephImage.tag
    targets:
      - select:
          kind: GrafanaDashboard
        fieldPaths:
          - spec.url
        options:
          # The tag is the 6th "/"-separated segment of the URL. Positional, so
          # the placeholder tag in grafanadashboard.yaml must stay in that slot.
          delimiter: /
          index: 5
