apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-rgw
spec:
  hostnames:
    - "rgw.${SECRET_DOMAIN}"
  parentRefs:
    - {name: envoy-internal, namespace: network, sectionName: https}
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /}}
      backendRefs:
        - {name: ceph-rgw-fixed, port: 80}