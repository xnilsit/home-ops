---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: rgw-overview
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # ceph-mixin, so the queries match the Ceph that is actually running - the tag
  # below is rewritten from cephImage.tag by the replacement in
  # ./kustomization.yaml, which is why these two dashboards live here rather
  # than next to the grafana.com ones in ../app.
  #
  # Expect 6 of its 14 panels to stay empty: the four HAProxy panels (no HAProxy
  # ingress here, Envoy fronts RGW) and the two bucket-notification panels (no
  # topics configured).
  #
  # No `datasources:` mapping: the mixin dashboards have no __inputs, only a
  # datasource-type template variable resolving to Grafana's default.
  url: https://raw.githubusercontent.com/ceph/ceph/v20.2.4/monitoring/ceph-mixin/dashboards_out/radosgw-overview.json
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: rgw-instance-detail
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # Two of its five panels stay empty - HTTP Request Breakdown and Workload
  # Breakdown query ceph_rgw_get / ceph_rgw_put, which the Tentacle mgr exporter
  # no longer emits (ceph main's mixin still asks for them, so no newer tag
  # fixes it). Its $rgw_servers picker also has a single entry: both gateway pods
  # report ceph_daemon="rgw.ceph.objectstore.a", so panels aggregate the pair.
  url: https://raw.githubusercontent.com/ceph/ceph/v20.2.4/monitoring/ceph-mixin/dashboards_out/radosgw-detail.json
