---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-ceph
  namespace: flux-system
spec:
  targetNamespace: rook-ceph
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Gate readiness on the operator HelmRelease, not just on the manifests being
  # applied. rook-ceph-csi-drivers writes a Driver CR that a pre-v1.20 operator
  # still reconciles, so it must not run until the chart upgrade has finished.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: rook-ceph-operator
      namespace: rook-ceph
  dependsOn:
    - name: priority-classes
      namespace: flux-system
  path: ./kubernetes/apps/rook-ceph/rook-ceph/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  timeout: 15m # must cover the HelmRelease timeout
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-ceph-csi-drivers
  namespace: flux-system
spec:
  targetNamespace: rook-ceph
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph
      namespace: flux-system
  path: ./kubernetes/apps/rook-ceph/rook-ceph/csi-drivers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  timeout: 5m
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-ceph-cluster
  namespace: flux-system
spec:
  targetNamespace: rook-ceph
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-csi-drivers
      namespace: flux-system
  healthChecks:
    - kind: CephCluster
      apiVersion: ceph.rook.io/v1
      name: rook-ceph
  healthCheckExprs:
    - kind: CephCluster
      apiVersion: ceph.rook.io/v1
      current: |-
        status.ceph.health in ['HEALTH_OK']
  path: ./kubernetes/apps/rook-ceph/rook-ceph/cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  # Pool-creating changes (e.g. adding a CephObjectStore, which creates 7 pools)
  # produce a transient HEALTH_WARN while the PG autoscaler rebalances. That
  # outlasted the previous 5m and failed this Kustomization, which stalls
  # everything gated on it - grafana dependsOn rook-ceph-cluster.
  timeout: 15m
