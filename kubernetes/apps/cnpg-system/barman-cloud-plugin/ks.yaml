---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app barman-cloud-plugin
  namespace: flux-system
spec:
  # Must live in the operator's own namespace: CNPG-I discovers plugins by
  # watching Services in the namespace the operator runs in.
  targetNamespace: cnpg-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/cnpg-system/barman-cloud-plugin/app
  dependsOn:
    - name: cloudnative-pg
      namespace: flux-system
    # The chart ships a cert-manager Issuer and two Certificates; mTLS to the
    # operator is not optional, so the install fails without cert-manager.
    - name: cert-manager
      namespace: flux-system
    - name: priority-classes
      namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: cnpg-system
    - kind: CustomResourceDefinition
      name: objectstores.barmancloud.cnpg.io
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 1h
  timeout: 15m
