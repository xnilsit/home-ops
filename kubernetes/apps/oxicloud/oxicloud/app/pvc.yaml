---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}
spec:
  # Chunked-upload spool and scratch only; blobs live in the bucket. Not backed up.
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 20Gi
  storageClassName: ceph-block
