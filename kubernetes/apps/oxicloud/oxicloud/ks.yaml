---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app oxicloud
  namespace: flux-system
spec:
  targetNamespace: oxicloud
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/oxicloud/oxicloud/app
  dependsOn:
    # Writes the oxicloud-oidc Secret the ExternalSecret reads
    - name: authentik-oidc
      namespace: flux-system
    # The OIDC credential comes through the tofu-controller store
    - name: external-secrets-stores
      namespace: flux-system
    # The Cluster references the barman plugin
    - name: barman-cloud-plugin
      namespace: flux-system
    # Backup buckets and keys for the Cluster and the bucket mirror
    - name: garage
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
    # ceph-block for the spool PVC, and the bucket StorageClass the OBC claims through
    - name: rook-ceph-cluster
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
      PG_IMAGE_TAG: 18.6-minimal-trixie
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: oxicloud-postgres
      namespace: oxicloud
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: oxicloud
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 30m
