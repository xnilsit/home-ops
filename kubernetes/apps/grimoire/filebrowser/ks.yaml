---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grimoire-filebrowser
  namespace: flux-system
spec:
  targetNamespace: grimoire
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/grimoire/filebrowser/app
  dependsOn:
    # The library PVC it shares with Grimoire
    - name: grimoire-library
      namespace: flux-system
    # Writes the grimoire-filebrowser-oidc Secret the ExternalSecret reads
    - name: authentik-oidc
      namespace: flux-system
    # The OIDC credential comes through the tofu-controller store
    - name: external-secrets-stores
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
    # The database PVC is provisioned through kopiur's Restore populator
    - name: kopiur-repository
      namespace: flux-system
    - name: rook-ceph-cluster
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      # Users, their permissions and settings; the file index is rebuilt on start.
      KOPIUR_CAPACITY: 1Gi
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: grimoire
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
