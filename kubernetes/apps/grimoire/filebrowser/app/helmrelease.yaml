---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grimoire-filebrowser
spec:
  chartRef:
    kind: OCIRepository
    name: grimoire-filebrowser
  interval: 1h
  values:
    controllers:
      grimoire-filebrowser:
        annotations:
          reloader.stakater.com/auto: "true"
        # SQLite on an RWO volume: two pods must never hold it at once.
        strategy: Recreate
        containers:
          app:
            image:
              repository: registry.nilsit.de/ghcr.io/gtsteffaniak/filebrowser
              tag: 2.0.1-stable
            env:
              TZ: Europe/Berlin
              FILEBROWSER_CONFIG: /config/config.yaml
              FILEBROWSER_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: &oidcSecret grimoire-filebrowser-oidc
                    key: client-id
              FILEBROWSER_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: *oidcSecret
                    key: client-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # Grimoire's uid, so uploads stay readable and movable from both apps.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      config:
        type: configMap
        name: grimoire-filebrowser-config
        globalMounts:
          - path: /config
            readOnly: true
      data:
        # Provisioned by components/kopiur/backup through its Restore populator.
        existingClaim: grimoire-filebrowser
        globalMounts:
          - path: /data
      library:
        existingClaim: grimoire-library
        globalMounts:
          - path: /library
      # Thumbnails and the file index, rebuilt on start.
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: grimoire-filebrowser
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /health
        hostnames:
          - "grimoire-files.${SECRET_DOMAIN}"
        # Same gateway as Grimoire, off the Cloudflare tunnel.
        parentRefs:
          - name: envoy-external-direct
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
