---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./admin-password.yaml
  - ./externalsecret-oidc.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
configMapGenerator:
  # The groups and the IdP login rule, loaded on every start.
  - name: grimoire-sftpgo-data
    files:
      - sftpgo.json=./resources/sftpgo.json
    options:
      # Named in the HelmRelease values, which kustomize does not rewrite.
      disableNameSuffixHash: true
