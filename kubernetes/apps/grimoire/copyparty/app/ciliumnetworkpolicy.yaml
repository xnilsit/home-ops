---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# copyparty trusts x-idp-user and x-idp-group from any pod in xff-src, so only
# the gateway may connect.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-from-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: ${APP}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external-direct
      toPorts:
        - ports:
            - port: "3923"
              protocol: TCP
