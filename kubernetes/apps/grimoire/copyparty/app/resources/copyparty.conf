[global]
  # The index, upload state and thumbnails, kept off the library volume.
  hist: /state/hist
  e2dsa
  # Set by the gateway from the verified access token: preferred_username and
  # grimoire_role. There are no local accounts.
  idp-h-usr: x-idp-user
  idp-h-grp: x-idp-group
  # Pod CIDRs. The CiliumNetworkPolicy narrows this down to envoy.
  xff-src: 10.42.0.0/16, fd2e:9a41:6b8c:4200::/56
  name: Grimoire Files
  no-robots

[/]
  /library
  accs:
    # read, write (upload), move/rename
    rwm: @gm
    # plus delete and admin
    rwmda: @admin
