---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/oidc
  # gatus probes the route with a bearer token instead of following the 302.
  - ../../../../components/oidc-probe
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./pvc.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: grimoire-copyparty-config
    files:
      - copyparty.conf=./resources/copyparty.conf
    options:
      # Named in the HelmRelease values, which kustomize does not rewrite.
      disableNameSuffixHash: true
patches:
  # Targeted by kind rather than name: postBuild substitution has not run yet at
  # build time, so the SecurityPolicy is still literally named ${APP}-oidc.
  - target:
      kind: SecurityPolicy
    patch: |-
      - op: add
        path: /spec/oidc/scopes/-
        value: grimoire_role
      - op: add
        path: /spec/oidc/forwardAccessToken
        value: true
      # forwardAccessToken puts an Authorization header on every request, which
      # ../oidc-probe's passThroughAuthHeader routes into the jwt filter. This
      # provider verifies it and hands copyparty the identity. Client-sent
      # copies of both headers are dropped by the ClientTrafficPolicy.
      - op: add
        path: /spec/jwt/providers/-
        value:
          name: ${APP}
          issuer: ${AUTHENTIK_URL}/application/o/home-ops-${APP}/
          remoteJWKS:
            uri: ${AUTHENTIK_URL}/application/o/home-ops-${APP}/jwks/
          claimToHeaders:
            - claim: preferred_username
              header: x-idp-user
            - claim: grimoire_role
              header: x-idp-group
