---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grimoire-copyparty
spec:
  chartRef:
    kind: OCIRepository
    name: grimoire-copyparty
  interval: 1h
  values:
    controllers:
      grimoire-copyparty:
        annotations:
          reloader.stakater.com/auto: "true"
        # The up2k database on an RWO volume: two pods must never hold it at once.
        strategy: Recreate
        containers:
          app:
            image:
              repository: registry.nilsit.de/docker.io/copyparty/im
              tag: 1.20.26
            env:
              TZ: Europe/Berlin
              # copyparty's own state dir; its default /cfg is the ConfigMap.
              XDG_CONFIG_HOME: /state
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3923
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # Grimoire's uid, so uploads stay readable and movable from both apps.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      config:
        type: configMap
        name: grimoire-copyparty-config
        globalMounts:
          - path: /cfg
            readOnly: true
      state:
        existingClaim: grimoire-copyparty-state
        globalMounts:
          - path: /state
      library:
        existingClaim: grimoire-library
        globalMounts:
          - path: /library
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: grimoire-copyparty
        ports:
          http:
            port: *port
    route:
      app:
        # Probes authenticate rather than follow the SecurityPolicy's 302, which gatus
        # would otherwise report as healthy. $$ keeps Flux's envsubst off the secret.
        annotations:
          gatus.home-operations.com/endpoint: |
            client:
              oauth2:
                token-url: ${AUTHENTIK_URL}/application/o/token/
                client-id: home-ops-gatus-probe
                client-secret: $${GATUS_PROBE_CLIENT_SECRET}
                scopes: ["openid", "profile"]
        hostnames:
          - "grimoire-files.${SECRET_DOMAIN}"
        # Guarded by the SecurityPolicy from components/oidc. Same gateway as
        # Grimoire, and the one the CiliumNetworkPolicy admits.
        parentRefs:
          - name: envoy-external-direct
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
