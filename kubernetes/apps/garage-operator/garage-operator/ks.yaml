---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-operator
  namespace: flux-system
spec:
  targetNamespace: garage-operator
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/garage-operator/garage-operator/app
  dependsOn:
    # The chart's admission and conversion webhooks need cert-manager to mint
    # their serving certs, and the deployment does not become Ready without them
    - name: cert-manager
      namespace: flux-system
    - name: prometheus-operator-crds
      namespace: flux-system
    - name: priority-classes
      namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: garage-operator
    - kind: CustomResourceDefinition
      name: garageclusters.garage.rajsingh.info
    - kind: CustomResourceDefinition
      name: garagebuckets.garage.rajsingh.info
    - kind: CustomResourceDefinition
      name: garagekeys.garage.rajsingh.info
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 1h
  timeout: 15m
