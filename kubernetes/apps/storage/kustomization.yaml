---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./volsync/ks.yaml
  - ./local-path-provisioner/ks.yaml
components:
  - ../../flux/components/namespace
patches:
  - # Add the name to the namespace
    patch: |
      - op: add
        path: /metadata/name
        value: storage
      - op: add
        path: /metadata/labels
        value: {"pod-security.kubernetes.io/enforce": "privileged","pod-security.kubernetes.io/enforce-version": "latest"}
    target:
      kind: Namespace
