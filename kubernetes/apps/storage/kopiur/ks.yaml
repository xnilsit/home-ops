---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur
  namespace: flux-system
spec:
  targetNamespace: storage
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/storage/kopiur/app
  dependsOn:
    # The GarageBucket and the GarageKey whose Secret the ExternalSecret reads
    - name: garage
      namespace: flux-system
    # The store the ExternalSecret reads that Secret through
    - name: external-secrets-stores-garage
      namespace: flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: storage
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-repository
  namespace: flux-system
spec:
  targetNamespace: storage
  commonMetadata:
    labels:
      app.kubernetes.io/name: kopiur
  path: ./kubernetes/apps/storage/kopiur/repository
  dependsOn:
    - name: kopiur
      namespace: flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Gates every SnapshotPolicy in the cluster: kopiur's CRDs are kstatus-shaped,
  # so a plain healthCheck on Ready means "repository connected".
  wait: true
  interval: 1h
  timeout: 10m
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: ClusterRepository
      name: nas
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-oidc
  namespace: flux-system
spec:
  targetNamespace: storage
  commonMetadata:
    labels:
      app.kubernetes.io/name: kopiur
  path: ./kubernetes/apps/storage/kopiur/oidc
  dependsOn:
    # The HTTPRoute this attaches to
    - name: kopiur
      namespace: flux-system
    # The SecurityPolicy needs the envoy gateway CRDs
    - name: envoy-gateway
      namespace: flux-system
    # kopia-oidc is pulled from the Secret the tofu module writes
    - name: authentik-oidc
      namespace: flux-system
    # Owns the ClusterSecretStore the credential ExternalSecrets read through
    - name: external-secrets-stores
      namespace: flux-system
  postBuild:
    substitute:
      APP: kopia
      OIDC_HOST: kopia.${SECRET_DOMAIN}
      OIDC_ROUTE: kopia-ui
  healthChecks:
    - apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      name: kopia-oidc
      namespace: storage
  healthCheckExprs:
    # SecurityPolicy reports Gateway API PolicyStatus - status.ancestors[] - not
    # the flat status.conditions kstatus reads. With no ancestors yet neither
    # expr matches, which is the InProgress that lets Flux retry while ESO
    # is still filling in the Secret.
    - apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      failed: status.ancestors.exists(a, a.conditions.exists(c, c.type == 'Accepted' && c.status == 'False'))
      current: status.ancestors.exists(a, a.conditions.exists(c, c.type == 'Accepted' && c.status == 'True'))
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # wait: false, since wait: true would ignore the healthCheckExprs above.
  wait: false
  interval: 1h
  timeout: 5m
