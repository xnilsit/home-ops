---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur
  namespace: flux-system
spec:
  targetNamespace: storage
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/storage/kopiur/app
  dependsOn:
    # The GarageBucket and the GarageKey whose Secret is reflected in here
    - name: garage
      namespace: flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: storage
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-repository
  namespace: flux-system
spec:
  targetNamespace: storage
  commonMetadata:
    labels:
      app.kubernetes.io/name: kopiur
  path: ./kubernetes/apps/storage/kopiur/repository
  dependsOn:
    - name: kopiur
      namespace: flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Gates every SnapshotPolicy in the cluster: kopiur's CRDs are kstatus-shaped,
  # so a plain healthCheck on Ready means "repository connected".
  wait: true
  interval: 1h
  timeout: 10m
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: ClusterRepository
      name: nas
