---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# kopiur's own console (ui in ../app/helmrelease.yaml). The console trusts every
# request as its anonymous user, so the SecurityPolicy is the only gate - which
# is why the route lives here with it rather than in ../app: the two are applied
# together, so the route is never served without its policy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kopiur-ui
  # Same probe as kopia-ui in ../app/httproute.yaml.
  annotations:
    gatus.home-operations.com/endpoint: |
      client:
        oauth2:
          token-url: ${AUTHENTIK_URL}/application/o/token/
          client-id: home-ops-gatus-probe
          client-secret: $${GATUS_PROBE_CLIENT_SECRET}
          scopes: ["openid", "profile"]
spec:
  hostnames:
    - "kopiur.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: kopiur-ui
          port: 8090
      matches:
        - path:
            type: PathPrefix
            value: /
