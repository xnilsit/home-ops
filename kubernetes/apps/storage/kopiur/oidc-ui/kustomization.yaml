---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./httproute.yaml
components:
  # Split out of ../app so the authentik chain does not end up gating backups:
  # kopiur-repository dependsOn kopiur and is what every SnapshotPolicy waits on.
  # gatus probes the route with a bearer token; the console sends none of its own.
  - ../../../../components/oidc
  - ../../../../components/oidc-probe
