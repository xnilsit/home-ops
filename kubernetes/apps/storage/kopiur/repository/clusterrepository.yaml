---
# One kopia repository for the whole cluster. kopia dedups across writers and
# separates them by snapshot identity (username@hostname:path, defaulting to
# <policy>@<namespace>:/pvc/<pvc>), so a shared bucket needs no key prefixes.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  # all, not a roster: every namespace here is ours, and a missing entry denies
  # the SnapshotPolicy at admission, nowhere near the app that adopted it.
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: kopiur
      # The Garage edge gateways, not s3.${SECRET_DOMAIN} - same reasoning as the
      # barman ObjectStores: mover uploads never cross Envoy.
      endpoint: garage.garage.svc.cluster.local:3900
      # Garage checks the region in the SigV4 credential scope and rejects a
      # mismatch.
      region: eu-central-1
      tls: {disableTls: true}
      auth:
        # Same Secret as the encryption password below: the kopia-UI server pod
        # env-injects only the Secret named by spec.encryption and never this
        # one, so a split layout starts it without S3 credentials. ESO merges
        # the AWS_* keys into it (../app/externalsecret.yaml).
        #
        # A ClusterRepository is cluster-scoped, so every secretRef must carry
        # an explicit namespace - webhook-enforced.
        secretRef: {name: kopiur-encryption, namespace: storage}
  encryption:
    passwordSecretRef: {name: kopiur-encryption, namespace: storage, key: KOPIA_PASSWORD}
  # Owner half of the fail-closed projection gate; consumers still opt in.
  credentialProjection: {allowed: true}
  moverDefaults:
    cache: {mode: Persistent, capacity: 20Gi, storageClassName: ceph-block}
  scheduleDefaults: {timezone: "${TIMEZONE}"}
  parameters:
    epoch:
      # kopia only compacts an epoch once a newer one exists, so the two newest
      # are always loose index blobs. At the 24h default the hourly policies leave
      # ~1800 of them - above the 1000 IndexBlobHealth threshold every day.
      minDuration: 6h
      # spec.create is deliberately absent, which means create.enabled: true:
      # bootstrap connects first and only initialises when the bucket holds no repo,
      # so a wrong password fails AuthFailure instead of creating a second one.
