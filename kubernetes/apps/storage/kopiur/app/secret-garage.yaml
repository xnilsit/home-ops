---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: garage-kopiur
  annotations:
    # Mirrors the Secret garage-operator generates for the kopiur GarageKey.
    # No longer read by the ClusterRepository - its backend auth.secretRef now
    # points at kopiur-encryption, which carries a copy of these keys so the
    # kopia-UI server pod gets them (see ../repository/clusterrepository.yaml).
    # Kept as the authoritative copy of the generated key: this is what to
    # compare against after a GarageKey rotation.
    reflector.v1.k8s.emberstack.com/reflects: garage/garage-kopiur
type: Opaque
