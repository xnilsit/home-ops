---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kopiur
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # copyMethod defaults to Snapshot, which is a CSI VolumeSnapshot
  dependsOn:
    - name: snapshot-controller
  values:
    features:
      credentialProjection:
        # Grants the operator secrets create/patch/delete. A mover Job runs in
        # the workload namespace and reads credentials via envFrom, which is
        # namespace-local, so the shared ClusterRepository's Secrets have to be
        # copied in per run - and reaped again when the run ends. kopiur-ui's
        # browse sessions get their copy the same way.
        enabled: true
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
    # kopiur's own console, at kopiur.${SECRET_DOMAIN} behind ../oidc-ui.
    ui:
      enabled: true
      auth:
        # Anonymous rather than header mode: the SecurityPolicy only logs the
        # user in and forwards no identity, and the authentik app admits the
        # home-ops group alone - so everyone who gets through is the same
        # person. The impersonate rule is pinned by name to this one user.
        anonymous:
          enabled: true
          user: home-ops
      rbac:
        # View and operate: snapshots, restores, suspend, maintenance.
        bindings:
          - role: user
            users:
              - home-ops
        # The in-snapshot file browser. Binding it in a namespace hands out the
        # repository credentials there (they sit in the session pod's env), so
        # it is bound per namespace by components/kopiur/backup, to the same
        # single user the rest of the console already runs as.
        browseRole: true
      # Anonymous mode trusts every caller, so only envoy-internal may reach
      # the app port. The ops port (/metrics, /healthz) stays cluster-wide.
      networkPolicy:
        enabled: true
        proxySelector:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      serviceMonitor:
        enabled: true
    # Storage control plane, same tier as snapshot-controller
    priorityClassName: cluster-infra
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
