---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kopiur
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # copyMethod defaults to Snapshot, which is a CSI VolumeSnapshot
  dependsOn:
    - name: snapshot-controller
  values:
    features:
      credentialProjection:
        # Grants the operator secrets create/patch/delete. A mover Job runs in
        # the workload namespace and reads credentials via envFrom, which is
        # namespace-local, so the shared ClusterRepository's Secrets have to be
        # copied in per run - and reaped again when the run ends.
        enabled: true
      kopiaUi:
        # Same secrets grant, needed again for the ClusterRepository's kopia web
        # UI: the operator mints its login into nas-kopia-ui-auth and mirrors the
        # repository credentials next to the server pod. Without the flag the
        # ClusterRepository status reports a 403 naming it.
        enabled: true
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
    # Storage control plane, same tier as snapshot-controller
    priorityClassName: cluster-infra
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
