---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Fronts the kopia web UI that ../repository/clusterrepository.yaml turns on.
# Deliberately here and not next to that CR: the repository Kustomization is
# wait: true and gates every SnapshotPolicy in the cluster, so a route waiting on
# the gateway would hold up backups. This one reconciles wait: false, and the
# route simply 500s for the few seconds before nas-kopia-ui exists.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kopia-ui
  # Probes authenticate rather than follow the SecurityPolicy's 302:
  # gatus follows redirects, so an unauthenticated check would land on
  # authentik's login page and call the app healthy. passThroughAuthHeader
  # in components/oidc lets the resulting JWT past the oauth2 filter. $$
  # keeps Flux's envsubst off the secret - gatus expands it itself.
  annotations:
    gatus.home-operations.com/endpoint: |
      client:
        oauth2:
          token-url: ${AUTHENTIK_URL}/application/o/token/
          client-id: home-ops-gatus-probe
          client-secret: $${GATUS_PROBE_CLIENT_SECRET}
          scopes: ["openid", "profile"]
spec:
  hostnames:
    - "kopia.${SECRET_DOMAIN}"
  parentRefs:
    # envoy-internal only, guarded by the SecurityPolicy in ../oidc - kopia's own
    # login is off. Reaching it means read AND write on every backup.
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        # kopia serves plain HTTP in the pod (the operator passes --insecure);
        # TLS terminates at the gateway.
        - name: nas-kopia-ui
          port: 51515
      matches:
        - path:
            type: PathPrefix
            value: /
