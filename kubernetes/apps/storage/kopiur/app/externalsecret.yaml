---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-encryption-garage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: garage
  target:
    # Merge, not Owner: KOPIA_PASSWORD stays SOPS-managed in this same Secret,
    # because the kopia-UI server pod env-injects only the Secret named by
    # spec.encryption and never the backend's auth.secretRef.
    name: kopiur-encryption
    creationPolicy: Merge
  dataFrom:
    # extract takes all three AWS_* keys under their own names, which is what
    # the ClusterRepository and the movers already expect.
    - extract:
        key: garage-kopiur
