metadata:
  name: kopiur-encryption
type: Opaque
# The kopia repository password, read by the ClusterRepository and projected
# into each mover namespace. Lose it and every backup in the bucket is
# unrecoverable - it is not derivable from the Garage key.
#
# The AWS_* keys are a copy of the garage-operator-generated garage-kopiur
# Secret, here only because kopiur's kopia-UI server pod env-injects a single
# Secret - the one named by spec.encryption - and never the backend's
# auth.secretRef, so a split layout leaves it without S3 credentials (movers
# read both and are unaffected). Rotating the GarageKey means updating this too;
# drop these three keys once kopiur injects the backend Secret as well.
