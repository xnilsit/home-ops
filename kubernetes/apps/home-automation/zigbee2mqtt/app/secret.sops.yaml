---
# The Zigbee network's identity, pinned so it exists somewhere other than the
# data PVC. Values were read out of the live /data/configuration.yaml and
# verified byte-for-byte against the coordinator backup taken before the
# migration - network key, pan_id and ext_pan_id all matched both sources.
#
# This is the THIRD guard against Zigbee2MQTT forming a brand new network and
# unpairing every device, after Z2M_ONBOARD_NO_SERVER and the guard-data
# initContainer. It is also the only copy of the network key that does not live
# on Ceph: lose the PVC and the kopia repository together and this is what makes
# the devices recoverable.
#
# ZIGBEE2MQTT_CONFIG_* overrides are applied before Zigbee2MQTT writes
# configuration.yaml back to disk, so these win over the file and are persisted
# into it. That is exactly why they are dangerous to get wrong: a value that
# does not match the coordinator does not fail loudly, it forms a different
# network. Never edit these by hand - re-derive them from a coordinator backup.
#
# JSON, because the schema types network_key and ext_pan_id as arrays and the
# environment path JSON.parses anything without a scalar type.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: zigbee2mqtt-network
stringData:
  ZIGBEE2MQTT_CONFIG_ADVANCED_NETWORK_KEY: ENC[AES256_GCM,data:jx3A8RxAElu3c9SEq57VeHGqSjJCmlLhpJCZXSg2nCIwLxPfpnc20RoolAvBtxDaUcdWe7h0DWdEJJk=,iv:wcQg1LsuCrh4XF4fd3SvlBIjMeKQQa9DO86Y6Y3vzfg=,tag:67by6O+ytIltIsv2N/qdYQ==,type:str]
