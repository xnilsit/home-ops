---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  # Provisions the data PVC (named ${APP}) and snapshots it to the NAS.
  - ../../../../components/kopiur/backup
  # Puts the frontend behind authentik.
  - ../../../../components/oidc
  # gatus probes this route with a bearer token; the frontend sends none of its
  # own - its websocket carries no Authorization header.
  - ../../../../components/oidc-probe
patches:
  - path: ./snapshotpolicy.yaml
resources:
  # The pinned network identity the HelmRelease reads with envFrom.
  - ./secret.sops.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
