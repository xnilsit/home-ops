---
# Plaintext `user:password` lines, hashed in place at startup by the passwd-hash
# initContainer. Committing the plaintext rather than a pbkdf2 hash is
# deliberate: both are age-encrypted at rest and mounted only into these pods,
# but only the plaintext can be read back - and it has to be, because
# home-assistant's own copy of it lives in .storage/core.config_entries on its
# PVC, where it is plaintext anyway.
#
# `homeassistant` is byte-identical to the password the retired HAOS Mosquitto
# add-on issued (verified against the add-on's /data/system_user.json), so Home
# Assistant's stored MQTT config entry needs only its `broker` host changed.
# Rotating it would mean a second edit to .storage, or re-running the config
# flow - which risks a new entry_id and orphaning every MQTT-discovered device.
#
# `zigbee2mqtt` is NOT carried over. The add-on authenticated as the Home
# Assistant user `mqtt` with the password `mqtt` through the Supervisor auth
# plugin, which does not exist here. Zigbee2MQTT reads its credential from the
# environment, which overrides its own configuration.yaml, so this one was free
# to be replaced with something strong.
#
# Z2M_MQTT_* are read by the zigbee2mqtt HelmRelease out of this same Secret
# rather than a copy of its own: two SOPS files holding one password is a
# rotation that silently half-applies.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: mosquitto-credentials
stringData:
