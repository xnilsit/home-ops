---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  chartRef:
    kind: OCIRepository
    name: mosquitto
  interval: 1h
  values:
    controllers:
      mosquitto:
        annotations:
          reloader.stakater.com/auto: "true"
        # RWO persistence volume, and two brokers on one volume would fight over
        # mosquitto.db.
        strategy: Recreate
        initContainers:
          passwd-hash:
            image:
              repository: &image docker.io/library/eclipse-mosquitto
              tag: &tag 2.0.22
            # `mosquitto_passwd -U` upgrades a plaintext user:password file to
            # hashes in place - the documented flag for exactly this. Done in the
            # broker's own image so there is no second image to track and the
            # tool is guaranteed present. The Secret is copied first because a
            # projected Secret mount is read-only and 0644, and mosquitto
            # refuses to read a world-readable password file.
            command:
              - "sh"
              - "-c"
            args:
              - |
                set -eu
                cp /run/secrets/mosquitto/passwd /run/mosquitto/passwd
                chmod 0600 /run/mosquitto/passwd
                mosquitto_passwd -U /run/mosquitto/passwd
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              repository: *image
              tag: *tag
            # The image's own CMD, restated because its entrypoint chowns
            # /mosquitto only when it runs as uid 0 and would otherwise log a
            # failure on every start. dumb-init is not in play here; mosquitto is
            # PID 1 and handles SIGTERM itself.
            command:
              - "/usr/sbin/mosquitto"
            args:
              - "-c"
              - "/mosquitto/config/mosquitto.conf"
            env:
              # log_timestamp_format is left at the default, so this is what
              # makes the connection log read in local time.
              TZ: ${TIMEZONE}
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 1883
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probe
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # 1000, not the image's own mosquitto user (1883): it matches the rest of
        # the repo, and nothing in the image is owned by 1883 that this pod needs.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    configMaps:
      config:
        data:
          mosquitto.conf: |
            # No `user` directive: mosquitto only setuid()s when it starts as
            # root, and this pod is 1000 from the start - leaving it in produces
            # a "Unable to drop privileges" warning on every boot.

            # An explicit listener is MANDATORY in 2.x. With none, mosquitto
            # binds 127.0.0.1 only, and every client times out against a pod
            # that looks perfectly healthy.
            listener 1883 0.0.0.0
            protocol mqtt

            allow_anonymous false
            # Written by the passwd-hash initContainer into an emptyDir, because
            # the file has to be 0600 and a Secret projection cannot be.
            password_file /run/mosquitto/passwd

            # No acl_file. The retired add-on's ACL had no topic rules either,
            # and there are exactly two trusted clients on a ClusterIP the LAN
            # cannot reach. Add one the day an untrusted publisher exists.

            persistence true
            persistence_location /mosquitto/data/
            # Retained discovery and state survive a broker restart, so Home
            # Assistant's MQTT entities do not all go unavailable for the seconds
            # until zigbee2mqtt republishes.
            autosave_interval 60

            # Upstream's own comment: this is effectively the ceiling on the
            # number of Home Assistant entities when startup is too busy to read
            # messages fast enough.
            max_queued_messages 8192

            log_dest stdout
            log_type error
            log_type warning
            log_type notice
            log_type information
            connection_messages true
    persistence:
      config:
        type: configMap
        # identifier, not name: lets the chart resolve the generated ConfigMap's
        # real name.
        identifier: config
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
            readOnly: true
      passwd-src:
        type: secret
        name: mosquitto-credentials
        globalMounts:
          - path: /run/secrets/mosquitto
            readOnly: true
      passwd:
        type: emptyDir
        globalMounts:
          - path: /run/mosquitto
      data:
        existingClaim: mosquitto
        globalMounts:
          - path: /mosquitto/data
    service:
      app:
        controller: mosquitto
        ports:
          mqtt:
            port: *port
