---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  # Longer than Helm's 5m default, and deliberately longer than the startup
  # probe's own 15m budget below. With the default, a first boot that spends
  # minutes building /config/.venv trips the Helm timeout, Flux rolls back to
  # the previous release, and the rollback restarts the very pod that was making
  # progress - which is exactly what happened during the migration cutover.
  timeout: 20m
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        # RWO volume, and the macvlan attachment holds a single static address:
        # two pods must never overlap for either reason.
        strategy: Recreate
        containers:
          app:
            # Pinned to the exact version the VM was running. Upgrading in the
            # same window as the migration would confuse "the migration broke
            # it" with "the upgrade broke it"; bump in its own PR once the
            # cutover is verified.
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.1
            env:
              TZ: ${TIMEZONE}
              # Read by `recorder: db_url: !env_var HA_RECORDER_DB_URL` in the
              # configuration.yaml on the volume. The recorder moved off the
              # SQLite file the VM used, which means the pre-cutover history is
              # NOT carried over - HA has no supported SQLite-to-Postgres
              # migration. Everything users think of as configuration
              # (registries, automations, dashboards, HACS) lives in .storage
              # and does carry over.
              HA_RECORDER_DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-pg-shared
                    key: uri
            # exec, not httpGet, and it is the macvlan attachment that forces
            # it. A kubelet httpGet probe dials the pod IP FROM THE NODE, and
            # this cluster runs Cilium with bpf.hostLegacyRouting: true (see
            # kube-system/cilium/app/helmrelease.yaml), so that connection
            # carries the node's LAN address as its source - 192.168.1.10x, not
            # a 10.42.x.x cilium_host address. The pod then matches that against
            # net1's connected 192.168.0.0/23 route and sends the SYN-ACK out
            # macvlan, which cannot reach the host it lives on. The handshake
            # sits in SYN_RECV until the probe times out, forever.
            #
            # An exec probe runs through the CRI and never touches the network,
            # so it is immune. Everything else reaches this pod normally: envoy
            # and any other pod over eth0, LAN clients over net1 - all verified.
            probes:
              # No tight liveness threshold: a recorder purge or a slow
              # integration setup must not restart HA mid-write.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - curl
                      - -fsS
                      - -o
                      - /dev/null
                      - -m
                      - "10"
                      - http://127.0.0.1:8123/
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 10
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - curl
                      - -fsS
                      - -o
                      - /dev/null
                      - -m
                      - "10"
                      - http://127.0.0.1:8123/
                  periodSeconds: 10
                  timeoutSeconds: 15
                  # 15 minutes. The image's entrypoint builds /config/.venv on
                  # every start and HA pip-installs each HACS custom component's
                  # requirements into it, which on the first boot after the
                  # migration is six components' worth of wheels.
                  failureThreshold: 90
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              # NET_RAW is a deliberate exception to the drop-ALL convention
              # used elsewhere here. default_config pulls in the dhcp discovery
              # integration, which opens an AF_PACKET socket, and Talos leaves
              # net.ipv4.ping_group_range unset so unprivileged ICMP is
              # unavailable to the ping integration either. Still non-root, still
              # no privilege escalation.
              capabilities: {add: ["NET_RAW"], drop: ["ALL"]}
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      annotations:
        # The macvlan attachment in ./networkattachmentdefinition.yaml, which is
        # what makes LAN mDNS/SSDP work and what holds 192.168.1.30.
        k8s.v1.cni.cncf.io/networks: lan
      securityContext:
        runAsNonRoot: true
        # The image ends `USER nobody:nogroup` but is uid-agnostic: HOME,
        # WORKDIR and VENV_FOLDER are all under /config. 1000 matches
        # KOPIUR_PUID/PGID, which the Restore and SnapshotPolicy movers are
        # pinned to - a mismatch means the mover cannot read the volume it is
        # meant to snapshot.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    configMaps:
      config:
        data:
          # Moved off the PVC now that the migrated file is known good: the
          # effective configuration is a Git diff again. It deliberately was NOT
          # a ConfigMap for the first boot, because this mount shadows whatever
          # the volume holds - so a transcription that dropped one !include
          # would have failed silently against a freshly seeded /config.
          #
          # The !include paths still resolve relative to /config, so
          # automations.yaml, scripts.yaml, scenes.yaml and blueprints/ keep
          # living on the volume where the UI can write them.
          configuration.yaml: |
            # Loads default set of integrations. Do not remove.
            default_config:

            # Load frontend themes from the themes folder
            frontend:
              themes: !include_dir_merge_named themes

            automation: !include automations.yaml
            script: !include scripts.yaml
            scene: !include scenes.yaml

            # INERT as of 2026.8, and kept only so this file and the stored
            # config do not disagree. Home Assistant migrated this block into
            # .storage/http on first start and set yaml_migration_done, and
            # components/http/server.py now builds the server from that store -
            # editing the values here changes nothing. The live values have to
            # be edited in .storage/http with Home Assistant stopped.
            http:
              use_x_forwarded_for: true
              trusted_proxies:
                # Envoy Gateway's pods, the only thing in front of this
                # instance. Not the LAN: Home Assistant answers on 192.168.1.30
                # directly, so trusting 192.168.0.0/23 would let any host on it
                # forge X-Forwarded-For and spoof its address past ip_ban.
                - 10.42.0.0/16
                - fd2e:9a41:6b8c:4200::/56

            recorder:
              # pg-shared, via the env var the container reads out of the
              # home-assistant-pg-shared Secret.
              db_url: !env_var HA_RECORDER_DB_URL
    persistence:
      config:
        # Provisioned by components/kopiur/backup through its Restore populator.
        existingClaim: home-assistant
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        # identifier, not name: lets the chart resolve the generated ConfigMap's
        # real name. Mounted read-only over the copy on the volume - Home
        # Assistant only ever writes .storage and the *.yaml files the UI owns,
        # never this one. A subPath mount does not update in place, which is
        # what the reloader annotation on the controller is for.
        identifier: config
        globalMounts:
          - path: /config/configuration.yaml
            subPath: configuration.yaml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: &port 8123
    route:
      app:
        annotations:
          # / renders the frontend shell before HA is actually RUNNING, so the
          # probe uses the auth component's own unauthenticated endpoint - it
          # only answers once the HTTP stack and auth providers are set up. No
          # OIDC on this route, so no bearer token is needed.
          gatus.home-operations.com/endpoint: |
            path: /auth/providers
        # Byte-identical to the hostname the retired network/external-services
        # HTTPRoute served, on the same gateway, so neither external-dns nor
        # k8s-gateway sees a record change and the companion app's external URL
        # is untouched.
        hostnames:
          - "ha.${SECRET_DOMAIN}"
        # Deliberately NOT behind components/oidc. A gateway-level OIDC
        # SecurityPolicy 302s a native API client to a login page it cannot
        # render, which is what broke the Immich mobile app - and the HA
        # companion app is exactly that shape. HA keeps its own auth provider.
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
