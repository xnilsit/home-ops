---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
# Resolves @registry@${SECRET_DOMAIN} to the actor on registry.${SECRET_DOMAIN}.
# The apex is beszel's on envoy-external; the exact path wins over its prefix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apoci-webfinger
  annotations:
    gatus.home-operations.com/endpoint: |
      path: /.well-known/webfinger?resource=acct:registry@${SECRET_DOMAIN}
spec:
  hostnames:
    - "${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/webfinger
      backendRefs:
        - name: apoci
          port: 5000
