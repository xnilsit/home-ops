---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app apoci
  namespace: flux-system
spec:
  targetNamespace: apoci
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/apoci/apoci/app
  dependsOn:
    # Owns the ClusterSecretStore the database credential is pulled through
    - name: external-secrets-stores-database
      namespace: flux-system
    - name: envoy-gateway
      namespace: flux-system
    # The bucket StorageClass the OBC claims through
    - name: rook-ceph-cluster
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: apoci
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 1h
  timeout: 10m
