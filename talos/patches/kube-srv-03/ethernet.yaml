---
apiVersion: v1alpha1
kind: LinkConfig
name: enp2s0
up: true
---
apiVersion: v1alpha1
kind: LinkConfig
name: enp3s0
up: true
---
apiVersion: v1alpha1
kind: EthernetConfig
name: enp2s0
wakeOnLan:
  - magic
---
apiVersion: v1alpha1
kind: EthernetConfig
name: enp3s0
wakeOnLan:
  - magic
---
machine:
  sysctls:
    net.ipv6.conf.enp2s0.disable_ipv6: "1"
    net.ipv6.conf.enp3s0.disable_ipv6: "1"
    # No IPv6 default route. Measured on this node with it set to "1": the route
    # installs and host netns reaches the v6 internet in 39ms, but pod egress
    # times out. BPF masquerade rewrites to the device's PRIMARY address, and
    # cilium picks the lowest-sorted global one - the OLDEST delegated Telekom
    # prefix, not the current one the kernel would choose - so pods leave with a
    # source Telekom no longer routes and the reply never comes. The four stale
    # 2001:9e8:* /64s here outlive each rotation, so the wrong one keeps winning.
    #
    # Only enableMasqueradeRouteSource fixes the source, and it is rejected
    # alongside bpf.masquerade (#128). Without a route, egress at least fails
    # immediately instead of blackholing until it times out.
    net.ipv6.conf.enp1s0f0.accept_ra_defrtr: "0"
  kubelet:
    # IPv4 first: kubelet orders a pod's IPs to match the node's, and a pod
    # whose primary IP is IPv6 fails any probe against a 0.0.0.0-only listener.
    # /128, not the LAN /64: SLAAC also puts a ULA on this interface and either
    # would match, leaving the published node IP up to address ordering.
    nodeIP:
      validSubnets:
        - 192.168.0.0/23
        - fd2e:9a41:6b8c:1::103/128
