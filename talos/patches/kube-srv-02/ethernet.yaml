---
apiVersion: v1alpha1
kind: EthernetConfig
name: enp5s0f0np0
wakeOnLan:
  - magic
---
machine:
  sysctls:
    # Pod IPv6 egress. Cilium masquerades to this device's primary GUA, which
    # kube-system/slaac-janitor keeps pointed at the live Telekom prefix.
    net.ipv6.conf.enp5s0f0np0.accept_ra_defrtr: "1"
  kubelet:
    # IPv4 first: kubelet orders a pod's IPs to match the node's, and a pod
    # whose primary IP is IPv6 fails any probe against a 0.0.0.0-only listener.
    # /128, not the LAN /64: SLAAC also puts a ULA on this interface and either
    # would match, leaving the published node IP up to address ordering.
    nodeIP:
      validSubnets:
        - 192.168.0.0/23
        - fd2e:9a41:6b8c:1::102/128
