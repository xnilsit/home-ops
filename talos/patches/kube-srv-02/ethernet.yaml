---
apiVersion: v1alpha1
kind: EthernetConfig
name: enp5s0f0np0
wakeOnLan:
  - magic
---
machine:
  sysctls:
    # No IPv6 default route. Not because the source is unroutable - cilium does
    # masquerade pod IPv6 to a Telekom GUA - but because it picks the OLDEST
    # delegated prefix rather than the current one. See kube-srv-03, where this
    # was measured with the route in place.
    net.ipv6.conf.enp5s0f0np0.accept_ra_defrtr: "0"
  kubelet:
    # IPv4 first: kubelet orders a pod's IPs to match the node's, and a pod
    # whose primary IP is IPv6 fails any probe against a 0.0.0.0-only listener.
    # /128, not the LAN /64: SLAAC also puts a ULA on this interface and either
    # would match, leaving the published node IP up to address ordering.
    nodeIP:
      validSubnets:
        - 192.168.0.0/23
        - fd2e:9a41:6b8c:1::102/128
