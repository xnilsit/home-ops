---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.model == "SAMSUNG MZ1LB960HAJQ-00007"
  minSize: 300GiB
  grow: true
---
apiVersion: v1alpha1
kind: RawVolumeConfig
name: osd-01
provisioning:
  diskSelector:
    match: disk.model == "SAMSUNG MZQLB1T9HAJR-00007"
  minSize: 1900GB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path
provisioning:
  diskSelector:
    match: disk.model == "WD_BLACK SN770 1TB"
  minSize: 800GB
  grow: true
---
# USB HDD dock, slot 1 -> /dev/disk/by-partlabel/r-hdd-01 (Rook OSD on a
# local PV, see kubernetes/apps/rook-ceph/rook-ceph/cluster/hdd-osd-volumes.yaml).
# Pinned to the drive's own WWN so a swapped or reordered disk is never
# partitioned by accident. The dock's ASMedia 2115 bridge leaves
# disk.serial empty and reports the same fake disk.wwid
# (naa.5000000000000001) for both bays, but the drive's real WWN still shows
# up as a /dev/disk/by-id/wwn-* symlink. Check it with
# `talosctl -n kube-srv-02 get disks -o yaml`.
# Talos only partitions free space, so a used disk needs
# `talosctl -n kube-srv-02 wipe disk <dev>` first.
apiVersion: v1alpha1
kind: RawVolumeConfig
name: hdd-01
provisioning:
  diskSelector:
    # Seagate ST32000542AS 2TB, serial 5XW02GVB; swap the WWN when it is
    # replaced with a >=4TB drive
    match: disk.transport == "usb" && "/dev/disk/by-id/wwn-0x5000c500168ead5a" in disk.symlinks
  # Floor only: with no maxSize the partition fills the disk
  minSize: 1TB
---
# USB HDD dock, slot 2 -> /dev/disk/by-partlabel/r-hdd-02
apiVersion: v1alpha1
kind: RawVolumeConfig
name: hdd-02
provisioning:
  diskSelector:
    # Seagate IronWolf Pro ST4000NE0025 4TB, serial ZC19ZR0Y
    match: disk.transport == "usb" && "/dev/disk/by-id/wwn-0x5000c500b4816341" in disk.symlinks
  minSize: 1TB
