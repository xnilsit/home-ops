---
name: "Paseo Image"

on:
  push:
    branches:
      - "main"
    paths:
      - "containers/paseo/**"
      - ".github/workflows/paseo-image.yaml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/paseo
  # Shared across buildkitd replicas; credentials come from buildkitd's env.
  BUILDKIT_CACHE: type=s3,bucket=buildkit-cache,name=paseo,region=us-east-1,endpoint_url=http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80,use_path_style=true

jobs:
  build:
    name: Build Paseo Image
    runs-on: home-ops-runner
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # <paseo version>-<run number>: the run number orders rebuilds of the same Paseo release.
      - name: Derive Tag From Dockerfile
        id: meta
        run: |
          set -euo pipefail
          paseo=$(grep -oP '^ARG BASE=ghcr\.io/getpaseo/paseo:\K[0-9.]+' containers/paseo/Dockerfile)
          [ -n "$paseo" ] || { echo "::error::failed to parse the Paseo version"; exit 1; }
          echo "tag=${paseo}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building ${paseo}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"

      # In-cluster rootless buildkitd over mTLS; the runner has no Docker daemon.
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: tcp://buildkitd.actions-runner-system.svc:1234
          driver-opts: |
            cacert=/home/runner/buildkit-certs/ca.crt
            cert=/home/runner/buildkit-certs/tls.crt
            key=/home/runner/buildkit-certs/tls.key

      - name: Log In To GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # s3 cache authenticates with buildkitd's own credentials.
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_EC2_METADATA_DISABLED: "true"
        with:
          context: containers/paseo
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: ${{ env.BUILDKIT_CACHE }}
          cache-to: ${{ env.BUILDKIT_CACHE }},mode=max
