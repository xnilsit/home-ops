---
name: "TimescaleDB CNPG Extension Image"

on:
  push:
    branches:
      - "main"
    paths:
      - "containers/timescaledb-cnpg/**"
      - ".github/workflows/timescaledb-image.yaml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/timescaledb-cnpg

jobs:
  build:
    name: Build TimescaleDB Extension Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile ARGs are the single source of truth for versions, so the
      # tag cannot drift from what was actually built. Renovate bumps the ARGs.
      - name: Derive Tag From Dockerfile
        id: meta
        run: |
          set -euo pipefail
          df=containers/timescaledb-cnpg/Dockerfile
          arg() { grep -oP "^ARG $1=\K.*" "$df" | tail -1; }
          ts=$(arg TS_VERSION); pg=$(arg PG_MAJOR); distro=$(arg DISTRO)
          toolkit=$(arg TOOLKIT_VERSION)
          for v in "$ts" "$pg" "$distro" "$toolkit"; do
            [ -n "$v" ] || { echo "::error::failed to parse versions from $df"; exit 1; }
          done
          echo "tag=${ts}-${pg}-${distro}" >> "$GITHUB_OUTPUT"
          echo "toolkit_tag=${ts}-tk${toolkit}-${pg}-${distro}" >> "$GITHUB_OUTPUT"
          echo "Building ${ts} (toolkit ${toolkit}) for PG ${pg} on ${distro}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log In To GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: containers/timescaledb-cnpg
          # Nodes are amd64 only; the extension carries compiled .so files that
          # must match the operand image's arch, so there is nothing to gain
          # from a QEMU-emulated arm64 build.
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.toolkit_tag }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails loudly if the TSL library is missing - an Apache-only build would
      # otherwise deploy fine and only fail when blocky calls
      # add_retention_policy() at startup.
      - name: Verify TSL Library Is Present
        run: |-
          set -euo pipefail
          # Cached from the build above, so this is nearly free. A scratch image
          # has no shell, so inspect the layer tarballs rather than running it.
          docker buildx build --load -t verify:local containers/timescaledb-cnpg
          docker save verify:local -o /tmp/verify.tar
          mkdir -p /tmp/verify && tar -xf /tmp/verify.tar -C /tmp/verify
          for b in /tmp/verify/blobs/sha256/*; do tar -tf "$b" 2>/dev/null; done > /tmp/entries || true
          found=$(grep -c 'lib/timescaledb-tsl-' /tmp/entries || true)
          if [ "$found" -eq 0 ]; then
            echo "::error::timescaledb-tsl-*.so not found - this is an Apache-only build"
            exit 1
          fi
          echo "Found the TSL library ($found match)" >> "$GITHUB_STEP_SUMMARY"
