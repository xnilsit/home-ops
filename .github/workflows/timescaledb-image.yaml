---
name: "TimescaleDB CNPG Extension Image"

on:
  push:
    branches:
      - "main"
    paths:
      - "containers/timescaledb-cnpg/**"
      - ".github/workflows/timescaledb-image.yaml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/timescaledb-cnpg
  # Shared across buildkitd replicas; credentials come from buildkitd's env.
  BUILDKIT_CACHE: type=s3,bucket=buildkit-cache,name=timescaledb-cnpg,region=us-east-1,endpoint_url=http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80,use_path_style=true

jobs:
  build:
    name: Build TimescaleDB Extension Image
    runs-on: home-ops-runner
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile ARGs are the single source of truth for versions, so the
      # tag cannot drift from what was actually built. Renovate bumps the ARGs.
      - name: Derive Tag From Dockerfile
        id: meta
        run: |
          set -euo pipefail
          df=containers/timescaledb-cnpg/Dockerfile
          arg() { grep -oP "^ARG $1=\K.*" "$df" | tail -1; }
          ts=$(arg TS_VERSION); pg=$(arg PG_MAJOR); distro=$(arg DISTRO)
          toolkit=$(arg TOOLKIT_VERSION)
          # The version the cluster runs now, bundled so it keeps working until the update Job runs
          prev=$(grep -oP '^\s*TIMESCALEDB_IMAGE_TAG: \K[0-9.]+(?=-)' kubernetes/apps/database/timescale/ks.yaml | head -1)
          for v in "$ts" "$pg" "$distro" "$toolkit" "$prev"; do
            [ -n "$v" ] || { echo "::error::failed to parse versions from $df"; exit 1; }
          done
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"
          echo "tag=${ts}-${pg}-${distro}" >> "$GITHUB_OUTPUT"
          echo "toolkit_tag=${ts}-tk${toolkit}-${pg}-${distro}" >> "$GITHUB_OUTPUT"
          echo "Building ${ts} (toolkit ${toolkit}, bundling ${prev}) for PG ${pg} on ${distro}" >> "$GITHUB_STEP_SUMMARY"

      # In-cluster rootless buildkitd over mTLS; the runner has no Docker daemon.
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: tcp://buildkitd.actions-runner-system.svc:1234
          driver-opts: |
            cacert=/home/runner/buildkit-certs/ca.crt
            cert=/home/runner/buildkit-certs/tls.crt
            key=/home/runner/buildkit-certs/tls.key

      - name: Log In To GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # s3 cache authenticates with buildkitd's own credentials.
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_EC2_METADATA_DISABLED: "true"
        with:
          context: containers/timescaledb-cnpg
          # Nodes are amd64 only; the extension carries compiled .so files that
          # must match the operand image's arch, so there is nothing to gain
          # from a QEMU-emulated arm64 build.
          platforms: linux/amd64
          build-args: |
            TS_PREV_VERSION=${{ steps.meta.outputs.prev }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.toolkit_tag }}
          provenance: true
          sbom: true
          cache-from: ${{ env.BUILDKIT_CACHE }}
          cache-to: ${{ env.BUILDKIT_CACHE }},mode=max

      # Fails loudly if the TSL library is missing - an Apache-only build would
      # otherwise deploy fine and only fail when blocky calls
      # add_retention_policy() at startup.
      - name: Verify TSL And Previous Libraries Are Present
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_EC2_METADATA_DISABLED: "true"
          TS_PREV_VERSION: ${{ steps.meta.outputs.prev }}
        run: |-
          set -euo pipefail
          # Cached from the build above, so this is nearly free. A scratch image
          # has no shell, so inspect the layer tarballs rather than running it.
          docker buildx build --cache-from "${BUILDKIT_CACHE}" --build-arg "TS_PREV_VERSION=${TS_PREV_VERSION}" --output type=oci,dest=/tmp/verify.tar containers/timescaledb-cnpg
          mkdir -p /tmp/verify && tar -xf /tmp/verify.tar -C /tmp/verify
          for b in /tmp/verify/blobs/sha256/*; do tar -tf "$b" 2>/dev/null; done > /tmp/entries || true
          found=$(grep -c 'lib/timescaledb-tsl-' /tmp/entries || true)
          if [ "$found" -eq 0 ]; then
            echo "::error::timescaledb-tsl-*.so not found - this is an Apache-only build"
            exit 1
          fi
          echo "Found the TSL library ($found match)" >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q "lib/timescaledb-${TS_PREV_VERSION}.so" /tmp/entries; then
            echo "::error::timescaledb-${TS_PREV_VERSION}.so not found - the running cluster would break on rollout"
            exit 1
          fi
