---
name: "Flate"

on:
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-job:
    name: Flate Pre-Job
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'home-ops-runner' }}
    permissions:
      contents: read
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            kubernetes/**
            .github/workflows/flate.yaml

  test:
    name: Flate Test
    needs: pre-job
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'home-ops-runner' }}
    permissions:
      contents: read
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # S3 on RGW on home-ops-runner; GitHub cache on hosted runners.
      - name: Restore flate cache
        uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        with:
          path: ${{ runner.temp }}/flate
          key: flate-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flate-${{ runner.os }}-${{ runner.arch }}-

      # base: "" keeps the test full-tree; the action's default would narrow it
      # to the change filter, which can miss a shared component or root patch
      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: ""
          cache: false

      - name: Run flate test
        run: |
          set -uo pipefail
          rc=0
          flate test all --path ./kubernetes | tee test.log || rc=$?
          {
            echo '### flate test'
            echo '```'
            cat test.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"

  diff:
    name: Flate Diff
    needs: pre-job
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'home-ops-runner' }}
    permissions:
      contents: read
      pull-requests: write
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      # fetch-depth 0 so the baseline rev resolves locally; HEAD is the PR merge
      # commit, whose second parent is the base tip, so that tip is the merge base
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # S3 on RGW on home-ops-runner; GitHub cache on hosted runners.
      - name: Restore flate cache
        uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        with:
          path: ${{ runner.temp }}/flate
          key: flate-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flate-${{ runner.os }}-${{ runner.arch }}-

      # base exports FLATE_BASE, which flate diff picks up as --base
      - name: Setup flate
        id: flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: origin/${{ github.event.pull_request.base.ref }}
          cache: false

      # The default --strip-attr set already covers the chart-bump noise
      # flux-local needed spelled out
      - name: Run flate diff
        id: diff
        run: |
          set -euo pipefail
          # flate writes nothing at all when there is no difference
          flate diff all --path ./kubernetes --output github > diff.patch
          if [[ -s diff.patch ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            flate diff all --path ./kubernetes --output html > diff.html
          fi

      - name: Upload Diff
        id: artifact
        if: ${{ steps.diff.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flate-diff-${{ github.event.pull_request.number }}
          path: diff.html
          retention-days: 14
          if-no-files-found: error

      - name: Build Comment
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          FLATE_VERSION: ${{ steps.flate.outputs.version }}
        run: |
          set -euo pipefail
          # A PR comment caps at 65536 characters and flate has no byte limit of
          # its own; dropping the last line of the cut also drops a split rune
          limit=60000
          note=""
          if [[ "$(wc -c < diff.patch)" -gt "${limit}" ]]; then
            head -c "${limit}" diff.patch | head -n -1 > diff.trunc
            note="truncated at ${limit} bytes, full diff in the artifact"
          else
            cp diff.patch diff.trunc
          fi
          {
            echo '### Diff'
            if [[ -s diff.trunc ]]; then
              echo '```diff'
              cat diff.trunc
              echo '```'
            else
              echo "No rendered changes against \`${GITHUB_BASE_REF}\`."
            fi
            footer="flate ${FLATE_VERSION}"
            [[ -n "${ARTIFACT_URL}" ]] && footer="${footer} · [HTML diff](${ARTIFACT_URL})"
            [[ -n "${note}" ]] && footer="${footer} · ${note}"
            echo
            echo "<sub>${footer}</sub>"
          } > comment.md
          cat comment.md >> "${GITHUB_STEP_SUMMARY}"

      # Posted unconditionally so a push that resolves the diff refreshes the
      # sticky comment instead of leaving a stale one
      - name: Add Comment
        continue-on-error: true
        uses: mshick/add-pr-comment@8e4927817251f1ff60c001f04568532b38e0b4a0 # v3.11
        with:
          message-id: "flate-diff"
          message-failure: Diff was not successful
          message-path: comment.md

  flate-status:
    name: Flate Success
    needs:
      - "pre-job"
      - "test"
      - "diff"
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'home-ops-runner' }}
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
