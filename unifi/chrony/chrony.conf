# Upstreams: PTB stratum 1 and Cloudflare, authenticated with NTS.
server ptbtime1.ptb.de iburst nts
server ptbtime2.ptb.de iburst nts
server ptbtime3.ptb.de iburst nts
server time.cloudflare.com iburst nts

driftfile /data/chrony/chrony.drift
ntsdumpdir /data/chrony/nts
makestep 1 3
rtcsync

# LAN, VLANs 10 and 1337, LAN ULA.
allow 192.168.0.0/23
allow 10.10.10.0/24
allow 10.13.37.0/24
allow fd2e:9a41:6b8c:1::/64
